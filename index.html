{l:["Assimilé salarié"],t:"Assimilé salarié",x:"Dirigeant de SA, gérant minoritaire ou égalitaire de SARL : régime général de la Sécurité sociale. Les écarts entre régimes se sont réduits."},
{l:["Impôt sur le revenu"],t:"L'impôt sur le revenu (IR)",x:"EI et EURL : le bénéfice est imposé avec les revenus personnels, selon un barème progressif."},
{l:["Impôt sur les soc."],t:"L'impôt sur les sociétés (IS)",x:"SARL, SA, SAS, SASU : le bénéfice est imposé à un taux proportionnel. Aucune structure n'est fiscalement meilleure dans tous les cas."}]},
{c:"a",l:["Apports"],t:"Les moyens financiers et matériels",x:"À la création d'une société, les associés font des apports en échange de parts ou d'actions.",leaves:[
{l:["Numéraire"],t:"Apport en numéraire",x:"De l'argent versé sur le compte de la société."},
{l:["Nature"],t:"Apport en nature",x:"Des biens : matériel informatique, véhicule, local…"},
{l:["Industrie"],t:"Apport en industrie",x:"Un savoir-faire, une expérience."},
{l:["Capital social"],t:"Le capital social",x:"Somme des apports en numéraire et en nature. Il fixe la part de chaque associé, rassure les créanciers et finance les premiers investissements."}]},
{c:"a",l:["Autres critères"],t:"Le choix à partir d'autres critères",x:"Des statuts simplifiés existent, et la structure peut évoluer avec l'entreprise.",leaves:[
{l:["Micro-entreprise"],t:"L'autoentreprise (micro-entreprise)",x:"Régime simplifié de l'entreprise individuelle, sous un plafond de chiffre d'affaires : démarches, fiscalité et cotisations allégées."},
{l:["Indépendant ?"],t:"Indépendant ou salarié ?",x:"S'il existe un lien de subordination, le contrat peut être requalifié en contrat de travail (débat sur les chauffeurs de plateformes comme Uber)."},
{l:["Évolution"],t:"Faire évoluer la structure",x:"Passer en société permet d'accueillir des capitaux extérieurs, de gagner en crédibilité et de faciliter la transmission."}]},
{c:"o",l:["ESS"],t:"L'économie sociale et solidaire",x:"Entreprendre autrement : utilité sociale, lucrativité encadrée, gouvernance démocratique.",leaves:[
{l:["Principes"],t:"Les principes de l'ESS",x:"But autre que le seul partage des bénéfices, bénéfices réinvestis dans l'activité, gestion démocratique, libre adhésion, solidarité."},
{l:["Loi ESS 2014"],t:"La loi du 31 juillet 2014",x:"Des sociétés commerciales peuvent entrer dans l'ESS si elles respectent ces critères ; l'agrément ESUS facilite leur financement."},
{l:["Coopératives"],t:"Les coopératives",x:"Propriété collective, une personne = une voix. Ex. : SCOP (associés salariés), banques coopératives, SCIC."},
{l:["Mutuelles"],t:"Les mutuelles",x:"Sans but lucratif : prévoyance et entraide financées par les cotisations des adhérents, un adhérent = une voix."}]}]},
cards:[
["p","Quelle est la différence essentielle entre entreprise individuelle et société ?","La société est une <mark>personne morale</mark> distincte des associés, avec son propre patrimoine ; l'EI <mark>se confond avec l'entrepreneur</mark>."],
["p","Comment le patrimoine de l'entrepreneur individuel est-il protégé depuis 2022 ?","Son <mark>patrimoine personnel</mark> est par défaut <mark>insaisissable</mark> par ses créanciers professionnels ; seuls les biens utiles à l'activité peuvent être saisis."],
["p","Que signifie « responsabilité limitée aux apports » ?","Dans une SARL, EURL, SAS, SASU ou SA, un associé ne peut perdre <mark>que ce qu'il a apporté</mark> : ses biens personnels sont à l'abri."],
["p","Quelles structures pour entreprendre seul ? À plusieurs ?","Seul : <mark>EI (dont micro-entreprise), EURL, SASU</mark>. À plusieurs : <mark>SARL, SAS, SA</mark>."],
["p","Quel régime matrimonial est le plus adapté aux affaires ?","La <mark>séparation de biens</mark> (ou le PACS) : les biens de chaque époux ne peuvent pas être saisis pour les dettes de l'autre."],
["s","Quels dirigeants relèvent du régime des indépendants ?","L'<mark>entrepreneur individuel</mark>, le gérant associé unique d'<mark>EURL</mark> et le gérant <mark>majoritaire</mark> de SARL."],
["s","Quels dirigeants sont assimilés salariés ?","Le dirigeant de <mark>SA</mark> et le gérant <mark>minoritaire ou égalitaire</mark> de SARL : ils relèvent du régime général."],
["s","IR ou IS ?","<mark>IR</mark> : EI et EURL, bénéfice imposé avec les revenus personnels (barème progressif). <mark>IS</mark> : SARL, SA, SAS, SASU, taux proportionnel."],
["f","Quels sont les trois types d'apports ?","En <mark>numéraire</mark> (argent), en <mark>nature</mark> (biens) et en <mark>industrie</mark> (savoir-faire)."],
["f","À quoi sert le capital social ?","Il fixe la <mark>part de chaque associé</mark>, montre la <mark>solidité</mark> de la société aux créanciers et finance les premiers investissements."],
["f","Qu'est-ce que la micro-entreprise ?","Un <mark>régime simplifié de l'entreprise individuelle</mark> (pas une société), avec démarches et prélèvements allégés, sous un <mark>plafond de chiffre d'affaires</mark>."],
["f","Pourquoi transformer une entreprise individuelle en société ?","Pour accueillir des <mark>capitaux extérieurs</mark>, gagner en <mark>crédibilité</mark>, choisir son régime fiscal et social et faciliter la <mark>transmission</mark>."],
["e","Quels sont les principes de l'économie sociale et solidaire ?","Un <mark>but autre que le partage des bénéfices</mark>, des bénéfices réinvestis, une <mark>gestion démocratique</mark>, la libre adhésion et la solidarité."],
["e","Coopérative ou mutuelle ?","Coopérative : entreprise à <mark>propriété collective</mark>, une personne = une voix (SCOP, banques coopératives). Mutuelle : organisme <mark>sans but lucratif</mark> de prévoyance financé par les cotisations."]],
qcm:[
["p","Une entreprise individuelle :",["N'a pas de personnalité morale distincte de l'entrepreneur","Est créée par des statuts entre plusieurs associés","A toujours un capital social minimum","Relève obligatoirement de l'IS"],"Elle se confond avec la personne de l'entrepreneur."],
["p","Depuis 2022, les créanciers professionnels d'un entrepreneur individuel peuvent saisir :",["Seulement les biens utiles à son activité, par défaut","Tous ses biens personnels","Uniquement sa résidence principale","Rien du tout"],"Son patrimoine personnel est par défaut protégé."],
["p","Pour créer seul une société, on peut choisir :",["Une EURL ou une SASU","Une SARL à plusieurs associés","Une SA","Une coopérative"],"L'EI, dont la micro-entreprise, permet aussi d'entreprendre seul, mais ce n'est pas une société."],
["p","Quel régime matrimonial est déconseillé à l'entrepreneur ?",["La communauté réduite aux acquêts","La séparation de biens","Le PACS avec séparation","Aucun"],"Les biens acquis pendant le mariage y sont engagés dans l'activité."],
["s","Le gérant majoritaire d'une SARL relève :",["Du régime des travailleurs indépendants","Du régime général des salariés","D'aucun régime","Du régime des fonctionnaires"],"Le gérant minoritaire ou égalitaire, lui, est assimilé salarié."],
["s","Les bénéfices d'une SAS sont soumis :",["À l'impôt sur les sociétés","À l'impôt sur le revenu de chaque salarié","À aucun impôt","À la TVA uniquement"],"L'EI et l'EURL relèvent en principe de l'impôt sur le revenu."],
["f","Un associé apporte son savoir-faire à la société. C'est un apport :",["En industrie","En numéraire","En nature","En capital"],"L'apport en nature concerne des biens ; l'apport en numéraire, de l'argent."],
["f","La micro-entreprise est :",["Un régime simplifié de l'entreprise individuelle","Une société anonyme","Une coopérative","Une société unipersonnelle"],"Elle bénéficie de démarches et de prélèvements simplifiés sous un plafond de chiffre d'affaires."],
["f","Un travailleur « indépendant » qui travaille sous les ordres d'un donneur d'ordre peut voir son contrat requalifié en :",["Contrat de travail","Contrat de société","Contrat de franchise","Promesse de vente"],"C'est le lien de subordination qui caractérise le contrat de travail."],
["e","Dans une coopérative, le principe de vote est :",["Une personne, une voix","Une action, une voix","Le vote du seul dirigeant","Le vote des clients uniquement"],"La propriété est collective et le pouvoir s'exerce démocratiquement."],
["e","Une SCOP est une coopérative dont les associés sont :",["Les salariés","Les clients","L'État","Les fournisseurs"],"Dans les banques coopératives, les associés sont les clients."]]},

en:{intro:"The criteria for choosing between sole proprietorship and company, and the forms of the social and solidarity economy.",
cats:{p:["Assets and power","v"],s:["Social security and tax","t"],f:["Contributions and other criteria","a"],e:["Social and solidarity economy","o"]},
map:{root:{l:["Legal","structure"],t:"Choosing a legal structure",x:"The legal structure is the legal framework for the business. The choice depends on assets, power, the manager's social status, tax, financial means, and changes as the business grows."},
cols:[
{c:"v",l:["Assets"],t:"Assets and power",x:"Sole proprietorship or company: a choice that affects personal assets and how power is exercised.",leaves:[
{l:["Sole proprietor"],t:"Sole proprietorship (EI)",x:"No separate legal personality: the business and the owner are one. Simple to set up and run, suited to small activities."},
{l:["Company"],t:"The company",x:"A legal entity created by a contract (the articles of association), with its own name, registered office and assets (SA, SAS, SASU, SARL, EURL)."},
{l:["Owner's assets"],t:"Protecting the sole proprietor",x:"Since 2022, the owner's personal assets are by default protected from business creditors: only assets used for the business can be seized."},
{l:["Limited liability"],t:"Limited liability",x:"In SA, SAS, SASU, SARL and EURL companies, partners can lose at most what they contributed."},
{l:["Alone or together"],t:"Power",x:"Alone: EI, EURL, SASU (undivided power). Together: SARL, SAS, SA (shared power). The SAS leaves great freedom to the articles."},
{l:["Marriage regime"],t:"Matrimonial considerations",x:"Community of acquired property: assets acquired during marriage are at risk. Separation of property (or PACS): better suited to business."}]},
{c:"t",l:["Social, tax"],t:"Social security and tax objectives",x:"The manager's social status and how profits are taxed vary by structure.",leaves:[
{l:["Self-employed"],t:"Self-employed status",x:"Sole proprietor, sole-partner manager of an EURL, majority manager of a SARL: self-employed social security scheme."},
{l:["Like an employee"],t:"Treated as an employee",x:"Head of an SA, minority or equal manager of a SARL: general social security scheme. The gap between schemes has narrowed."},
{l:["Income tax"],t:"Income tax (IR)",x:"EI and EURL: profit is taxed with the owner's personal income, on a progressive scale."},
{l:["Corporate tax"],t:"Corporate tax (IS)",x:"SARL, SA, SAS, SASU: profit is taxed at a proportional rate. No structure is better for tax in every case."}]},
{c:"a",l:["Contributions"],t:"Financial and material means",x:"When a company is formed, partners make contributions in exchange for shares.",leaves:[
{l:["Cash"],t:"Cash contribution",x:"Money paid into the company's account."},
{l:["In kind"],t:"Contribution in kind",x:"Assets: computer equipment, a vehicle, premises…"},
{l:["Skills"],t:"Contribution of skills",x:"Know-how, experience."},
{l:["Share capital"],t:"Share capital",x:"Total cash and in-kind contributions. It sets each partner's stake, reassures creditors and funds the first investments."}]},
{c:"a",l:["Other criteria"],t:"Other criteria",x:"Simplified regimes exist, and the structure can change as the business grows.",leaves:[
{l:["Micro-business"],t:"Micro-enterprise (auto-entrepreneur)",x:"A simplified form of sole proprietorship below a turnover ceiling: lighter formalities, tax and contributions."},
{l:["Really independent?"],t:"Self-employed or employee?",x:"If there is subordination, the contract can be reclassified as an employment contract (debate over platform drivers such as Uber)."},
{l:["Changing form"],t:"Changing the structure",x:"Becoming a company allows outside investment, adds credibility and makes handing on the business easier."}]},
{c:"o",l:["Social economy"],t:"The social and solidarity economy (ESS)",x:"Doing business differently: social purpose, limited profit-seeking, democratic governance.",leaves:[
{l:["Principles"],t:"ESS principles",x:"A goal beyond sharing profits, profits reinvested in the activity, democratic management, open membership, solidarity."},
{l:["2014 ESS Act"],t:"The Act of 31 July 2014",x:"Commercial companies can join the ESS if they meet these criteria; the ESUS approval helps them raise funds."},
{l:["Cooperatives"],t:"Cooperatives",x:"Collective ownership, one member = one vote. E.g. worker cooperatives (SCOP), cooperative banks, SCIC."},
{l:["Mutuals"],t:"Mutual societies",x:"Non-profit: insurance and mutual aid funded by members' contributions, one member = one vote."}]}]},
cards:[
["p","What is the key difference between a sole proprietorship and a company?","A company is a <mark>legal entity</mark> separate from its partners, with its own assets; a sole proprietorship <mark>is the owner</mark>."],
["p","How have the sole proprietor's assets been protected since 2022?","Their <mark>personal assets</mark> are by default <mark>protected</mark> from business creditors; only assets used for the business can be seized."],
["p","What does 'liability limited to contributions' mean?","In a SARL, EURL, SAS, SASU or SA, a partner can lose <mark>only what they contributed</mark>: personal assets are safe."],
["p","Which structures to start alone? With others?","Alone: <mark>EI (including micro-enterprise), EURL, SASU</mark>. With others: <mark>SARL, SAS, SA</mark>."],
["p","Which marriage regime best suits business?","<mark>Separation of property</mark> (or PACS): each spouse's assets cannot be seized for the other's debts."],
["s","Which managers are in the self-employed scheme?","The <mark>sole proprietor</mark>, the sole-partner manager of an <mark>EURL</mark> and the <mark>majority</mark> manager of a SARL."],
["s","Which managers are treated as employees?","The head of an <mark>SA</mark> and the <mark>minority or equal</mark> manager of a SARL: general scheme."],
["s","Income tax or corporate tax?","<mark>Income tax</mark>: EI and EURL, profit taxed with personal income (progressive). <mark>Corporate tax</mark>: SARL, SA, SAS, SASU, proportional rate."],
["f","What are the three types of contribution?","<mark>Cash</mark>, <mark>in kind</mark> (assets) and <mark>skills</mark> (know-how)."],
["f","What is share capital for?","It sets <mark>each partner's stake</mark>, shows creditors the company's <mark>soundness</mark> and funds the first investments."],
["f","What is a micro-enterprise?","A <mark>simplified form of sole proprietorship</mark> (not a company), with lighter formalities and charges, below a <mark>turnover ceiling</mark>."],
["f","Why turn a sole proprietorship into a company?","To bring in <mark>outside capital</mark>, gain <mark>credibility</mark>, choose the tax and social regime and make <mark>handing on</mark> the business easier."],
["e","What are the principles of the social and solidarity economy?","A <mark>goal beyond sharing profits</mark>, profits reinvested, <mark>democratic management</mark>, open membership and solidarity."],
["e","Cooperative or mutual society?","Cooperative: a business with <mark>collective ownership</mark>, one person = one vote (SCOP, cooperative banks). Mutual: a <mark>non-profit</mark> insurance body funded by contributions."]],
qcm:[
["p","A sole proprietorship:",["Has no legal personality separate from the owner","Is created by articles between several partners","Always has minimum share capital","Must pay corporate tax"],"It is one and the same as the owner."],
["p","Since 2022, a sole proprietor's business creditors can seize:",["By default, only assets used for the business","All personal assets","Only the main home","Nothing"],"Personal assets are protected by default."],
["p","To set up a company alone, you can choose:",["An EURL or a SASU","A SARL with several partners","An SA","A cooperative"],"A sole proprietorship, including a micro-enterprise, also lets you work alone, but it is not a company."],
["p","Which marriage regime is not advisable for an entrepreneur?",["Community of acquired property","Separation of property","PACS with separate assets","None"],"Assets acquired during marriage are at risk from business debts."],
["s","The majority manager of a SARL is in:",["The self-employed scheme","The general employee scheme","No scheme","The civil service scheme"],"A minority or equal manager is treated as an employee."],
["s","Profits of an SAS are subject to:",["Corporate tax","Each employee's income tax","No tax","VAT only"],"Sole proprietorships and EURLs normally pay income tax."],
["f","A partner contributes know-how to the company. This is a contribution:",["Of skills","In cash","In kind","Of capital"],"In-kind contributions are assets; cash contributions are money."],
["f","A micro-enterprise is:",["A simplified form of sole proprietorship","A public limited company","A cooperative","A single-member company"],"It has simplified formalities and charges below a turnover ceiling."],
["f","A 'self-employed' worker who works under a client's orders may see their contract reclassified as:",["An employment contract","A partnership agreement","A franchise agreement","A promise to sell"],"Subordination is what defines an employment contract."],
["e","In a cooperative, voting works on the basis of:",["One person, one vote","One share, one vote","The manager alone","Customers only"],"Ownership is collective and power is exercised democratically."],
["e","A SCOP is a cooperative whose members are:",["Its employees","Its customers","The State","Its suppliers"],"In cooperative banks, the members are the customers."]]}
};

const EN14={intro:"Contractual and non-contractual civil liability.",
cats:{c:["Contractual liability","v"],e:["Non-contractual liability","t"],g:["Common to both","n"]},
map:{root:{l:["Business","liability"],t:"Civil liability",x:"Any business can cause harm: to a contracting party (a badly performed contract) or to a third party (accident, defective product, data leak). The law organises compensation in both cases."},
groups:[{l:["Contractual"],t:"Contractual liability",x:"Arises from a fault in performing the contract: total non-performance, partial or defective performance, or delay.",c:"v",cols:[0,1]},
{l:["Non-contractual"],t:"Non-contractual liability",x:"Also called tort liability: there is no contract between the person at fault and the victim (passers-by, competitors, customers' customers, individuals).",c:"t",cols:[2,3]}],
cols:[
{c:"v",l:["A. Obligations"],t:"Obligation of means or of result",x:"A distinction created by case law: it decides who must prove what, and how the debtor can escape liability.",leaves:[
{l:["Result"],t:"Obligation of result",x:"A precise result is promised (a carrier delivers on the agreed date). The creditor proves non-performance and harm: fault is presumed. Only an external cause frees the debtor."},
{l:["Means"],t:"Obligation of means",x:"Doing one's best without guaranteeing the result (a lawyer, a consultancy). The creditor proves harm, non-performance and fault. The debtor escapes by proving no fault."},
{l:["Test: uncertainty"],t:"How to classify the obligation?",x:"Obligation of means if the result depends on chance or on the client's active involvement; of result if there is no uncertainty. The classification follows what the service really is."}]},
{c:"v",l:["B. Sanctions"],t:"Sanctions for non-performance",x:"They can be combined with damages. The judge checks whether non-performance is proven, total or partial, and excusable.",leaves:[
{l:["Specific perform."],t:"Specific performance",x:"The judge orders the debtor to perform, unless clearly disproportionate. Impossible if the service can no longer be provided."},
{l:["Price reduction"],t:"Price reduction",x:"Imperfect performance is accepted in exchange for a lower price."},
{l:["Rescission"],t:"Rescission (résolution)",x:"One-off contract: cancelled retroactively, with mutual restitution."},
{l:["Termination"],t:"Termination (résiliation)",x:"Ongoing contract: only future effects disappear."}]},
{c:"t",l:["A. Grounds"],t:"Grounds in the Civil Code",x:"Three sources: one's own act, things in one's care, the acts of others.",leaves:[
{l:["Own act"],t:"Own act (art. 1240)",x:"Intentional fault (disparaging a competitor) or negligence (an unmarked wet floor)."},
{l:["Things"],t:"Things in one's care",x:"A thing in one's care causes harm: a badly fixed sign, a machine, a vehicle, a product."},
{l:["Acts of others"],t:"Acts of others (art. 1242)",x:"An employer is liable for harm caused by an employee at work (a delivery driver hits a pedestrian)."},
{l:["Cyberattack"],t:"Victim… but liable?",x:"Yes, if protection was inadequate for the known risk. GDPR art. 82: exemption only if the harm is 'in no way attributable' to it."}]},
{c:"t",l:["B. Compensation"],t:"Compensating the harm",x:"Financial or moral harm, repaired in kind or by money. Liability can reach the managers.",leaves:[
{l:["Material harm"],t:"Financial (patrimonial) harm",x:"Physical or material: for example lost turnover after a shop is forced to close."},
{l:["Moral harm"],t:"Moral harm",x:"Worry, loss of trust. According to the CJEU, compensable with no seriousness threshold: a well-founded fear of misuse is enough."},
{l:["In kind / money"],t:"In kind or by damages",x:"In kind: less common (repairing damaged property). By equivalent: damages, the most common."},
{l:["Managers, NIS 2"],t:"Managers' liability",x:"NIS 2 strengthens their oversight of cyber risks; personal liability is possible for gross negligence."}]}],
footer:{caption:"Three conditions common to both types of liability",join:"+",items:[
{l:["Triggering event"],t:"Triggering event",x:"What caused the harm: non-performance, fault, a thing or an employee."},
{l:["Harm"],t:"Harm",x:"It must be certain: material, physical or moral."},
{l:["Causal link"],t:"Causal link",x:"The harm must result directly from the triggering event."}]}},
cards:[
["c","When is contractual liability incurred?","When harm results from a <mark>fault in performing a contract</mark>: total non-performance, partial or defective performance, or delay."],
["c","Where does the distinction between obligation of means and of result come from?","It comes <mark>purely from case law</mark>. It matters because the rules on proof and exemption differ."],
["c","What is an obligation of result?","The debtor commits to <mark>achieving a specific result</mark>. E.g. a carrier promises to deliver goods intact, to the right address, on the agreed date."],
["c","Obligation of result: what must the creditor prove?","Only <mark>non-performance and the harm</mark>. The debtor's fault is presumed."],
["c","How can the debtor of an obligation of result escape liability?","Only by proving an <mark>external cause</mark>: force majeure, act of a third party or the victim's fault. 'Doing one's best' is not enough."],
["c","What is an obligation of means?","The debtor commits to <mark>using all reasonable means</mark> to reach the result, without guaranteeing it. E.g. a lawyer cannot guarantee winning the case."],
["c","Obligation of means: what must the creditor prove?","The <mark>harm, the non-performance and the debtor's fault</mark>."],
["c","How can the debtor of an obligation of means escape liability?","By proving <mark>they were not at fault</mark>."],
["c","How does the judge tell an obligation of means from one of result?","Mainly by looking at <mark>uncertainty</mark> and the <mark>client's role</mark>. If the result depends on chance or on the client's active involvement, it is an obligation of means; if not, of result."],
["c","What can sanctions for non-performance be combined with?","With <mark>damages</mark>."],
["c","What is specific performance, and when is it impossible?","The creditor asks the judge to <mark>order the debtor to perform</mark>. Refused if clearly disproportionate; impossible if the service can no longer be provided."],
["c","What is a price reduction?","The creditor <mark>accepts imperfect performance</mark> in exchange for a lower price."],
["c","What is rescission (résolution)?","For a <mark>one-off</mark> contract: it is cancelled <mark>retroactively</mark> and the parties are put back where they were (mutual restitution)."],
["c","What is termination (résiliation)?","For an <mark>ongoing</mark> contract (lease, subscription, maintenance): only <mark>future effects</mark> end; past services stand."],
["c","What does the court assess in case of non-performance?","Whether it is <mark>proven</mark>, <mark>total or partial</mark>, and <mark>excusable</mark>."],
["e","When is liability non-contractual?","When there is <mark>no contract</mark> between the person at fault and the victim (tort). E.g. a company's delivery van damages a passer-by's car."],
["e","What is liability for one's own act?","Article 1240: an <mark>intentional fault</mark> or <mark>negligence</mark> causes harm to others."],
["e","What is liability for things?","One is liable for harm caused by a <mark>thing in one's care</mark>. E.g. a shop's badly fixed sign falls and injures a passer-by."],
["e","What is liability for the acts of others?","Article 1242: <mark>an employer is liable for harm caused by an employee</mark> at work. E.g. a delivery driver hits a pedestrian on their round."],
["e","Can a business hit by a cyberattack be liable to third parties?","Yes, if it <mark>failed in its security obligations</mark> (no protection proportionate to the known risk), even though the attacker is a third party."],
["e","What does article 82 of the GDPR provide?","A specific right to compensation: the data controller is exempt only if the harm is <mark>'in no way attributable'</mark> to it."],
["e","Is moral harm from a data leak compensable if the data has not been misused?","Yes. According to the CJEU, <mark>with no seriousness threshold</mark>: a <mark>well-founded fear of misuse</mark> is enough."],
["e","What are the two forms of compensation?","<mark>In kind</mark>, less common (e.g. repairing a damaged shop window), and <mark>by equivalent</mark>, the most common: damages."],
["e","Can managers be personally liable for cybersecurity?","Yes: the <mark>NIS 2 directive</mark> strengthens their duty to oversee cyber risks and can make them personally liable for <mark>gross negligence</mark>."],
["g","What are the three conditions of civil liability?","A <mark>triggering event</mark>, <mark>certain harm</mark> and a <mark>causal link</mark> between them. They apply to both contractual and non-contractual liability."],
["g","Financial versus non-financial harm?","Financial: <mark>physical or material</mark> (e.g. lost turnover). Non-financial: <mark>moral</mark> (e.g. a victim's suffering, damage to reputation)."]],
qcm:[
["c","When is contractual civil liability incurred?",["When harm results from a fault in performing a contract","When harm is caused to someone with no contract","Only when a crime is committed","When a business refuses to sign a contract"],"The fault may be total non-performance, partial or defective performance, or delay."],
["c","Where does the distinction between obligations of means and of result come from?",["Case law","An EU regulation","The Criminal Code","A collective agreement"],"It matters because proof and exemption rules differ."],
["c","A carrier promises to deliver an order intact on the agreed date. This is an obligation:",["Of result","Of means","Of enhanced means","Non-contractual"],"The carrier commits to a specific result with no particular uncertainty."],
["c","In an obligation of result, what must the creditor prove?",["Only non-performance and harm, fault being presumed","Harm, non-performance and the debtor's fault","Only the debtor's fault","Nothing: the judge handles proof"],"The debtor's fault is presumed."],
["c","How can the debtor of an obligation of result escape liability?",["By proving an external cause","By proving they did their best","By proving they were not at fault","Never"],"Only force majeure, a third party's act or the victim's fault will do."],
["c","In an obligation of means, what must the creditor prove?",["Harm, non-performance and the debtor's fault","Only non-performance","Only the harm","An external cause"],"The debtor can escape by proving they were not at fault."],
["c","A lawyer agrees to defend a client without being able to guarantee winning. This is an obligation:",["Of means","Of result","Non-contractual","With no legal value"],"The outcome of a trial is uncertain."],
["c","When does specific performance become impossible?",["When the service can no longer be provided","As soon as the debtor refuses","When the contract was signed online","When the creditor has already paid"],"It is also refused if clearly disproportionate."],
["c","For an ongoing contract (lease, subscription), which sanction ends only future effects?",["Termination","Rescission","Price reduction","Specific performance"],"Services already performed are not undone."],
["c","What is rescission of a contract?",["Retroactive cancellation of a one-off contract, with mutual restitution","Ending only future effects","A lower price for imperfect performance","Friendly renegotiation"],"The parties are put back as they were before the contract."],
["e","When is liability non-contractual (tort)?",["When there is no contract between the person at fault and the victim","When a contract was badly performed","During advanced negotiations","When harm is purely material"],"E.g. a company's delivery van damages a passer-by's car."],
["e","A business publicly disparages a competitor, which loses customers. On what ground can the competitor sue?",["Own act (art. 1240)","Acts of others","Contractual liability","Force majeure"],"Own-act liability covers intentional faults as well as negligence."],
["e","An employed delivery driver hits a pedestrian on their round. The employer is liable for:",["The acts of others","The pedestrian's own act","Privity of contract","A penalty clause"],"Employers are liable for harm caused by employees at work (art. 1242)."],
["e","A shop's badly fixed sign falls and injures a passer-by. This is liability for:",["Things in one's care","The acts of others","Contract","Crime only"],"The shop is in charge of its sign."],
["e","Can a business hit by a cyberattack be liable to third parties whose data leaked?",["Yes, if it failed in its security obligations","Never, because the attacker is a third party","Always, even with perfect security","No, unless it paid a ransom"],"Its fault can be established if protection was not proportionate to the known risk."],
["e","Under GDPR article 82, how can a data controller escape liability?",["By proving the harm is in no way attributable to it","By proving it was also a victim","By paying symbolic compensation","By deleting the data after the leak"],"Exemption is very hard to obtain."],
["e","What are the three conditions of civil liability?",["A triggering event, certain harm and a causal link","A crime, a complaint and a judgment","A contract, a signature and a payment","A formal notice, a deadline and a penalty"],"All three must always be present."],
["e","According to recent EU case law, moral harm from a data leak:",["Is compensable with no seriousness threshold","Is never compensable","Is compensable only if identity theft occurred","Is compensable only for businesses"],"Worry or loss of trust is compensable non-financial harm."],
["e","Which form of compensation is most common?",["Damages (by equivalent)","Compensation in kind","A public apology","Closing the business"],"Compensation in kind is less common in practice."],
["e","What does the EU NIS 2 directive provide on cybersecurity?",["It strengthens managers' obligations and can make them personally liable for gross negligence","It exempts managers from all liability","It bans businesses from storing data","It only concerns individuals"],"Liability can reach the managers who oversee cyber risks."]]};

fr:{intro:"Les styles de direction, les structures, les mécanismes de coordination et de contrôle.",
cats:{s:["Styles de direction","v"],t:["Structures","t"],c:["Coordination","a"],k:["Contrôle","o"]},
map:{root:{l:["Organiser","l'activité"],t:"L'organisation de l'activité de l'entreprise",x:"Pour atteindre ses objectifs, l'entreprise choisit une manière de diriger, une structure, des mécanismes de coordination et des modes de contrôle."},
cols:[
{c:"v",l:["Styles (Likert)"],t:"Les styles de direction (Likert)",x:"La manière dont le dirigeant partage le pouvoir et la décision. Elle dépend de sa personnalité, de la taille, de la structure, des salariés et de l'environnement.",leaves:[
{l:["Autoritaire"],t:"Style autoritaire",x:"Décisions prises au sommet, objectifs imposés, contrôle par menaces et sanctions, communication descendante, aucune confiance."},
{l:["Paternaliste"],t:"Style paternaliste",x:"Autorité bienveillante, souci du bien-être des salariés, peu d'initiative, récompenses et sanctions."},
{l:["Consultatif"],t:"Style consultatif",x:"Les salariés sont consultés avant la décision finale ; confiance, travail en équipe, communication dans les deux sens."},
{l:["Participatif"],t:"Style participatif",x:"Décisions décentralisées, objectifs négociés avec le groupe, intéressement aux résultats, confiance totale."},
{l:["Pas de style pur"],t:"Un classement théorique",x:"Sur le terrain, un manager adapte son style selon la situation."}]},
{c:"t",l:["Structures"],t:"Les structures",x:"La structure répartit, coordonne et contrôle les activités pour atteindre les objectifs avec efficacité et efficience.",leaves:[
{l:["Organigramme"],t:"L'organigramme",x:"Représentation des liens hiérarchiques et fonctionnels. Limites : figé, formel, n'indique pas les relations informelles."},
{l:["Hiérarchique"],t:"Structure hiérarchique (Fayol)",x:"Unité de commandement : un seul chef. Simple et efficace, mais peut devenir bureaucratique."},
{l:["Fonctionnelle"],t:"Structure fonctionnelle (Taylor)",x:"Divisions par grandes fonctions confiées à des spécialistes ; un salarié a plusieurs chefs."},
{l:["Divisionnelle"],t:"Structure divisionnelle",x:"Regroupement par produit, client ou région ; chaque division est un centre de profit autonome."},
{l:["Matricielle"],t:"Structure matricielle",x:"Croise fonctions et produits ou projets ; adaptée aux environnements changeants."}]},
{c:"t",l:["Mintzberg"],t:"L'approche de Mintzberg",x:"La structure est un assemblage de six parties : centre opérationnel, sommet stratégique, ligne hiérarchique, technostructure, support logistique, idéologie.",leaves:[
{l:["Six parties"],t:"Les six parties",x:"Ceux qui produisent, ceux qui dirigent, l'encadrement intermédiaire, les spécialistes des méthodes, les services internes, et les valeurs partagées."},
{l:["Entrepreneuriale"],t:"Organisation entrepreneuriale",x:"Petite ou jeune entreprise : le dirigeant coordonne tout par supervision directe."},
{l:["Mécaniste"],t:"Organisation mécaniste",x:"Grande entreprise bureaucratique et centralisée, procédés très standardisés."},
{l:["Divisionnalisée"],t:"Organisation divisionnalisée",x:"Divisions autonomes ; le sommet fixe et contrôle leurs résultats."},
{l:["Professionnelle"],t:"Organisation professionnelle",x:"Experts autonomes (cabinets comptables, conseil), coordination par les qualifications."},
{l:["Adhocratie"],t:"Adhocratie (organisation innovatrice)",x:"Experts de métiers différents en équipes projet, ajustement mutuel (agences de publicité, centres de recherche)."}]},
{c:"a",l:["Coordination"],t:"Les mécanismes de coordination (Mintzberg)",x:"La spécialisation du travail oblige à coordonner les acteurs pour qu'ils agissent en cohérence.",leaves:[
{l:["Ajustement mutuel"],t:"Ajustement mutuel",x:"Arrangements directs entre opérateurs, quand l'équipe est petite et la tâche simple."},
{l:["Supervision directe"],t:"Supervision directe",x:"Un responsable coordonne le travail des autres."},
{l:["Std. procédés"],t:"Standardisation des procédés",x:"Des règles et procédures décrivent comment faire."},
{l:["Std. résultats"],t:"Standardisation des résultats",x:"Les résultats attendus sont fixés à l'avance ; adapté aux grandes entreprises multidivisionnelles."},
{l:["Std. qualifications"],t:"Standardisation des qualifications",x:"Des formations communes font que chacun sait comment travailler avec les autres (ex. : l'hôpital)."},
{l:["Std. normes"],t:"Standardisation des normes",x:"Les valeurs et la culture coordonnent (ex. : des start-up comme BlaBlaCar)."}]},
{c:"o",l:["Contrôle"],t:"Les mécanismes de contrôle",x:"Manager, c'est diriger, mobiliser et contrôler.",leaves:[
{l:["Analyse des écarts"],t:"Comparer objectifs et résultats",x:"Mesurer les écarts pour décider d'actions correctrices ou renforcer ce qui marche."},
{l:["Tous niveaux"],t:"Un contrôle à tous les niveaux",x:"Décisions stratégiques (direction) et opérationnelles (encadrement) ; objectifs financiers mais aussi RSE."},
{l:["Selon le style"],t:"Contrôle et style de direction",x:"Autoritaire ou paternaliste : contrôles omniprésents et procédures. Consultatif ou participatif : comparaison objectifs / résultats."},
{l:["Décentralisation"],t:"La décentralisation",x:"Le pouvoir descend vers des unités autonomes : décisions plus pertinentes, plus de réactivité, salariés plus motivés."}]}]},
cards:[
["s","Qu'est-ce qu'un style de direction ?","La manière dont le dirigeant <mark>partage le pouvoir et la décision</mark>. Likert en distingue quatre."],
["s","Quels sont les quatre styles de direction de Likert ?","<mark>Autoritaire</mark>, <mark>paternaliste</mark>, <mark>consultatif</mark> et <mark>participatif</mark>."],
["s","Style autoritaire ou participatif ?","Autoritaire : décisions au <mark>sommet</mark>, objectifs imposés, sanctions. Participatif : décisions <mark>décentralisées</mark>, objectifs négociés, confiance totale."],
["s","Qu'est-ce qui distingue le style consultatif ?","Les salariés sont <mark>consultés avant la décision</mark>, que la hiérarchie prend ensuite ; la communication va dans les deux sens."],
["t","Qu'est-ce qu'un organigramme, et quelles sont ses limites ?","Une représentation des <mark>liens hiérarchiques et fonctionnels</mark>. Limites : <mark>figé</mark>, formel, sans les relations informelles."],
["t","Structure hiérarchique ou fonctionnelle ?","Hiérarchique (Fayol) : <mark>un seul chef</mark>. Fonctionnelle (Taylor) : des spécialistes, <mark>plusieurs chefs</mark>."],
["t","Structure divisionnelle ou matricielle ?","Divisionnelle : divisions par <mark>produit, client ou région</mark>, centres de profit. Matricielle : croise <mark>fonctions et projets</mark>."],
["t","Quelles sont les six parties de l'organisation selon Mintzberg ?","<mark>Centre opérationnel</mark>, <mark>sommet stratégique</mark>, <mark>ligne hiérarchique</mark>, <mark>technostructure</mark>, <mark>support logistique</mark>, <mark>idéologie</mark>."],
["t","Qu'est-ce qu'une adhocratie ?","Une organisation <mark>innovatrice</mark> où des experts de métiers différents travaillent en <mark>équipes projet</mark> par ajustement mutuel."],
["c","Pourquoi faut-il coordonner le travail ?","Parce que la <mark>spécialisation</mark> du travail oblige à faire agir les acteurs <mark>en cohérence</mark>."],
["c","Quels sont les six mécanismes de coordination de Mintzberg ?","<mark>Ajustement mutuel</mark>, <mark>supervision directe</mark>, standardisation des <mark>procédés</mark>, des <mark>résultats</mark>, des <mark>qualifications</mark> et des <mark>normes</mark>."],
["c","Quand utilise-t-on l'ajustement mutuel ?","Quand le <mark>nombre d'acteurs est faible</mark> et la coordination peu complexe : les opérateurs s'arrangent directement."],
["k","À quoi servent les mécanismes de contrôle ?","À <mark>comparer les objectifs et les résultats</mark> pour mesurer les écarts et décider d'<mark>actions correctrices</mark>."],
["k","Comment le contrôle dépend-il du style de direction ?","Autoritaire : contrôles <mark>omniprésents</mark> et procédures précises. Participatif : <mark>comparaison objectifs / résultats</mark>."],
["k","Qu'est-ce que la décentralisation et quels sont ses avantages ?","Le pouvoir est <mark>réparti entre des unités autonomes</mark> : décisions plus <mark>pertinentes</mark>, plus de <mark>réactivité</mark>, salariés plus <mark>motivés</mark>."]],
qcm:[
["s","Un dirigeant impose les objectifs et contrôle par les sanctions. Son style est :",["Autoritaire","Participatif","Consultatif","Adhocratique"],"La communication y est descendante et la confiance très faible."],
["s","Un manager consulte son équipe puis décide seul. Son style est :",["Consultatif","Autoritaire","Participatif","Paternaliste"],"Dans le style participatif, les décisions sont prises avec le groupe."],
["s","Le style paternaliste se caractérise par :",["Une autorité bienveillante et le souci du bien-être des salariés","Des objectifs négociés avec le groupe","L'absence totale de hiérarchie","Des décisions décentralisées"],"Les salariés y ont peu d'initiative."],
["t","Dans la structure hiérarchique de Fayol :",["Chaque salarié n'a qu'un seul chef","Chaque salarié a plusieurs chefs","Il n'y a pas de chef","Les divisions sont des centres de profit"],"C'est le principe d'unité de commandement."],
["t","Une entreprise organisée en divisions par région, chacune responsable de ses résultats, a une structure :",["Divisionnelle","Fonctionnelle","Hiérarchique","Entrepreneuriale"],"Chaque division est un centre de profit autonome."],
["t","Selon Mintzberg, les spécialistes qui conçoivent les méthodes de travail forment :",["La technostructure","Le centre opérationnel","Le sommet stratégique","L'idéologie"],"Ils rendent plus efficace le travail des autres."],
["t","Une agence de publicité travaillant en équipes projet pluridisciplinaires est plutôt :",["Une adhocratie","Une organisation mécaniste","Une organisation divisionnalisée","Une organisation entrepreneuriale"],"Les experts s'y coordonnent par ajustement mutuel."],
["c","À l'hôpital, médecins et infirmiers savent travailler ensemble grâce à leur formation. C'est la standardisation :",["Des qualifications","Des résultats","Des normes","Des procédés uniquement"],"Les parcours de formation sont standardisés."],
["c","Dans une start-up, des valeurs très partagées guident le comportement de chacun. C'est la standardisation :",["Des normes","Des résultats","Des qualifications","Des procédés"],"Les valeurs et la culture jouent le rôle de coordination."],
["k","Contrôler, c'est surtout :",["Comparer les objectifs aux résultats pour corriger les écarts","Sanctionner les salariés","Rédiger l'organigramme","Fixer les salaires"],"Le contrôle concerne tous les objectifs et tous les niveaux."],
["k","Quel est un avantage de la décentralisation ?",["Des décisions plus rapides et mieux informées","Un pouvoir concentré au sommet","Moins d'autonomie pour les unités","Davantage de supervision directe"],"Elle motive aussi davantage les salariés."]]},

cats:{s:["Management styles","v"],t:["Structures","t"],c:["Coordination","a"],k:["Control","o"]},
map:{root:{l:["Organising","activity"],t:"Organising the business's activity",x:"To reach its objectives, a business chooses a management style, a structure, coordination mechanisms and control methods."},
cols:[
{c:"v",l:["Styles (Likert)"],t:"Management styles (Likert)",x:"How the manager shares power and decision-making. It depends on personality, size, structure, employees and environment.",leaves:[
{l:["Authoritarian"],t:"Authoritarian style",x:"Decisions made at the top, imposed objectives, control through threats and sanctions, top-down communication, no trust."},
{l:["Paternalistic"],t:"Paternalistic style",x:"Benevolent authority, concern for employee well-being, little initiative, rewards and sanctions."},
{l:["Consultative"],t:"Consultative style",x:"Employees are consulted before the final decision; trust, teamwork, two-way communication."},
{l:["Participative"],t:"Participative style",x:"Decentralised decisions, objectives negotiated with the group, profit-sharing, full trust."},
{l:["No pure style"],t:"A theoretical classification",x:"In practice, managers adapt their style to the situation."}]},
{c:"t",l:["Structures"],t:"Structures",x:"The structure divides, coordinates and controls activities to reach objectives effectively and efficiently.",leaves:[
{l:["Org chart"],t:"The organisation chart",x:"Shows reporting and functional links. Limits: static, formal, leaves out informal relationships."},
{l:["Hierarchical"],t:"Hierarchical structure (Fayol)",x:"Unity of command: one boss only. Simple and effective, but can become bureaucratic."},
{l:["Functional"],t:"Functional structure (Taylor)",x:"Divisions by major function run by specialists; an employee has several bosses."},
{l:["Divisional"],t:"Divisional structure",x:"Grouped by product, customer or region; each division is an autonomous profit centre."},

cards:[
["s","What is a management style?","How the manager <mark>shares power and decision-making</mark>. Likert identifies four."],
["s","What are Likert's four management styles?","<mark>Authoritarian</mark>, <mark>paternalistic</mark>, <mark>consultative</mark> and <mark>participative</mark>."],
["s","Authoritarian or participative?","Authoritarian: decisions at the <mark>top</mark>, imposed objectives, sanctions. Participative: <mark>decentralised</mark> decisions, negotiated objectives, full trust."],
["s","What sets the consultative style apart?","Employees are <mark>consulted before the decision</mark>, which management then takes; communication goes both ways."],
["t","What is an organisation chart, and what are its limits?","A diagram of <mark>reporting and functional links</mark>. Limits: <mark>static</mark>, formal, no informal relationships."],
["t","Hierarchical or functional structure?","Hierarchical (Fayol): <mark>one boss</mark>. Functional (Taylor): specialists, <mark>several bosses</mark>."],
["t","Divisional or matrix structure?","Divisional: divisions by <mark>product, customer or region</mark>, profit centres. Matrix: combines <mark>functions and projects</mark>."],
["t","What are Mintzberg's six parts of an organisation?","<mark>Operating core</mark>, <mark>strategic apex</mark>, <mark>middle line</mark>, <mark>technostructure</mark>, <mark>support staff</mark>, <mark>ideology</mark>."],
["t","What is an adhocracy?","An <mark>innovative</mark> organisation where experts from different fields work in <mark>project teams</mark> through mutual adjustment."],
["c","Why must work be coordinated?","Because <mark>specialisation</mark> of work means people must act <mark>consistently</mark>."],
["c","What are Mintzberg's six coordination mechanisms?","<mark>Mutual adjustment</mark>, <mark>direct supervision</mark>, standardisation of <mark>processes</mark>, <mark>outputs</mark>, <mark>skills</mark> and <mark>norms</mark>."],
["c","When is mutual adjustment used?","When there are <mark>few people</mark> and coordination is simple: workers arrange things directly."],
["k","What are control mechanisms for?","To <mark>compare objectives and results</mark>, measure gaps and decide on <mark>corrective action</mark>."],
["k","How does control depend on management style?","Authoritarian: <mark>constant</mark> checks and precise procedures. Participative: <mark>comparing objectives and results</mark>."],
["k","What is decentralisation and what are its benefits?","Power is <mark>spread across autonomous units</mark>: more <mark>relevant</mark> decisions, faster <mark>reactions</mark>, more <mark>motivated</mark> staff."]],
qcm:[
["s","A manager imposes objectives and controls through sanctions. Their style is:",["Authoritarian","Participative","Consultative","Adhocratic"],"Communication is top-down and trust very low."],
["s","A manager consults the team, then decides alone. Their style is:",["Consultative","Authoritarian","Participative","Paternalistic"],"In the participative style, decisions are made with the group."],
["s","The paternalistic style is characterised by:",["Benevolent authority and concern for staff well-being","Objectives negotiated with the group","No hierarchy at all","Decentralised decisions"],"Employees have little initiative."],
["t","In Fayol's hierarchical structure:",["Each employee has only one boss","Each employee has several bosses","There are no bosses","Divisions are profit centres"],"This is the principle of unity of command."],
["t","A business organised in regional divisions, each responsible for its results, has a structure that is:",["Divisional","Functional","Hierarchical","Entrepreneurial"],"Each division is an autonomous profit centre."],
["t","According to Mintzberg, the specialists who design work methods form:",["The technostructure","The operating core","The strategic apex","The ideology"],"They make other people's work more effective."],
["t","An advertising agency working in multidisciplinary project teams is mainly:",["An adhocracy","A machine organisation","A diversified organisation","An entrepreneurial organisation"],"Experts coordinate through mutual adjustment."],
["c","In hospitals, doctors and nurses know how to work together thanks to their training. This is standardisation of:",["Skills","Outputs","Norms","Processes only"],"Training paths are standardised."],
["c","In a start-up, strongly shared values guide everyone's behaviour. This is standardisation of:",["Norms","Outputs","Skills","Processes"],"Values and culture act as the coordination mechanism."],
["k","Control mainly means:",["Comparing objectives with results to correct gaps","Punishing employees","Drawing the organisation chart","Setting wages"],"Control covers all objectives and all levels."],
["k","What is a benefit of decentralisation?",["Faster, better-informed decisions","Power concentrated at the top","Less autonomy for units","More direct supervision"],"It also motivates staff more."]]}

cards:[
["r","Que dit l'approche par les ressources d'Edith Penrose ?","La firme est un <mark>ensemble de ressources</mark> ; ce sont les <mark>compétences distinctives</mark> qui les utilisent qui créent l'avantage concurrentiel."],
["r","Quelles sont les ressources tangibles ?","Les ressources <mark>physiques</mark> (usines, outils), <mark>financières</mark> (rentabilité, endettement) et <mark>humaines</mark> (effectif, qualifications, climat social)."],
["r","Quelles sont les ressources intangibles ?","<mark>Technologiques</mark> (brevets, R&D), <mark>organisationnelles</mark> (savoir-faire, structure) et <mark>mercatiques</mark> (notoriété, image)."],
["r","Qu'est-ce qu'une ressource stratégique ?","Une ressource qui a de la <mark>valeur pour le client</mark> et qui est <mark>exclusive</mark> : elle procure un avantage durable."],
["c","De quoi se compose une compétence individuelle ?","Du <mark>savoir</mark> (connaissances), du <mark>savoir-faire</mark> (pratique) et du <mark>savoir-être</mark> (attitudes)."],
["c","Qu'est-ce qu'une compétence fondamentale selon Hamel et Prahalad ?","Une compétence qui saisit une opportunité, <mark>crée de la valeur</mark> ou réduit les coûts, est <mark>rare</mark> et <mark>difficile à imiter</mark>."],
["c","Qu'est-ce que l'effet d'expérience ?","Le <mark>coût unitaire baisse</mark> d'un pourcentage constant à chaque <mark>doublement de la production cumulée</mark>."],
["c","Quelles sont les causes de l'effet d'expérience ?","L'<mark>apprentissage</mark>, les <mark>économies d'échelle</mark>, l'<mark>effet de taille</mark>, l'amélioration des processus et l'<mark>automatisation</mark>."],
["p","Comment optimiser l'usage des ressources techniques ?","En <mark>planifiant leur utilisation</mark> (réservation) pour éviter temps morts et attentes, et ne pas acheter de matériel en trop."],
["p","Quels outils informatiques aident à organiser les ressources ?","La <mark>GRC</mark> (relation client), le <mark>PGI</mark> (progiciel de gestion intégré) et les logiciels de <mark>gestion des stocks</mark> et de planning."],
["p","Comment répartir les missions d'un projet ?","Confier les tâches à <mark>forte valeur ajoutée aux seniors</mark> et <mark>déléguer</mark> les autres aux juniors pour les faire progresser."],
["x","Que attendent les principales parties prenantes ?","Actionnaires : <mark>dividendes</mark>. Salariés : <mark>rémunération</mark> et conditions de travail. Clients : <mark>prix, qualité, délais</mark>. Banques : <mark>remboursement</mark>. État : <mark>impôts</mark>."],
["x","Qu'est-ce qu'un contre-pouvoir ?","Un groupe organisé qui agit pour <mark>limiter le pouvoir d'un décideur</mark> quand ses intérêts sont menacés (grève, boycott, vente d'actions…)."],
["x","Pourquoi la RSE influence-t-elle l'organisation des ressources ?","Elle permet d'<mark>anticiper les risques</mark>, de réduire l'<mark>empreinte carbone</mark> et de protéger la <mark>réputation</mark>, donc la pérennité."]],

cards:[

["r","What is a strategic resource?","A resource that is <mark>valuable to customers</mark> and <mark>exclusive</mark>: it gives a lasting advantage."],
["c","What makes up an individual skill?","<mark>Knowledge</mark>, <mark>know-how</mark> (practice) and <mark>soft skills</mark> (attitudes)."],

["x","What is a counter-power?","An organised group acting to <mark>limit a decision-maker's power</mark> when its interests are threatened (strike, boycott, selling shares…)."],
["x","Why does CSR influence how resources are organised?","It helps <mark>anticipate risks</mark>, cut the <mark>carbon footprint</mark> and protect <mark>reputation</mark>, and therefore survival."]],

cards:[
["b","Qu'est-ce que le cycle d'exploitation ?","L'ensemble des opérations liées à l'activité courante, de l'<mark>achat</mark> des marchandises ou matières au <mark>règlement du client</mark>. Il est court et régulier."],
["b","Pourquoi le cycle d'exploitation crée-t-il un besoin de financement ?","À cause du <mark>décalage</mark> entre les <mark>décaissements</mark> (achats, salaires) et les <mark>encaissements</mark> des ventes."],
["b","Comment calcule-t-on le BFRE ?","<mark>Stocks + créances clients − dettes fournisseurs</mark>. Il augmente généralement avec l'activité."],
["b","Qu'est-ce qu'un investissement ?","L'acquisition d'un bien <mark>matériel, immatériel ou financier</mark> pour en tirer un <mark>profit futur</mark>."],
["b","Qu'est-ce que le fonds de roulement ?","<mark>Ressources stables − emplois stables</mark>. Il doit être <mark>positif</mark> pour respecter l'équilibre financier."],
["c","Que sont les concours bancaires ?","Des <mark>crédits à court terme</mark> : facilités de caisse, crédits relais, lignes de crédit. Ils sont <mark>coûteux</mark> et créent une dépendance."],
["c","Qu'est-ce que le crédit interentreprises ?","Les <mark>délais de paiement accordés par les fournisseurs</mark>, qui financent une partie du BFR. Coût : la perte d'<mark>escompte</mark>."],
["l","Qu'est-ce que l'autofinancement ?","Le financement par la <mark>richesse créée par l'activité</mark> (CAF) mise en réserve au lieu d'être distribuée."],
["l","Quels sont les avantages et limites de l'autofinancement ?","Avantages : <mark>stable, non remboursable</mark>, sans intérêts. Limites : moins de dividendes, capacité limitée, <mark>coût d'opportunité</mark>."],
["l","Quel est le principal risque d'une augmentation de capital ?","La <mark>dilution du capital</mark> : si de nouveaux associés entrent, les anciens peuvent <mark>perdre le contrôle</mark>."],
["l","Emprunt indivis ou emprunt obligataire ?","Indivis : auprès d'<mark>un seul prêteur</mark>. Obligataire : divisé en <mark>obligations</mark> négociables, réservé aux grandes sociétés, rémunéré par un <mark>coupon</mark>."],
["l","Quels sont les risques de l'emprunt ?","Une <mark>dépendance</mark> envers les banques, une <mark>capacité d'endettement</mark> limitée et des intérêts parfois variables."],
["l","Quelles sont les formes de financement participatif ?","Le <mark>don</mark>, le <mark>don avec contrepartie</mark> et la <mark>prise de participation</mark> au capital."],
["l","Qu'est-ce que le crédit-bail ?","La <mark>location d'un bien</mark> avec une <mark>promesse de vente</mark> à l'échéance. Pas d'apport ni d'endettement, mais des <mark>loyers élevés</mark>."]],
qcm:[
["b","Le cycle d'exploitation est généralement plus long :",["Dans une entreprise industrielle","Dans une entreprise de distribution","Dans une banque","Dans une administration"],"Au temps d'approvisionnement et de vente s'ajoute le temps de fabrication."],
["b","Lequel constitue une ressource du cycle d'exploitation ?",["Les dettes fournisseurs","Les stocks","Les créances clients","Les machines"],"Les stocks et les créances clients sont des besoins à financer."],
["b","Si une entreprise accorde des délais de paiement plus longs à ses clients, son BFRE :",["Augmente","Diminue","Ne change pas","Devient nul"],"Les créances clients sont un besoin de financement."],
["b","Un fonds de roulement positif signifie que :",["Les ressources stables financent entièrement les emplois stables","L'entreprise n'a pas de dettes","Les stocks sont nuls","L'entreprise est en faillite"],"C'est la règle de l'équilibre financier."],
["b","Acheter une nouvelle machine pour produire davantage est un investissement :",["De capacité","De remplacement","Financier","D'exploitation"],"L'investissement de remplacement maintient seulement la capacité existante."],
["c","Une facilité de caisse est :",["Un concours bancaire à court terme","Un emprunt obligataire","Un apport en capital","Un crédit-bail"],"Les concours bancaires sont coûteux et révocables."],
["c","Le coût du crédit fournisseur, c'est :",["La perte de l'escompte pour paiement comptant","Un taux d'intérêt élevé","La dilution du capital","Un loyer mensuel"],"Payer plus tard fait renoncer à la remise pour paiement immédiat."],
["l","L'autofinancement a pour inconvénient :",["De réduire les dividendes versés aux associés","D'obliger à verser des intérêts","De diluer le capital","De créer une dépendance envers la banque"],"Il présente aussi un coût d'opportunité."],
["l","L'arrivée de nouveaux associés lors d'une augmentation de capital peut entraîner :",["Une dilution du capital","Une hausse des intérêts à payer","Une baisse du BFR","Un crédit-bail"],"Les anciens associés risquent de perdre le contrôle."],
["l","L'emprunt obligataire est réservé :",["Aux grandes sociétés, à l'État et aux collectivités","Aux micro-entreprises","Aux particuliers","Aux associations"],"Il est divisé en titres négociables : les obligations."],
["l","Une start-up finance son projet grâce à des milliers d'internautes sur une plateforme : c'est :",["Du financement participatif","Un emprunt indivis","Du crédit-bail","De l'autofinancement"],"Il peut prendre la forme d'un don, d'un don avec contrepartie ou d'une prise de participation."],
["l","Quel est l'inconvénient principal du crédit-bail ?",["Des loyers élevés","La dilution du capital","Un apport initial important","L'impossibilité d'utiliser le bien"],"Il permet en revanche d'utiliser le bien sans apport ni endettement."]]},

cards:[
["b","What is the operating cycle?","All the operations of day-to-day activity, from <mark>buying</mark> goods or materials to the <mark>customer paying</mark>. It is short and regular."],
["b","Why does the operating cycle create a financing need?","Because of the <mark>time gap</mark> between <mark>payments out</mark> (purchases, wages) and <mark>cash coming in</mark> from sales."],
["b","How is the operating working capital requirement calculated?","<mark>Stock + receivables − payables</mark>. It usually rises with activity."],
["b","What is an investment?","Acquiring a <mark>physical, intangible or financial</mark> asset to make a <mark>future profit</mark>."],
["b","What is net working capital?","<mark>Long-term resources − long-term uses</mark>. It must be <mark>positive</mark> to respect financial balance."],
["c","What is short-term bank credit?","<mark>Short-term loans</mark>: overdrafts, bridging loans, credit lines. They are <mark>costly</mark> and create dependency."],
["c","What is trade credit?","The <mark>payment terms granted by suppliers</mark>, which fund part of the working capital need. Cost: losing the <mark>discount</mark>."],
["l","What is self-financing?","Financing with the <mark>wealth generated by the business</mark> (cash flow) kept as reserves rather than paid out."],
["l","Benefits and limits of self-financing?","Benefits: <mark>stable, no repayment</mark>, no interest. Limits: lower dividends, limited capacity, <mark>opportunity cost</mark>."],
["l","What is the main risk of a capital increase?","<mark>Dilution</mark>: if new partners join, existing ones may <mark>lose control</mark>."],
["l","Bank loan or bond issue?","Bank loan: from <mark>a single lender</mark>. Bond issue: split into tradable <mark>bonds</mark>, for large companies, paying a <mark>coupon</mark>."],
["l","What are the risks of borrowing?","<mark>Dependency</mark> on banks, limited <mark>borrowing capacity</mark> and sometimes variable interest."],
["l","What are the forms of crowdfunding?","<mark>Donation</mark>, <mark>reward-based</mark> donation and <mark>equity</mark> investment."],
["l","What is leasing?","<mark>Renting an asset</mark> with an <mark>option to buy</mark> at the end. No down payment or debt, but <mark>high rental payments</mark>."]],
qcm:[
["b","The operating cycle is usually longer:",["In a manufacturing business","In a retail business","In a bank","In a government office"],"Production time is added to supply and sales time."],
["b","Which is a resource of the operating cycle?",["Supplier payables","Stock","Customer receivables","Machines"],"Stock and receivables are needs to be financed."],
["b","If a business gives customers longer payment terms, its working capital requirement:",["Rises","Falls","Stays the same","Becomes zero"],"Receivables are a financing need."],
["b","Positive net working capital means that:",["Long-term resources fully fund long-term uses","The business has no debt","Stock is zero","The business is bankrupt"],"This is the rule of financial balance."],
["b","Buying a new machine to produce more is an investment in:",["Capacity","Replacement","Financial assets","Operations"],"Replacement investment only maintains existing capacity."],
["c","An overdraft facility is:",["Short-term bank credit","A bond issue","A capital contribution","Leasing"],"Short-term bank credit is costly and revocable."],
["c","The cost of trade credit is:",["Losing the early-payment discount","A high interest rate","Dilution","A monthly rent"],"Paying later means giving up the discount for paying at once."],
["l","A drawback of self-financing is that:",["It reduces dividends paid to partners","Interest must be paid","It dilutes capital","It creates dependency on the bank"],"It also has an opportunity cost."],
["l","New partners joining in a capital increase can cause:",["Dilution","Higher interest costs","A lower working capital requirement","Leasing"],"Existing partners may lose control."],
["l","A bond issue is available to:",["Large companies, the State and local authorities","Micro-businesses","Individuals","Charities"],"It is split into tradable securities: bonds."],
["l","A start-up funds its project with thousands of internet users on a platform. This is:",["Crowdfunding","A bank loan","Leasing","Self-financing"],"It can be a donation, reward-based or an equity stake."],
["l","What is the main drawback of leasing?",["High rental payments","Dilution","A large down payment","Not being able to use the asset"],"On the other hand, the asset can be used with no down payment or debt."]]}
};
