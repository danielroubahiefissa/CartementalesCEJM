fr:{intro:"Les principes et les effets du contrat, le rôle du juge, et les clauses qui anticipent l'avenir.",
cats:{p:["Principes et effets","v"],j:["Le juge et le contrat","o"],c:["Les clauses","t"]},
map:{root:{l:["Le contenu","du contrat"],t:"Le contenu du contrat",x:"Liberté contractuelle, bonne foi et force obligatoire assurent la loyauté et l'équilibre des échanges ; les clauses ajustent le contrat aux besoins des entreprises."},
groups:[{c:"v",cols:[0,1],l:["Les effets"],t:"Les effets du contrat",x:"Le contrat s'impose aux parties, pas aux tiers ; le juge le fait respecter et, depuis 2016, peut l'adapter."},
{c:"t",cols:[2,3,4],l:["Les clauses"],t:"Les clauses pour anticiper l'avenir",x:"Elles précisent les conditions de la relation et anticipent les difficultés : exécution, litiges, responsabilité."}],
cols:[
{c:"v",l:["Principes"],t:"Les principes",x:"Trois principes fondent le contrat.",leaves:[
{l:["Liberté contract."],t:"La liberté contractuelle",x:"Liberté de contracter ou non, et de choisir son cocontractant."},
{l:["Bonne foi"],t:"La bonne foi",x:"Instrument de la justice contractuelle : elle guide le juge vers l'équilibre pendant toute la vie du contrat."},
{l:["Force obligatoire"],t:"La force obligatoire",x:"Le contrat « fait la loi des parties » : pas de résiliation par une seule partie, exécution de bonne foi."},
{l:["Effet relatif"],t:"L'effet relatif",x:"Sauf exception, le contrat ne produit pas d'effet obligatoire envers les tiers, qui n'y sont pas parties."}]},
{c:"o",l:["Le juge"],t:"Le juge et le contrat",x:"En principe, il interprète le contrat selon la volonté des parties mais ne le révise pas.",leaves:[
{l:["Imprévision"],t:"La théorie de l'imprévision",x:"Changement de circonstances imprévisible qui rend l'exécution excessivement onéreuse pour une partie (art. 1195)."},
{l:["Renégociation"],t:"D'abord renégocier",x:"La partie lésée demande à renégocier et continue d'exécuter ses obligations pendant ce temps."},
{l:["Révision"],t:"Puis le juge",x:"À défaut d'accord dans un délai raisonnable, le juge peut réviser le contrat ou y mettre fin."},
{l:["Clause de hardship"],t:"La clause de hardship",x:"Clause d'imprévision : les parties aménagent elles-mêmes l'imprévision pour ne pas laisser décider le juge."}]},
{c:"t",l:["Exécution"],t:"Les clauses relatives à l'exécution",x:"Elles sécurisent le déroulement du contrat.",leaves:[
{l:["Renégociation"],t:"La clause de renégociation",x:"Oblige à renégocier si un événement imprévu bouleverse l'équilibre. Essentielle dans les contrats longs (franchise, matières premières)."},
{l:["Réserve propriété"],t:"La clause de réserve de propriété",x:"Le transfert de propriété est reporté au paiement intégral : le vendeur impayé peut récupérer le bien."},
{l:["Conditions"],t:"Conditions de la réserve de propriété",x:"Écrite et acceptée par l'acheteur au plus tard à la livraison (CGV, devis, factures, bons de commande)."}]},
{c:"t",l:["Litiges"],t:"Les clauses relatives aux litiges",x:"Elles règlent à l'avance les conséquences d'une inexécution.",leaves:[
{l:["Clause résolutoire"],t:"La clause résolutoire",x:"En cas d'inexécution, le contrat est résolu ou résilié de plein droit, sans juge. Elle est dissuasive."},
{l:["Clause pénale"],t:"La clause pénale",x:"Montant de la réparation fixé d'avance ; pas besoin de prouver le préjudice. Le juge peut la réduire si elle est excessive."}]},

cards:[
["p","Quels sont les trois grands principes du contrat ?","La <mark>liberté contractuelle</mark>, la <mark>bonne foi</mark> et la <mark>force obligatoire</mark>."],
["p","Que signifie « le contrat fait la loi des parties » ?","C'est la <mark>force obligatoire</mark> : les parties doivent respecter leurs engagements ; aucune ne peut <mark>résilier seule</mark> le contrat."],
["p","Qu'est-ce que l'effet relatif du contrat ?","Le contrat <mark>n'oblige pas les tiers</mark> : nul ne peut être engagé par un acte auquel il n'est pas partie."],
["j","Le juge peut-il modifier un contrat ?","En principe <mark>non</mark> : il l'interprète selon la volonté des parties. Depuis 2016, il peut le <mark>réviser en cas d'imprévision</mark>."],
["j","Qu'est-ce que l'imprévision ?","Un <mark>changement de circonstances imprévisible</mark> lors de la conclusion, qui rend l'exécution <mark>excessivement onéreuse</mark> pour une partie (art. 1195)."],
["j","Quelle est la procédure en cas d'imprévision ?","1) <mark>Renégociation</mark>, en continuant d'exécuter. 2) Si échec : résolution ou adaptation d'un commun accord. 3) Sinon, le <mark>juge</mark> révise ou met fin au contrat."],
["j","Qu'est-ce qu'une clause de hardship ?","Une <mark>clause d'imprévision</mark> par laquelle les parties aménagent elles-mêmes l'imprévision, pour ne pas <mark>laisser décider le juge</mark>."],
["c","À quoi sert une clause de renégociation ?","À <mark>obliger les parties à renégocier</mark> si un événement imprévu bouleverse l'équilibre du contrat. Utile dans les <mark>contrats longs</mark>."],
["c","Qu'est-ce qu'une clause de réserve de propriété ?","Elle reporte le <mark>transfert de propriété au paiement intégral</mark> du prix : le vendeur impayé peut <mark>récupérer le bien</mark>."],
["c","Quelles conditions pour appliquer une clause de réserve de propriété ?","Elle doit être <mark>écrite</mark> et <mark>acceptée par l'acheteur</mark> au plus tard au moment de la livraison."],
["c","Qu'est-ce qu'une clause résolutoire ?","Elle prévoit que le contrat sera <mark>résolu ou résilié de plein droit</mark>, <mark>sans juge</mark>, en cas d'inexécution."],
["c","Qu'est-ce qu'une clause pénale ?","Elle fixe <mark>d'avance le montant</mark> de la réparation en cas d'inexécution. Le créancier n'a pas à prouver son préjudice ; le juge peut réduire un montant <mark>excessif</mark>."],
["c","Qu'est-ce qu'une clause limitative de responsabilité ?","Elle fixe un <mark>plafond d'indemnisation</mark> en cas de manquement : le débiteur connaît à l'avance son risque maximal."],
["c","Quelles sont les limites des clauses limitatives de responsabilité ?","Écartées en cas de <mark>faute lourde ou intentionnelle</mark>, interdites avec les <mark>consommateurs</mark>, et elles ne peuvent vider une obligation essentielle de sa substance."],
["c","Que prévoit le droit pour les contrats d'adhésion ?","Toute clause créant un <mark>déséquilibre significatif</mark> entre les parties est <mark>réputée non écrite</mark> (art. 1171)."]],
qcm:[
["p","Le principe selon lequel le contrat « fait la loi des parties » est :",["La force obligatoire","L'effet relatif","La liberté contractuelle","L'imprévision"],"Les parties doivent exécuter leurs engagements ; aucune ne peut se désengager seule."],
["p","Un tiers peut-il être obligé par un contrat qu'il n'a pas signé ?",["Non, sauf exception, c'est l'effet relatif","Oui, toujours","Oui, s'il est client de l'une des parties","Oui, si le juge le décide"],"Nul ne peut être engagé par un acte auquel il n'est pas partie."],
["j","Depuis la réforme de 2016, en cas d'imprévision et d'échec de la renégociation, le juge peut :",["Réviser le contrat ou y mettre fin","Seulement l'annuler rétroactivement","Condamner pénalement une partie","Rien, il doit appliquer le contrat tel quel"],"Il intervient à la demande d'une partie, à défaut d'accord dans un délai raisonnable."],
["j","Pendant la renégociation pour imprévision, la partie lésée :",["Continue d'exécuter ses obligations","Suspend toutes ses obligations","Peut résilier seule le contrat","Doit saisir immédiatement le juge"],"C'est une condition prévue par l'article 1195 du Code civil."],
["j","Une clause de hardship permet aux parties :",["D'aménager elles-mêmes l'imprévision","De fixer une pénalité de retard","De reporter le transfert de propriété","D'exclure toute responsabilité"],"Elles décrivent par exemple les événements exclus de la révision par le juge."],
["c","Un fournisseur veut récupérer ses marchandises si son client ne paie pas. Quelle clause ?",["Une clause de réserve de propriété","Une clause pénale","Une clause limitative de responsabilité","Une clause de hardship"],"Le fournisseur reste propriétaire jusqu'au paiement intégral du prix."],
["c","La clause de réserve de propriété doit être acceptée par l'acheteur au plus tard :",["Au moment de la livraison","Au moment du paiement","Un an après la vente","Devant le juge"],"Elle peut figurer dans les CGV, devis, bons de commande ou factures."],
["c","Une clause qui fixe d'avance l'indemnité due en cas de retard est :",["Une clause pénale","Une clause résolutoire","Une clause de renégociation","Une promesse unilatérale"],"Le créancier n'a pas à prouver l'étendue de son préjudice."],
["c","Une clause résolutoire permet :",["D'anéantir le contrat de plein droit, sans juge, en cas d'inexécution","De renégocier le prix","De plafonner l'indemnisation","De transférer la propriété"],"Elle pousse le cocontractant défaillant à exécuter ses obligations."],
["c","Une clause limitative de responsabilité est écartée en cas de :",["Faute lourde ou intentionnelle","Simple retard","Paiement anticipé","Accord des parties"],"Elle est aussi interdite dans les contrats conclus avec des consommateurs."],
["c","Dans un contrat d'adhésion, une clause créant un déséquilibre significatif est :",["Réputée non écrite","Toujours valable","Transformée en clause pénale","Soumise à l'accord du tiers"],"L'appréciation ne porte ni sur l'objet principal du contrat ni sur l'adéquation du prix."],
["c","Pourquoi insérer une clause de renégociation dans un contrat de franchise ?",["Parce qu'il dure longtemps et peut être bouleversé par un événement imprévu","Pour éviter de payer la redevance","Pour interdire toute rupture","Pour que le juge fixe le prix"],"Elle précise les événements déclencheurs, la procédure et le sort du contrat en cas d'échec."]]},

en:{intro:"The principles and effects of a contract, the role of the judge, and the clauses that anticipate the future.",
cats:{p:["Principles and effects","v"],j:["The judge and the contract","o"],c:["Clauses","t"]},
map:{root:{l:["Contract","content"],t:"The content of a contract",x:"Freedom of contract, good faith and binding force ensure fair and balanced exchanges; clauses tailor the contract to the business's needs."},
groups:[{c:"v",cols:[0,1],l:["Effects"],t:"Effects of the contract",x:"A contract binds the parties, not third parties; the judge enforces it and, since 2016, can adjust it."},
{c:"t",cols:[2,3,4],l:["Clauses"],t:"Clauses that anticipate the future",x:"They set out the terms of the relationship and anticipate problems: performance, disputes, liability."}],
cols:[
{c:"v",l:["Principles"],t:"Principles",x:"Three principles underpin the contract.",leaves:[
{l:["Freedom"],t:"Freedom of contract",x:"Freedom to contract or not, and to choose the other party."},
{l:["Good faith"],t:"Good faith",x:"A tool of contractual fairness: it guides the judge towards balance throughout the life of the contract."},
{l:["Binding force"],t:"Binding force",x:"The contract is 'law between the parties': no party can end it alone, and it must be performed in good faith."},
{l:["Privity"],t:"Privity of contract",x:"Except in special cases, a contract does not bind third parties, who are not parties to it."}]},
{c:"o",l:["The judge"],t:"The judge and the contract",x:"In principle, the judge interprets the contract according to the parties' intent but does not revise it.",leaves:[
{l:["Hardship"],t:"Unforeseeable change (hardship)",x:"An unforeseeable change of circumstances makes performance excessively costly for one party (art. 1195)."},
{l:["Renegotiation"],t:"First, renegotiate",x:"The affected party asks to renegotiate and keeps performing its obligations meanwhile."},
{l:["Revision"],t:"Then the judge",x:"Without agreement within a reasonable time, the judge can revise the contract or end it."},
{l:["Hardship clause"],t:"The hardship clause",x:"The parties organise how unforeseeable changes are handled, so the judge does not decide for them."}]},
{c:"t",l:["Performance"],t:"Clauses on performance",x:"They secure how the contract runs.",leaves:[
{l:["Renegotiation"],t:"Renegotiation clause",x:"Requires renegotiation if an unforeseen event upsets the balance. Essential in long contracts (franchises, raw materials)."},
{l:["Retention of title"],t:"Retention of title clause",x:"Ownership passes only on full payment: an unpaid seller can take the goods back."},
{l:["Conditions"],t:"Conditions for retention of title",x:"In writing and accepted by the buyer at the latest on delivery (terms of sale, quotes, invoices, purchase orders)."}]},
{c:"t",l:["Disputes"],t:"Clauses on disputes",x:"They settle in advance the consequences of non-performance.",leaves:[
{l:["Termination clause"],t:"Termination clause",x:"If a party fails to perform, the contract is automatically ended, without a judge. It acts as a deterrent."},
{l:["Penalty clause"],t:"Penalty clause",x:"The amount of compensation is set in advance; no need to prove the loss. The judge can reduce it if excessive."}]},
{c:"t",l:["Liability"],t:"Clauses on liability",x:"They limit the financial consequences of a breach.",leaves:[
{l:["Limitation clause"],t:"Limitation of liability clause",x:"A cap on compensation: the debtor knows its maximum risk and disputes are settled quickly."},
{l:["Limits"],t:"Limits",x:"Set aside for gross or intentional misconduct; cannot empty an essential obligation of its substance; forbidden with consumers."},
{l:["Adhesion contract"],t:"Standard-form (adhesion) contract",x:"Terms are not negotiated (e.g. mobile phone plans). Any clause creating a significant imbalance is deemed unwritten (art. 1171)."}]}]},
cards:[
["p","What are the three main principles of contract law?","<mark>Freedom of contract</mark>, <mark>good faith</mark> and <mark>binding force</mark>."],
["p","What does 'the contract is law between the parties' mean?","This is <mark>binding force</mark>: the parties must keep their commitments; no party can <mark>end it alone</mark>."],
["p","What is privity of contract?","A contract <mark>does not bind third parties</mark>: no one can be bound by an agreement they are not party to."],
["j","Can the judge change a contract?","In principle <mark>no</mark>: they interpret it according to the parties' intent. Since 2016, they can <mark>revise it in case of hardship</mark>."],
["j","What is hardship (imprévision)?","An <mark>unforeseeable change of circumstances</mark> that makes performance <mark>excessively costly</mark> for one party (art. 1195)."],
["j","What is the procedure in case of hardship?","1) <mark>Renegotiate</mark> while still performing. 2) If that fails: end or adapt by mutual agreement. 3) Otherwise, the <mark>judge</mark> revises or ends the contract."],
["j","What is a hardship clause?","A clause by which the parties <mark>organise unforeseeable changes</mark> themselves, so as <mark>not to leave it to the judge</mark>."],
["c","What is a renegotiation clause for?","To <mark>require the parties to renegotiate</mark> if an unforeseen event upsets the contract's balance. Useful in <mark>long contracts</mark>."],
["c","What is a retention of title clause?","It delays <mark>transfer of ownership until full payment</mark>: an unpaid seller can <mark>take the goods back</mark>."],
["c","What conditions apply to a retention of title clause?","It must be <mark>in writing</mark> and <mark>accepted by the buyer</mark> at the latest on delivery."],
["c","What is a termination clause?","It provides that the contract is <mark>ended automatically</mark>, <mark>without a judge</mark>, if a party fails to perform."],
["c","What is a penalty clause?","It sets <mark>in advance the amount</mark> of compensation for non-performance. No need to prove the loss; the judge can reduce an <mark>excessive</mark> amount."],
["c","What is a limitation of liability clause?","It sets a <mark>cap on compensation</mark> for a breach: the debtor knows its maximum risk in advance."],
["c","What are the limits of limitation clauses?","Set aside for <mark>gross or intentional misconduct</mark>, forbidden with <mark>consumers</mark>, and they cannot empty an essential obligation of its substance."],
["c","What does the law say about standard-form (adhesion) contracts?","Any clause creating a <mark>significant imbalance</mark> between the parties is <mark>deemed unwritten</mark> (art. 1171)."]],
qcm:[
["p","The principle that the contract is 'law between the parties' is:",["Binding force","Privity","Freedom of contract","Hardship"],"The parties must perform their commitments; none can withdraw alone."],
["p","Can a third party be bound by a contract it did not sign?",["No, except in special cases: this is privity","Yes, always","Yes, if it is a customer of one party","Yes, if the judge decides"],"No one can be bound by an agreement they are not party to."],
["j","Since the 2016 reform, in case of hardship and failed renegotiation, the judge can:",["Revise the contract or end it","Only cancel it retroactively","Impose a criminal penalty","Nothing: the contract applies as is"],"The judge acts at a party's request if there is no agreement within a reasonable time."],
["j","During renegotiation for hardship, the affected party:",["Keeps performing its obligations","Suspends all obligations","Can end the contract alone","Must go straight to court"],"This is required by article 1195 of the French Civil Code."],
["j","A hardship clause allows the parties to:",["Organise unforeseeable changes themselves","Set a late-payment penalty","Delay transfer of ownership","Exclude all liability"],"For example, they list events that the judge cannot use to revise the contract."],
["c","A supplier wants to take back its goods if the customer does not pay. Which clause?",["Retention of title","Penalty clause","Limitation of liability","Hardship clause"],"The supplier remains owner until full payment."],
["c","A retention of title clause must be accepted by the buyer at the latest:",["On delivery","On payment","One year after the sale","In court"],"It can appear in terms of sale, quotes, purchase orders or invoices."],
["c","A clause setting in advance the compensation for late delivery is:",["A penalty clause","A termination clause","A renegotiation clause","A unilateral promise"],"The creditor does not have to prove the extent of the loss."],
["c","A termination clause allows:",["Ending the contract automatically, without a judge, if a party fails to perform","Renegotiating the price","Capping compensation","Transferring ownership"],"It pushes the defaulting party to perform."],
["c","A limitation of liability clause is set aside in case of:",["Gross or intentional misconduct","A simple delay","Early payment","Agreement of the parties"],"It is also forbidden in contracts with consumers."],
["c","In a standard-form contract, a clause creating a significant imbalance is:",["Deemed unwritten","Always valid","Turned into a penalty clause","Subject to a third party's approval"],"The assessment covers neither the main subject nor the adequacy of the price."],
["c","Why include a renegotiation clause in a franchise contract?",["It lasts a long time and can be upset by an unforeseen event","To avoid paying royalties","To forbid any termination","So the judge sets the price"],"It sets out triggering events, the procedure and what happens if talks fail."]]}

T1["t1-finalites"]={
fr:{intro:"Pourquoi une entreprise existe, comment ses finalités deviennent des objectifs, et comment elle compose avec ses parties prenantes.",
cats:{f:["Finalités et objectifs","v"],p:["Parties prenantes","t"],e:["Enjeux de pouvoir","o"]},
map:{root:{l:["Finalités et","parties prenantes"],t:"Les finalités et les parties prenantes",x:"La finalité est la raison d'être de l'entreprise. Pour la réaliser, elle doit répondre aux attentes de ses partenaires internes et externes."},
cols:[
{c:"v",l:["Finalités"],t:"Les finalités",x:"Il n'y a pas une mais des finalités, influencées par les valeurs des dirigeants, l'histoire de l'entreprise, les attentes du personnel et l'environnement.",leaves:[
{l:["Économique"],t:"La finalité économique",x:"Commune à toutes les entreprises : faire du profit pour embaucher, investir, former, rémunérer les actionnaires. Elle assure la pérennité."},
{l:["Sociale"],t:"La finalité sociale",x:"Épanouissement des salariés (formation, promotion, rémunération, services) pour réduire absentéisme et turnover, et améliorer la performance et l'attractivité."},
{l:["Sociétale"],t:"La finalité sociétale",x:"Développement durable (rapport Brundtland, 1987) : protéger l'environnement, le bien-être des salariés, agir pour la société. Poussée par la loi et l'image."},
{l:["Satisfaire le client"],t:"La satisfaction du client (Drucker)",x:"La finalité de l'entreprise est de « créer le client » ; le profit en découle. Deux fonctions clés : le marketing et l'innovation."}]},
{c:"a",l:["Objectifs"],t:"Des finalités aux objectifs",x:"La finalité est une direction abstraite, sans horizon de temps. L'objectif la concrétise.",leaves:[
{l:["Caractéristiques"],t:"Un bon objectif",x:"Simple, quantifiable, mesurable, avec une échéance."},
{l:["Ex. économique"],t:"Exemple économique",x:"Augmenter le chiffre d'affaires de 10 % par an."},
{l:["Ex. social"],t:"Exemple social",x:"Réduire le turnover de 5 % sur 3 ans."},
{l:["Ex. sociétal"],t:"Exemple sociétal",x:"Réduire de 8 % la consommation de détergents."}]},
{c:"t",l:["Parties prenantes"],t:"Les parties prenantes",x:"Individu ou groupe qui peut influencer les décisions de l'entreprise, ou être affecté par la réalisation de ses objectifs (stakeholders).",leaves:[
{l:["Freeman"],t:"La théorie de Freeman",x:"L'entreprise ne doit pas se concentrer sur ses seuls actionnaires : elle doit répondre aux besoins de toutes ses parties prenantes, ce qui lui permet ensuite de faire du profit."},
{l:["Internes"],t:"Parties prenantes internes",x:"Dirigeants, salariés, représentants des salariés, actionnaires : action directe sur l'activité."},
{l:["Externes"],t:"Parties prenantes externes",x:"Clients, fournisseurs, concurrents, banques, syndicats, ONG, société civile, collectivités : influence sur les décisions."},
{l:["Analyse"],t:"Analyser les parties prenantes",x:"Les identifier, évaluer leurs intérêts, repérer leurs interactions, mesurer leur pouvoir et leurs moyens d'action."}]},
{c:"o",l:["Enjeux"],t:"Les enjeux liés aux intérêts",x:"Les intérêts des parties prenantes divergent : le dirigeant doit arbitrer et réguler.",leaves:[
{l:["Cyert et March"],t:"Les coalitions (Cyert et March, 1963)",x:"L'entreprise réunit des coalitions aux intérêts divergents. Le dirigeant arbitre ; les décisions sont le meilleur compromis possible. À défaut, un arbitre extérieur (la justice)."},
{l:["Crozier"],t:"Les jeux de pouvoir (Crozier, 1977)",x:"Tout n'est pas réglé dans l'entreprise : chaque acteur peut exercer un pouvoir et un contre-pouvoir."},
{l:["Zone d'incertitude"],t:"La zone d'incertitude",x:"Les failles des règles et procédures qu'un acteur contrôle lui donnent une marge de manœuvre pour poursuivre ses objectifs."},
{l:["Régulation"],t:"Réguler les tensions",x:"Les rapports de force peuvent déstabiliser l'entreprise : les dirigeants régulent pour obtenir la coopération de tous."}]}]},
cards:[
["f","Qu'est-ce que la finalité d'une entreprise ?","Sa <mark>raison d'être</mark> : elle traduit les motivations économiques, éthiques ou sociales de l'entrepreneur."],
["f","En quoi consiste la finalité économique, et pourquoi est-elle vitale ?","<mark>Générer du profit</mark> pour embaucher, investir, rémunérer les actionnaires. Elle assure la <mark>pérennité</mark> de l'entreprise."],
["f","Qu'est-ce que la finalité sociale ?","L'attention portée aux <mark>salariés</mark> (formation, promotion, rémunération) pour réduire absentéisme et turnover et <mark>améliorer la performance</mark>."],
["f","Comment le rapport Brundtland définit-il le développement durable ?","Un développement qui répond aux <mark>besoins du présent</mark> sans compromettre ceux des <mark>générations futures</mark> (1987)."],
["f","Quelles sont les trois dimensions de la finalité sociétale ?","<mark>Écologique</mark> (pollution, recyclage), <mark>sociale</mark> (conditions de travail, emploi) et <mark>sociétale</mark> (actions humanitaires, caritatives, culturelles)."],
["f","Selon Drucker, quelle est la finalité de l'entreprise ?","<mark>Créer et satisfaire le client</mark> ; le profit en découle. Deux fonctions fondamentales : le <mark>marketing</mark> et l'<mark>innovation</mark>."],
["f","Quelle différence entre finalité et objectif ?","La finalité est une <mark>direction abstraite</mark>, sans horizon de temps. L'objectif est <mark>quantifié, mesurable et daté</mark>."],
["p","Qu'est-ce qu'une partie prenante ?","Un individu ou un groupe qui peut <mark>influencer les décisions</mark> de l'entreprise, ou <mark>être affecté</mark> par la réalisation de ses objectifs."],
["p","Que dit la théorie de Freeman ?","L'entreprise doit répondre aux besoins de <mark>toutes ses parties prenantes</mark>, pas seulement des actionnaires ; le <mark>profit en découle</mark>."],
["p","Citez des parties prenantes internes et externes.","Internes : <mark>dirigeants, salariés, représentants du personnel, actionnaires</mark>. Externes : <mark>clients, fournisseurs, concurrents, banques, ONG, collectivités</mark>…"],
["p","Pourquoi analyser les parties prenantes ?","Pour évaluer leurs <mark>intérêts</mark>, repérer leurs interactions, construire des <mark>compromis</mark> et comprendre leur <mark>pouvoir d'influence</mark>."],
["e","Selon Cyert et March, qu'est-ce qu'une entreprise ?","Un ensemble de <mark>coalitions</mark> aux intérêts divergents ; le dirigeant arbitre et les décisions sont le <mark>meilleur compromis</mark> possible."],
["e","Que montre Michel Crozier ?","Chaque acteur exerce un <mark>pouvoir et un contre-pouvoir</mark> ; sa marge de manœuvre dépend de la <mark>zone d'incertitude</mark> qu'il contrôle."]],
qcm:[
["f","Quelle finalité est commune à toutes les entreprises ?",["La finalité économique","La finalité sociétale","La finalité culturelle","La finalité politique"],"Le profit est vital : il permet d'investir, d'embaucher et d'assurer la pérennité."],
["f","Former les salariés pour réduire le turnover relève de la finalité :",["Sociale","Économique uniquement","Fiscale","Concurrentielle"],"La satisfaction du personnel améliore aussi la performance et l'attractivité de l'entreprise."],
["f","Le rapport Brundtland (1987) a défini :",["Le développement durable","La théorie des parties prenantes","Le tableau de bord prospectif","La force obligatoire du contrat"],"Répondre aux besoins du présent sans compromettre ceux des générations futures."],
["f","Selon Peter Drucker, la finalité de l'entreprise est :",["La satisfaction du client","La maximisation des dividendes","La réduction des coûts","La croissance des effectifs"],"Le profit est le résultat de l'excellence du management mis en place pour satisfaire le client."],
["f","« Réduire le turnover de 5 % sur 3 ans » est :",["Un objectif","Une finalité","Une partie prenante","Une zone d'incertitude"],"L'objectif est chiffré et daté ; il concrétise la finalité sociale."],
["f","Un objectif doit être :",["Simple, quantifiable, mesurable et daté","Abstrait et sans échéance","Fixé par les clients","Identique pour toutes les entreprises"],"La finalité, elle, reste abstraite et sans horizon de temps."],
["p","Selon Freeman, l'entreprise doit répondre aux besoins :",["De toutes ses parties prenantes","Uniquement de ses actionnaires","Uniquement de ses clients","De l'État"],"En répondant à leurs besoins, elle peut ensuite réaliser du profit."],
["p","Laquelle est une partie prenante interne ?",["Les salariés","Les clients","Les ONG","Les collectivités locales"],"Les parties prenantes internes agissent directement sur l'activité."],
["p","Une ONG environnementale qui fait campagne contre une entreprise est une partie prenante :",["Externe","Interne","Contractuelle","Fiscale"],"Les parties prenantes externes influencent les décisions de l'entreprise."],
["e","Pour Cyert et March, les décisions de l'entreprise sont :",["Le meilleur compromis entre coalitions aux intérêts divergents","Imposées par l'actionnaire majoritaire","Toujours prises à l'unanimité","Fixées par la loi"],"Le dirigeant arbitre en permanence ; à défaut d'accord, un arbitre extérieur peut intervenir."],
["e","Selon Crozier, la marge de manœuvre d'un acteur dépend :",["De la zone d'incertitude qu'il contrôle","De son ancienneté","De son salaire","Du nombre de ses diplômes"],"Les failles des règles et procédures lui permettent de poursuivre ses propres objectifs."]]},

en:{intro:"Why a business exists, how its purposes become objectives, and how it deals with its stakeholders.",
cats:{f:["Purposes and objectives","v"],p:["Stakeholders","t"],e:["Power issues","o"]},
map:{root:{l:["Purposes and","stakeholders"],t:"Purposes and stakeholders",x:"A business's purpose is its reason for being. To achieve it, it must meet the expectations of its internal and external partners."},
cols:[
{c:"v",l:["Purposes"],t:"Purposes",x:"There is not one purpose but several, shaped by the managers' values, the firm's history, staff expectations and the environment.",leaves:[
{l:["Economic"],t:"Economic purpose",x:"Shared by all businesses: making a profit to hire, invest, train and pay shareholders. It ensures survival."},
{l:["Social"],t:"Social purpose",x:"Employee well-being (training, promotion, pay, services) to reduce absenteeism and staff turnover, and improve performance and attractiveness."},
{l:["Societal"],t:"Societal purpose",x:"Sustainable development (Brundtland report, 1987): protecting the environment and employees, acting for society. Driven by law and image."},
{l:["Customer"],t:"Customer satisfaction (Drucker)",x:"The purpose of a business is to 'create a customer'; profit follows. Two key functions: marketing and innovation."}]},
{c:"a",l:["Objectives"],t:"From purposes to objectives",x:"A purpose is an abstract direction with no time horizon. An objective makes it concrete.",leaves:[
{l:["Features"],t:"A good objective",x:"Simple, quantifiable, measurable, with a deadline."},
{l:["Economic example"],t:"Economic example",x:"Increase turnover by 10% a year."},
{l:["Social example"],t:"Social example",x:"Cut staff turnover by 5% over 3 years."},
{l:["Societal example"],t:"Societal example",x:"Cut detergent use by 8%."}]},
{c:"t",l:["Stakeholders"],t:"Stakeholders",x:"Any individual or group that can influence the business's decisions, or be affected by the achievement of its objectives.",leaves:[
{l:["Freeman"],t:"Freeman's theory",x:"A business should not focus only on shareholders: it must meet the needs of all its stakeholders, which then allows it to make a profit."},
{l:["Internal"],t:"Internal stakeholders",x:"Managers, employees, employee representatives, shareholders: direct action on the business."},
{l:["External"],t:"External stakeholders",x:"Customers, suppliers, competitors, banks, trade unions, NGOs, civil society, local authorities: influence on decisions."},
{l:["Analysis"],t:"Analysing stakeholders",x:"Identify them, assess their interests, map their interactions, measure their power and means of action."}]},
{c:"o",l:["Power"],t:"Conflicting interests",x:"Stakeholders' interests diverge: managers must arbitrate and regulate.",leaves:[
{l:["Cyert and March"],t:"Coalitions (Cyert and March, 1963)",x:"A business brings together coalitions with divergent interests. Managers arbitrate; decisions are the best possible compromise. Failing that, an outside arbiter (the courts)."},
{l:["Crozier"],t:"Power games (Crozier, 1977)",x:"Not everything is regulated in a business: every actor can exercise power and counter-power."},
{l:["Uncertainty zone"],t:"Zone of uncertainty",x:"Gaps in rules and procedures that an actor controls give them room to pursue their own goals."},
{l:["Regulation"],t:"Managing tensions",x:"Power struggles can destabilise the business: managers regulate them to secure everyone's cooperation."}]}]},
cards:[
["f","What is a business's purpose?","Its <mark>reason for being</mark>: it reflects the entrepreneur's economic, ethical or social motivations."],
["f","What is the economic purpose, and why is it vital?","<mark>Making a profit</mark> to hire, invest and pay shareholders. It ensures the business's <mark>survival</mark>."],
["f","What is the social purpose?","Attention to <mark>employees</mark> (training, promotion, pay) to reduce absenteeism and staff turnover and <mark>improve performance</mark>."],
["f","How does the Brundtland report define sustainable development?","Development that meets the <mark>needs of the present</mark> without compromising those of <mark>future generations</mark> (1987)."],
["f","What are the three dimensions of the societal purpose?","<mark>Environmental</mark> (pollution, recycling), <mark>social</mark> (working conditions, jobs) and <mark>societal</mark> (humanitarian, charitable, cultural action)."],
["f","According to Drucker, what is the purpose of a business?","To <mark>create and satisfy customers</mark>; profit follows. Two core functions: <mark>marketing</mark> and <mark>innovation</mark>."],
["f","Purpose versus objective?","A purpose is an <mark>abstract direction</mark> with no time horizon. An objective is <mark>quantified, measurable and dated</mark>."],
["p","What is a stakeholder?","An individual or group that can <mark>influence the business's decisions</mark>, or <mark>be affected</mark> by the achievement of its objectives."],
["p","What does Freeman's theory say?","A business must meet the needs of <mark>all its stakeholders</mark>, not just shareholders; <mark>profit follows</mark>."],
["p","Give examples of internal and external stakeholders.","Internal: <mark>managers, employees, employee representatives, shareholders</mark>. External: <mark>customers, suppliers, competitors, banks, NGOs, local authorities</mark>…"],
["p","Why analyse stakeholders?","To assess their <mark>interests</mark>, map their interactions, build <mark>compromises</mark> and understand their <mark>power of influence</mark>."],
["e","According to Cyert and March, what is a business?","A set of <mark>coalitions</mark> with divergent interests; managers arbitrate and decisions are the <mark>best possible compromise</mark>."],
["e","What does Michel Crozier show?","Every actor exercises <mark>power and counter-power</mark>; their room for manoeuvre depends on the <mark>zone of uncertainty</mark> they control."]],
qcm:[
["f","Which purpose is shared by all businesses?",["The economic purpose","The societal purpose","The cultural purpose","The political purpose"],"Profit is vital: it allows investment, hiring and survival."],
["f","Training staff to reduce turnover relates to the:",["Social purpose","Economic purpose only","Tax purpose","Competitive purpose"],"Staff satisfaction also improves the business's performance and attractiveness."],
["f","The Brundtland report (1987) defined:",["Sustainable development","Stakeholder theory","The balanced scorecard","The binding force of contracts"],"Meeting present needs without compromising those of future generations."],
["f","According to Peter Drucker, the purpose of a business is:",["Customer satisfaction","Maximising dividends","Cutting costs","Growing headcount"],"Profit results from management excellence in satisfying customers."],
["f","'Cut staff turnover by 5% over 3 years' is:",["An objective","A purpose","A stakeholder","A zone of uncertainty"],"An objective is quantified and dated; it makes the social purpose concrete."],
["f","An objective should be:",["Simple, quantifiable, measurable and dated","Abstract with no deadline","Set by customers","The same for all businesses"],"A purpose, by contrast, stays abstract and has no time horizon."],
["p","According to Freeman, a business must meet the needs of:",["All its stakeholders","Only its shareholders","Only its customers","The State"],"By meeting their needs, it can then make a profit."],
["p","Which is an internal stakeholder?",["Employees","Customers","NGOs","Local authorities"],"Internal stakeholders act directly on the business."],
["p","An environmental NGO campaigning against a business is a stakeholder that is:",["External","Internal","Contractual","Fiscal"],"External stakeholders influence the business's decisions."],
["e","For Cyert and March, a business's decisions are:",["The best compromise between coalitions with divergent interests","Imposed by the majority shareholder","Always unanimous","Set by law"],"Managers constantly arbitrate; failing agreement, an outside arbiter may step in."],
["e","According to Crozier, an actor's room for manoeuvre depends on:",["The zone of uncertainty they control","Their seniority","Their salary","Their number of degrees"],"Gaps in rules and procedures let them pursue their own goals."]]}
};

T1["t1-entrepreneuriat"]={
fr:{intro:"Créer une entreprise, distinguer l'entrepreneur du manager, et mesurer la performance.",
cats:{c:["Créer une entreprise","v"],d:["Entrepreneur et manager","t"],p:["Performance","a"],t:["Tableaux de bord","o"]},
map:{root:{l:["Entreprendre","et performer"],t:"La démarche entrepreneuriale et la performance",x:"Créer une entreprise suppose une démarche d'entrepreneur ; la faire réussir suppose de mesurer sa performance avec des indicateurs regroupés dans un tableau de bord."},
cols:[
{c:"v",l:["Création"],t:"Les étapes de la création",x:"De l'idée à l'installation, le créateur suit des étapes dans un ordre défini pour vérifier la faisabilité commerciale et financière.",leaves:[
{l:["Idée et projet"],t:"1-2. L'idée et le projet personnel",x:"Trouver l'idée et vérifier qu'elle correspond au projet de vie du créateur."},
{l:["Étude de marché"],t:"3. L'étude de marché",x:"Valider la faisabilité commerciale du projet."},
{l:["Prévisions finan."],t:"4. Les prévisions financières",x:"Chiffrer le projet pour vérifier sa faisabilité financière."},
{l:["Financement, aides"],t:"5. Le financement et les aides",x:"Réunir les ressources nécessaires au lancement."},
{l:["Statut, formalités"],t:"6-8. Statut, formalités, installation",x:"Choisir le statut juridique, accomplir les formalités de création, puis installer l'entreprise."}]},
{c:"t",l:["Entrepreneur"],t:"La démarche entrepreneuriale",x:"Une logique créative de détection et d'exploitation d'opportunités.",leaves:[
{l:["Schumpeter"],t:"L'entrepreneur selon Schumpeter",x:"Il réalise de nouvelles combinaisons : nouveaux produits, méthodes de production, marchés ou organisations."},
{l:["Opportunités"],t:"Percevoir les opportunités",x:"Savoir repérer une opportunité, l'exploiter et en tirer de la valeur."},
{l:["Prise de risque"],t:"La prise de risque",x:"L'entrepreneur investit souvent son propre argent et mène des stratégies audacieuses à moyen ou long terme."}]},
{c:"t",l:["Manager"],t:"La démarche managériale",x:"Une logique rationnelle, surtout dans les grandes entreprises où propriétaires et dirigeants sont séparés.",leaves:[
{l:["Mandat de gestion"],t:"Le mandat de gestion",x:"Les actionnaires confient aux managers la gestion de leurs capitaux, pour les faire fructifier."},
{l:["Efficience"],t:"La recherche d'efficience",x:"Allouer les ressources, réduire les coûts, adapter les compétences à court terme."},
{l:["Différences"],t:"Entrepreneur ou manager ?",x:"Le manager agit dans un budget, ne choisit pas toujours ses collaborateurs et met en œuvre la stratégie définie par la politique générale."}]},
{c:"a",l:["Performance"],t:"La performance",x:"Degré d'accomplissement des objectifs. Elle combine efficacité et efficience.",leaves:[
{l:["Efficacité"],t:"L'efficacité",x:"Atteindre les objectifs fixés. Mesure : résultat obtenu / objectif visé (ex. : livraisons conformes / livraisons totales)."},
{l:["Efficience"],t:"L'efficience",x:"Optimiser les moyens pour atteindre ces objectifs. Mesure : résultat obtenu / moyens mis en œuvre (ex. : coût des contrôles qualité / marge)."},
{l:["Indicateurs"],t:"Les indicateurs",x:"Critères qualitatifs ou quantitatifs qui mesurent la performance."}]},
{c:"o",l:["Tableaux de bord"],t:"Les tableaux de bord",x:"Des outils de pilotage qui rassemblent les indicateurs.",leaves:[
{l:["Tableau de bord"],t:"Le tableau de bord",x:"Récapitule les indicateurs, analyse les écarts entre objectifs et résultats pour décider d'actions correctrices. Introduit par Alfred Sloan chez General Motors."},
{l:["TBP (1992)"],t:"Le tableau de bord prospectif",x:"Créé par Kaplan et Norton : des indicateurs financiers et non financiers répartis sur quatre axes."},
{l:["Axe financier"],t:"Axe financier",x:"Que faut-il apporter aux actionnaires ?"},
{l:["Axe clients"],t:"Axe clients",x:"Que faut-il apporter aux clients ?"},
{l:["Processus internes"],t:"Axe processus internes",x:"Quels processus sont essentiels à la satisfaction des clients et des actionnaires ?"},
{l:["Apprentissage"],t:"Axe apprentissage",x:"Comment piloter le changement et l'amélioration ?"}]}]},
cards:[
["c","Pourquoi le créateur suit-il des étapes dans un ordre défini ?","Pour <mark>valider la faisabilité commerciale et financière</mark> de son projet avant de se lancer."],
["c","Quelles sont les grandes étapes de la création d'une entreprise ?","L'idée, le projet personnel, l'<mark>étude de marché</mark>, les <mark>prévisions financières</mark>, le financement et les aides, le <mark>statut juridique</mark>, les formalités, l'installation."],
["d","Qu'est-ce qu'un entrepreneur selon Schumpeter ?","L'agent qui réalise de <mark>nouvelles combinaisons</mark> : nouveaux produits, méthodes de production, marchés ou organisations. Il perçoit les opportunités et <mark>prend des risques</mark>."],
["d","Qu'est-ce que la logique entrepreneuriale ?","Un processus de <mark>détection et d'exploitation d'opportunités</mark> pour créer de la valeur. Elle est <mark>créative</mark>."],
["d","Qu'est-ce que la logique managériale ?","Une logique <mark>rationnelle</mark>, fréquente dans les grandes entreprises : les actionnaires confient un <mark>mandat de gestion</mark> aux managers, qui recherchent l'efficience."],
["d","Quelles différences entre entrepreneur et manager ?","L'entrepreneur investit <mark>son propre argent</mark>, choisit ses collaborateurs et définit une stratégie audacieuse. Le manager agit dans un <mark>budget</mark> et <mark>met en œuvre</mark> la stratégie définie."],
["p","Qu'est-ce que la performance ?","Le <mark>degré d'accomplissement des objectifs</mark>. Elle conjugue <mark>efficacité</mark> et <mark>efficience</mark>."],
["p","Efficacité ou efficience ?","Efficace : <mark>atteindre ses objectifs</mark>. Efficient : <mark>optimiser les moyens</mark> pour les atteindre."],
["p","Comment mesurer l'efficacité et l'efficience ?","Efficacité : <mark>résultat / objectif</mark>. Efficience : <mark>résultat / moyens</mark> mis en œuvre."],
["t","Qu'est-ce qu'un tableau de bord ?","Un document qui <mark>récapitule les indicateurs</mark> de performance et permet d'<mark>analyser les écarts</mark> entre objectifs et résultats pour décider d'actions correctrices."],
["t","Qui a introduit le tableau de bord traditionnel ?","<mark>Alfred Sloan</mark>, à la tête de <mark>General Motors</mark>, avec le contrôle de gestion."],
["t","Qu'est-ce que le tableau de bord prospectif ?","Créé par <mark>Kaplan et Norton</mark> (1992), il combine des indicateurs <mark>financiers et non financiers</mark> sur quatre axes."],
["t","Quels sont les quatre axes du tableau de bord prospectif ?","<mark>Financier</mark> (actionnaires), <mark>clients</mark>, <mark>processus internes</mark>, <mark>apprentissage</mark> (changement et amélioration)."]],
qcm:[
["c","Quelle étape permet de vérifier la faisabilité commerciale d'un projet ?",["L'étude de marché","Le choix du statut juridique","Les formalités de création","L'installation"],"Les prévisions financières vérifient, elles, la faisabilité financière."],
["c","Le choix du statut juridique intervient :",["Après l'étude de marché, les prévisions et le financement","Avant même d'avoir une idée","Après l'installation","Jamais, il est imposé"],"Les étapes suivent un ordre défini, de l'idée à l'installation."],
["d","Selon Schumpeter, l'entrepreneur :",["Réalise de nouvelles combinaisons de production","Gère un budget fixé par les actionnaires","Évite toute prise de risque","Applique la stratégie décidée par d'autres"],"Nouveaux produits, méthodes, marchés ou organisations."],
["d","La logique managériale est surtout :",["Rationnelle et tournée vers l'efficience","Créative et risquée","Réservée aux micro-entreprises","Fondée sur l'intuition"],"Le manager alloue les ressources et agit plutôt à court terme."],
["d","Qui investit le plus souvent son propre argent ?",["L'entrepreneur","Le manager","Le salarié","Le client"],"Le manager agit dans le cadre du budget de l'entreprise."],
["p","Une entreprise atteint son objectif de ventes mais dépense deux fois plus que prévu. Elle est :",["Efficace mais pas efficiente","Efficiente mais pas efficace","Efficace et efficiente","Ni efficace ni efficiente"],"Elle atteint l'objectif (efficacité) sans optimiser ses moyens (efficience)."],
["p","Le rapport « livraisons conformes / livraisons totales » mesure :",["L'efficacité","L'efficience","La rentabilité financière","Le turnover"],"L'efficacité rapporte le résultat obtenu à l'objectif visé."],
["p","L'efficience se mesure par le rapport entre :",["Le résultat obtenu et les moyens mis en œuvre","Le résultat obtenu et l'objectif visé","Les ventes et les concurrents","Les salariés et les clients"],"Exemple : coût des contrôles qualité / marge de production."],
["t","À quoi sert principalement un tableau de bord ?",["Analyser les écarts entre objectifs et résultats pour corriger","Établir la comptabilité légale","Recruter des salariés","Rédiger les statuts"],"Il visualise les informations essentielles au pilotage."],
["t","Le tableau de bord prospectif a été créé par :",["Kaplan et Norton","Cyert et March","Alfred Sloan","Joseph Schumpeter"],"En 1992, pour compléter les seuls indicateurs financiers."],
["t","Lequel n'est PAS un axe du tableau de bord prospectif ?",["Axe fiscal","Axe financier","Axe clients","Axe apprentissage"],"Les quatre axes : financier, clients, processus internes, apprentissage."]]},

cols:[
{c:"v",l:["Start-up"],t:"Steps to start a business",x:"From idea to launch, the founder follows steps in a set order to check commercial and financial feasibility.",leaves:[

{l:["Funding & aid"],t:"5. Funding and aid",x:"Gather the resources needed to launch."},

{c:"t",l:["Entrepreneur"],t:"The entrepreneurial approach",x:"A creative logic of spotting and exploiting opportunities.",leaves:[

cards:[
["c","Why does a founder follow steps in a set order?","To <mark>confirm the commercial and financial feasibility</mark> of the project before launching."],
["c","What are the main steps to start a business?","Idea, personal project, <mark>market research</mark>, <mark>financial forecasts</mark>, funding and aid, <mark>legal structure</mark>, formalities, set-up."],
["d","What is an entrepreneur according to Schumpeter?","The agent who creates <mark>new combinations</mark>: new products, production methods, markets or organisations. They spot opportunities and <mark>take risks</mark>."],
["d","What is the entrepreneurial logic?","A process of <mark>spotting and exploiting opportunities</mark> to create value. It is <mark>creative</mark>."],
["d","What is the managerial logic?","A <mark>rational</mark> logic, common in large companies: shareholders give managers a <mark>management mandate</mark>, and managers seek efficiency."],
["d","How do entrepreneurs and managers differ?","The entrepreneur invests <mark>their own money</mark>, chooses their team and sets a bold strategy. The manager works within a <mark>budget</mark> and <mark>implements</mark> the strategy set."],
["p","What is performance?","The <mark>extent to which objectives are achieved</mark>. It combines <mark>effectiveness</mark> and <mark>efficiency</mark>."],
["p","Effectiveness or efficiency?","Effective: <mark>reaching objectives</mark>. Efficient: <mark>optimising resources</mark> to reach them."],
["p","How are effectiveness and efficiency measured?","Effectiveness: <mark>result / target</mark>. Efficiency: <mark>result / resources</mark> used."],
["t","What is a dashboard?","A document that <mark>summarises performance indicators</mark> and helps <mark>analyse gaps</mark> between objectives and results to decide on corrective action."],
["t","Who introduced the traditional dashboard?","<mark>Alfred Sloan</mark>, head of <mark>General Motors</mark>, along with management control."],
["t","What is the balanced scorecard?","Created by <mark>Kaplan and Norton</mark> (1992), it combines <mark>financial and non-financial</mark> indicators across four perspectives."],
["t","What are the four perspectives of the balanced scorecard?","<mark>Financial</mark> (shareholders), <mark>customers</mark>, <mark>internal processes</mark>, <mark>learning and growth</mark> (change and improvement)."]],
qcm:[
["c","Which step checks the commercial feasibility of a project?",["Market research","Choosing the legal structure","Registration formalities","Setting up"],"Financial forecasts check financial feasibility."],
["c","The legal structure is chosen:",["After market research, forecasts and funding","Before having an idea","After setting up","Never: it is imposed"],"The steps follow a set order, from idea to set-up."],
["d","According to Schumpeter, the entrepreneur:",["Creates new combinations of production","Manages a budget set by shareholders","Avoids all risk","Applies a strategy decided by others"],"New products, methods, markets or organisations."],
["d","The managerial logic is mainly:",["Rational and focused on efficiency","Creative and risky","Only for micro-businesses","Based on intuition"],"The manager allocates resources and acts mostly in the short term."],
["d","Who most often invests their own money?",["The entrepreneur","The manager","The employee","The customer"],"The manager works within the company's budget."],
["p","A business reaches its sales target but spends twice as much as planned. It is:",["Effective but not efficient","Efficient but not effective","Both","Neither"],"It reaches the target (effectiveness) without optimising resources (efficiency)."],
["p","The ratio 'compliant deliveries / total deliveries' measures:",["Effectiveness","Efficiency","Financial profitability","Staff turnover"],"Effectiveness compares the result achieved with the target."],
["p","Efficiency is measured by the ratio between:",["Result achieved and resources used","Result achieved and target","Sales and competitors","Employees and customers"],"Example: quality-control cost / production margin."],
["t","What is a dashboard mainly used for?",["Analysing gaps between objectives and results in order to correct them","Keeping statutory accounts","Recruiting staff","Drafting articles of association"],"It shows the key information needed to steer the business."],
["t","The balanced scorecard was created by:",["Kaplan and Norton","Cyert and March","Alfred Sloan","Joseph Schumpeter"],"In 1992, to complement purely financial indicators."],
["t","Which is NOT a balanced scorecard perspective?",["Tax","Financial","Customers","Learning and growth"],"The four perspectives: financial, customers, internal processes, learning and growth."]]}

T1["t3-production"]={
fr:{intro:"Les facteurs de production, leur combinaison et leur coût, l'influence des paramètres économiques, et le choix entre faire et faire faire.",
cats:{f:["Facteurs de production","v"],c:["Combinaison et productivité","t"],p:["Paramètres économiques","a"],i:["Faire ou faire faire","o"]},
map:{root:{l:["Les choix","de production"],t:"Les facteurs et les choix de production",x:"Pour améliorer sa performance, l'entreprise choisit ses facteurs de production, les combine au moindre coût, tient compte des paramètres économiques et décide de ce qu'elle fait elle-même."},
cols:[
{c:"v",l:["Facteurs"],t:"Les facteurs de production",x:"Les ressources utilisées pour produire des biens et des services.",leaves:[
{l:["Travail"],t:"Le facteur travail",x:"La main-d'œuvre, mesurée par sa qualité (compétences, connaissance du métier) et sa quantité (population active, durée du travail)."},
{l:["Capital"],t:"Le facteur capital",x:"Capital fixe, qui dure plusieurs années : technique (bâtiments, machines) ou immatériel (brevets, marques). Capital circulant, consommé en un cycle : matières, énergie."},
{l:["Connaissances"],t:"Le facteur connaissances",x:"Dans l'économie du savoir, les investissements immatériels (formation, recherche et développement, innovation) deviennent essentiels."},
{l:["Matières premières"],t:"Les matières premières",x:"Biens détruits ou transformés pendant la production, dont l'énergie. Leur coût fluctue selon les cours mondiaux."}]},
{c:"t",l:["Combinaison"],t:"La combinaison productive",x:"L'entreprise combine travail et capital en tenant compte du coût, de la qualité et des contraintes techniques.",leaves:[
{l:["Optimale"],t:"La combinaison optimale",x:"La combinaison la moins coûteuse et la plus efficace."},
{l:["Substituables"],t:"Facteurs substituables",x:"L'un peut remplacer l'autre (ex. : la machine à vendanger et les vendangeurs)."},
{l:["Complémentaires"],t:"Facteurs complémentaires",x:"Ils doivent être utilisés ensemble (ex. : le photographe et son appareil)."},
{l:["Incompressible"],t:"Facteur incompressible",x:"Il ne peut pas être remplacé (ex. : le travail d'un artiste peintre)."}]},
{c:"t",l:["Productivité"],t:"Les coûts et la productivité",x:"La productivité mesure l'efficacité d'un facteur de production.",leaves:[
{l:["Définition"],t:"La productivité",x:"Rapport entre la quantité produite et la quantité de facteurs utilisée."},
{l:["Du travail"],t:"Productivité du travail",x:"Production obtenue / quantité de travail utilisée."},
{l:["Du capital"],t:"Productivité du capital",x:"Production obtenue / quantité de capital utilisée."}]},
{c:"a",l:["Paramètres"],t:"L'influence des paramètres économiques",x:"Les taux d'intérêt et le coût des facteurs pèsent sur les décisions d'investir et de recruter.",leaves:[
{l:["Taux d'intérêt"],t:"Les taux d'intérêt",x:"Le taux est le coût de l'emprunt. Sa baisse encourage l'emprunt, donc l'investissement, et rend les placements moins intéressants."},
{l:["Coût du travail"],t:"Le coût du travail",x:"Le niveau des salaires est un déterminant important de la décision de recruter."},
{l:["Recrutement"],t:"Les autres critères du recrutement",x:"Qualification recherchée, disponibilité des candidats, adaptation au poste : le salaire n'est pas toujours décisif."}]},
{c:"o",l:["Faire / faire faire"],t:"Faire ou faire faire",x:"L'analyse de la chaîne de valeur aide à choisir ce que l'entreprise garde ou confie à d'autres.",leaves:[
{l:["Chaîne de valeur"],t:"La chaîne de valeur (Porter)",x:"Découper l'activité pour repérer les activités créatrices de valeur."},
{l:["Act. principales"],t:"Les activités principales",x:"Logistique interne, production, ventes et marketing : le cœur de métier."},
{l:["Act. de soutien"],t:"Les activités de soutien",x:"Approvisionnement, recherche et développement, gestion du personnel, infrastructure (finance, comptabilité)."},
{l:["Faire"],t:"Le choix de faire",x:"Garder le cœur de métier, source d'avantage concurrentiel ; mieux maîtriser la qualité et réduire les coûts de transport et de stockage."},
{l:["Faire faire"],t:"L'impartition",x:"Confier des activités non clés à des partenaires (sous-traitance, concession, franchise) : savoir-faire, flexibilité, recentrage."},
{l:["Limites"],t:"Les limites de l'impartition",x:"Dépendance réciproque entre partenaires et risque de perte de savoir-faire."}]}]},
cards:[
["f","Quels sont les principaux facteurs de production ?","Le <mark>travail</mark>, le <mark>capital</mark>, les <mark>connaissances</mark> et les <mark>matières premières</mark>."],
["f","Comment mesure-t-on le facteur travail ?","Par sa <mark>qualité</mark> (compétences, connaissance du métier) et sa <mark>quantité</mark> (population active, durée du travail)."],
["f","Capital fixe ou capital circulant ?","Fixe : biens <mark>durables</mark> (machines, bâtiments, brevets). Circulant : biens <mark>consommés en un seul cycle</mark> (matières, énergie)."],
["f","Pourquoi les connaissances sont-elles devenues un facteur de production essentiel ?","Dans l'<mark>économie du savoir</mark>, la richesse vient surtout des savoirs : formation, <mark>R&D</mark> et innovation sont privilégiées."],
["c","Qu'est-ce que la combinaison productive optimale ?","La combinaison de travail et de capital <mark>la moins coûteuse et la plus efficace</mark>, compte tenu de la qualité et des contraintes techniques."],
["c","Facteurs substituables, complémentaires, incompressibles ?","Substituables : l'un <mark>remplace</mark> l'autre. Complémentaires : utilisés <mark>ensemble</mark>. Incompressible : <mark>irremplaçable</mark>."],
["c","Qu'est-ce que la productivité ?","Le rapport entre la <mark>production obtenue</mark> et la <mark>quantité de facteurs</mark> utilisée. Ex. : productivité du travail = production / travail."],
["p","Quel est l'effet d'une baisse des taux d'intérêt ?","L'emprunt coûte <mark>moins cher</mark> : l'entreprise est incitée à <mark>investir</mark>, et les placements financiers rapportent moins."],
["p","Le salaire est-il le seul critère de recrutement ?","Non : l'entreprise regarde aussi la <mark>qualification</mark>, la <mark>disponibilité</mark> des candidats et leur <mark>adaptation</mark> au poste."],
["i","Qu'est-ce que la chaîne de valeur de Porter ?","Un outil qui découpe l'activité pour <mark>repérer les activités créatrices de valeur</mark> : activités principales et activités de soutien."],
["i","Activités principales ou de soutien ?","Principales : <mark>logistique interne, production, ventes et marketing</mark>. Soutien : <mark>approvisionnement, R&D, gestion du personnel, infrastructure</mark>."],
["i","Pourquoi garder une activité en interne (faire) ?","Parce qu'elle fait partie du <mark>cœur de métier</mark>, source d'avantage concurrentiel, et pour <mark>maîtriser la qualité</mark> et certains coûts."],
["i","Qu'est-ce que l'impartition ?","« <mark>Faire faire</mark> » tout ou partie de ses activités par des partenaires : <mark>sous-traitance, concession, franchise</mark>."],
["i","Quels sont les avantages et les limites de l'impartition ?","Avantages : <mark>savoir-faire</mark> du partenaire, <mark>flexibilité</mark>, recentrage. Limites : <mark>dépendance</mark> réciproque et perte de savoir-faire."]],
qcm:[
["f","Les brevets et les marques font partie du :",["Capital fixe immatériel","Capital circulant","Facteur travail","Facteur matières premières"],"Le capital fixe comprend aussi le capital technique : bâtiments, machines, équipements."],
["f","L'énergie consommée pendant la fabrication relève du :",["Capital circulant","Capital fixe","Capital immatériel","Facteur connaissances"],"Le capital circulant est consommé ou transformé au cours d'un seul cycle de production."],
["f","Dans l'économie du savoir, les entreprises privilégient :",["Les investissements immatériels (formation, R&D)","Uniquement l'achat de machines","La baisse des salaires","L'augmentation des stocks"],"Le savoir est devenu un facteur de production fondamental."],
["c","La machine à vendanger et les vendangeurs sont des facteurs :",["Substituables","Complémentaires","Incompressibles","Circulants"],"L'un peut remplacer l'autre."],
["c","Un photographe et son appareil sont des facteurs :",["Complémentaires","Substituables","Incompressibles","Immatériels"],"Ils doivent être utilisés ensemble."],
["c","La productivité du travail se calcule par :",["Production obtenue / quantité de travail","Quantité de travail / production","Chiffre d'affaires / capital","Salaires / production"],"La productivité du capital rapporte la production à la quantité de capital."],
["p","Une baisse des taux d'intérêt a plutôt pour effet :",["D'encourager l'investissement","De freiner l'investissement","D'augmenter le coût des emprunts","De rendre les placements plus rentables"],"Le taux d'intérêt représente le coût de l'emprunt."],
["p","Lors d'un recrutement, l'entreprise tient compte :",["Du salaire, mais aussi de la qualification et de l'adaptation au poste","Uniquement du salaire","Uniquement de l'âge","Uniquement du diplôme"],"La rémunération n'est pas toujours le paramètre essentiel."],
["i","Selon Porter, laquelle est une activité principale ?",["La production","La gestion du personnel","La comptabilité","Le développement technologique"],"Les activités principales sont la logistique interne, la production, les ventes et le marketing."],
["i","Confier la fabrication de pièces à un sous-traitant relève :",["De l'impartition","De l'intégration","Du capital circulant","De la productivité du capital"],"L'impartition comprend la sous-traitance, la concession et la franchise."],
["i","Quel est un risque de l'impartition ?",["La dépendance envers les partenaires et la perte de savoir-faire","Une hausse de la flexibilité","Le recentrage sur le cœur de métier","L'accès au savoir-faire d'un partenaire"],"Les trois autres réponses sont des avantages de l'impartition."]]},

en:{intro:"Factors of production, how they are combined and what they cost, the influence of economic parameters, and the choice between make or buy.",
cats:{f:["Factors of production","v"],c:["Combination and productivity","t"],p:["Economic parameters","a"],i:["Make or buy","o"]},
map:{root:{l:["Production","choices"],t:"Factors of production and production choices",x:"To improve performance, a business chooses its factors of production, combines them at the lowest cost, takes economic parameters into account and decides what to do in-house."},
cols:[
{c:"v",l:["Factors"],t:"Factors of production",x:"The resources used to produce goods and services.",leaves:[
{l:["Labour"],t:"Labour",x:"The workforce, measured by quality (skills, job knowledge) and quantity (working population, working hours)."},
{l:["Capital"],t:"Capital",x:"Fixed capital lasting several years: physical (buildings, machines) or intangible (patents, brands). Circulating capital used up in one cycle: materials, energy."},
{l:["Knowledge"],t:"Knowledge",x:"In the knowledge economy, intangible investment (training, research and development, innovation) becomes essential."},
{l:["Raw materials"],t:"Raw materials",x:"Goods destroyed or transformed during production, including energy. Their cost varies with world prices."}]},
{c:"t",l:["Combination"],t:"The production combination",x:"The business combines labour and capital based on cost, quality and technical constraints.",leaves:[
{l:["Optimal"],t:"The optimal combination",x:"The least costly and most effective combination."},
{l:["Substitutable"],t:"Substitutable factors",x:"One can replace the other (e.g. a grape-harvesting machine and pickers)."},
{l:["Complementary"],t:"Complementary factors",x:"They must be used together (e.g. a photographer and their camera)."},
{l:["Irreplaceable"],t:"Irreplaceable factor",x:"It cannot be replaced (e.g. a painter's artistic work)."}]},
{c:"t",l:["Productivity"],t:"Costs and productivity",x:"Productivity measures how effective a factor of production is.",leaves:[
{l:["Definition"],t:"Productivity",x:"Output divided by the quantity of factors used."},
{l:["Of labour"],t:"Labour productivity",x:"Output / quantity of labour used."},
{l:["Of capital"],t:"Capital productivity",x:"Output / quantity of capital used."}]},
{c:"a",l:["Parameters"],t:"The influence of economic parameters",x:"Interest rates and factor costs weigh on decisions to invest and hire.",leaves:[
{l:["Interest rates"],t:"Interest rates",x:"The rate is the cost of borrowing. A fall encourages borrowing, hence investment, and makes savings less attractive."},
{l:["Labour cost"],t:"Labour cost",x:"Wage levels are a key factor in the decision to hire."},
{l:["Recruitment"],t:"Other hiring criteria",x:"Required qualifications, candidate availability, fit with the job: pay is not always decisive."}]},
{c:"o",l:["Make or buy"],t:"Make or buy",x:"Value chain analysis helps decide what to keep in-house and what to outsource.",leaves:[
{l:["Value chain"],t:"The value chain (Porter)",x:"Breaking the business down to identify value-creating activities."},
{l:["Primary"],t:"Primary activities",x:"Inbound logistics, operations, sales and marketing: the core business."},
{l:["Support"],t:"Support activities",x:"Procurement, research and development, human resources, infrastructure (finance, accounting)."},
{l:["Make"],t:"Making in-house",x:"Keeping the core business, a source of competitive advantage; better quality control and lower transport and storage costs."},
{l:["Buy (outsource)"],t:"Outsourcing",x:"Entrusting non-core activities to partners (subcontracting, dealerships, franchising): expertise, flexibility, refocusing."},
{l:["Limits"],t:"Limits of outsourcing",x:"Mutual dependency between partners and a risk of losing know-how."}]}]},
cards:[
["f","What are the main factors of production?","<mark>Labour</mark>, <mark>capital</mark>, <mark>knowledge</mark> and <mark>raw materials</mark>."],
["f","How is labour measured?","By its <mark>quality</mark> (skills, job knowledge) and <mark>quantity</mark> (working population, working hours)."],
["f","Fixed or circulating capital?","Fixed: <mark>long-lasting</mark> goods (machines, buildings, patents). Circulating: goods <mark>used up in one cycle</mark> (materials, energy)."],
["f","Why has knowledge become a key factor of production?","In the <mark>knowledge economy</mark>, wealth comes mainly from know-how: training, <mark>R&D</mark> and innovation are prioritised."],
["c","What is the optimal production combination?","The mix of labour and capital that is <mark>least costly and most effective</mark>, given quality and technical constraints."],
["c","Substitutable, complementary, irreplaceable factors?","Substitutable: one <mark>replaces</mark> the other. Complementary: used <mark>together</mark>. Irreplaceable: <mark>cannot be replaced</mark>."],
["c","What is productivity?","The ratio between <mark>output</mark> and the <mark>quantity of factors</mark> used. E.g. labour productivity = output / labour."],
["p","What is the effect of lower interest rates?","Borrowing is <mark>cheaper</mark>: businesses are encouraged to <mark>invest</mark>, and savings earn less."],
["p","Is pay the only hiring criterion?","No: businesses also consider <mark>qualifications</mark>, candidate <mark>availability</mark> and <mark>fit</mark> with the job."],
["i","What is Porter's value chain?","A tool that breaks the business down to <mark>identify value-creating activities</mark>: primary and support activities."],
["i","Primary or support activities?","Primary: <mark>inbound logistics, operations, sales and marketing</mark>. Support: <mark>procurement, R&D, HR, infrastructure</mark>."],
["i","Why keep an activity in-house (make)?","Because it is part of the <mark>core business</mark>, a source of competitive advantage, and to <mark>control quality</mark> and some costs."],
["i","What is outsourcing (impartition)?","Having partners <mark>do some or all</mark> of your activities: <mark>subcontracting, dealerships, franchising</mark>."],
["i","What are the benefits and limits of outsourcing?","Benefits: partner's <mark>expertise</mark>, <mark>flexibility</mark>, refocusing. Limits: mutual <mark>dependency</mark> and loss of know-how."]],
qcm:[
["f","Patents and brands are part of:",["Intangible fixed capital","Circulating capital","Labour","Raw materials"],"Fixed capital also includes physical capital: buildings, machines, equipment."],
["f","Energy used during manufacturing is:",["Circulating capital","Fixed capital","Intangible capital","Knowledge"],"Circulating capital is used up or transformed in a single production cycle."],
["f","In the knowledge economy, businesses prioritise:",["Intangible investment (training, R&D)","Buying machines only","Cutting wages","Increasing stock"],"Knowledge has become a fundamental factor of production."],
["c","A grape-harvesting machine and pickers are factors that are:",["Substitutable","Complementary","Irreplaceable","Circulating"],"One can replace the other."],
["c","A photographer and their camera are factors that are:",["Complementary","Substitutable","Irreplaceable","Intangible"],"They must be used together."],
["c","Labour productivity is calculated as:",["Output / quantity of labour","Quantity of labour / output","Turnover / capital","Wages / output"],"Capital productivity compares output with the quantity of capital."],
["p","Lower interest rates tend to:",["Encourage investment","Discourage investment","Raise borrowing costs","Make savings more profitable"],"The interest rate is the cost of borrowing."],
["p","When hiring, a business considers:",["Pay, but also qualifications and fit with the job","Pay only","Age only","Degree only"],"Pay is not always the decisive factor."],
["i","According to Porter, which is a primary activity?",["Operations (production)","Human resources","Accounting","Technology development"],"Primary activities are inbound logistics, operations, sales and marketing."],
["i","Having a subcontractor make parts is:",["Outsourcing","Vertical integration","Circulating capital","Capital productivity"],"Outsourcing includes subcontracting, dealerships and franchising."],
["i","What is a risk of outsourcing?",["Dependency on partners and loss of know-how","More flexibility","Refocusing on the core business","Access to a partner's expertise"],"The other three answers are benefits of outsourcing."]]}

T1["t3-structure"]={
fr:{intro:"Les critères qui guident le choix entre entreprise individuelle et société, et les formes de l'économie sociale et solidaire.",

map:{root:{l:["La structure","juridique"],t:"Le choix d'une structure juridique",x:"La structure juridique est le cadre légal de l'activité. Son choix dépend du patrimoine, du pouvoir, du statut social, de la fiscalité, des moyens financiers, et évolue avec l'entreprise."},
cols:[
{c:"v",l:["Patrimoine"],t:"Patrimoine et pouvoir",x:"Entreprise individuelle ou société : un choix qui engage le patrimoine et la façon d'exercer le pouvoir.",leaves:[
{l:["Entr. individuelle"],t:"L'entreprise individuelle (EI)",x:"Pas de personnalité morale : elle se confond avec l'entrepreneur. Simple à créer et à gérer, adaptée aux petites activités."},
{l:["Société"],t:"La société",x:"Personne morale créée par un contrat, les statuts, avec un nom, un siège et un patrimoine propre (SA, SAS, SASU, SARL, EURL)."},
{l:["Patrimoine de l'EI"],t:"La protection de l'entrepreneur individuel",x:"Depuis 2022, son patrimoine personnel est par défaut insaisissable par ses créanciers professionnels : seuls les biens utiles à l'activité peuvent être saisis."},
{l:["Resp. limitée"],t:"La responsabilité limitée",x:"Dans les SA, SAS, SASU, SARL et EURL, les associés ne perdent au plus que leurs apports."},
{l:["Seul ou à plusieurs"],t:"Le pouvoir",x:"Seul : EI, EURL, SASU (pouvoir sans partage). À plusieurs : SARL, SAS, SA (pouvoir partagé). La SAS laisse une grande liberté aux statuts."},
{l:["Régime matrimonial"],t:"Les motivations matrimoniales",x:"Communauté réduite aux acquêts : les biens acquis pendant le mariage sont engagés. Séparation de biens (ou PACS) : plus adaptée aux affaires."}]},
