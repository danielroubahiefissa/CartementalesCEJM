<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réviser la CEJM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5;--paper:#FFFFFF;--ink:#1B2440;--muted:#5A6380;--line:#CDD3DF;
  --v:#5B4BC4;--v-soft:#E9E6FB;--t:#0F7A63;--t-soft:#DDF3EC;--a:#A8650E;--a-soft:#FBEFD9;--o:#B8472C;--o-soft:#FBE6DF;
  --n:#5A6380;--n-soft:#E4E7EE;--mark:#FFE066;--mark-ink:#1B2440;
  --ok:#0F7A63;--ok-soft:#DDF3EC;--ko:#B8472C;--ko-soft:#FBE6DF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121726;--paper:#1C2336;--ink:#E8ECF6;--muted:#A3ACC4;--line:#343D55;
  --v:#A99EF2;--v-soft:#2C2758;--t:#5DCAA5;--t-soft:#123D34;--a:#F2C267;--a-soft:#4A3510;--o:#F0997B;--o-soft:#4A2217;
  --n:#A3ACC4;--n-soft:#2A3148;--mark:#6B5A10;--mark-ink:#FFF3C2;
  --ok:#5DCAA5;--ok-soft:#123D34;--ko:#F0997B;--ko-soft:#4A2217;}}
:root[data-theme="dark"]{
  --bg:#121726;--paper:#1C2336;--ink:#E8ECF6;--muted:#A3ACC4;--line:#343D55;
  --v:#A99EF2;--v-soft:#2C2758;--t:#5DCAA5;--t-soft:#123D34;--a:#F2C267;--a-soft:#4A3510;--o:#F0997B;--o-soft:#4A2217;
  --n:#A3ACC4;--n-soft:#2A3148;--mark:#6B5A10;--mark-ink:#FFF3C2;
  --ok:#5DCAA5;--ok-soft:#123D34;--ko:#F0997B;--ko-soft:#4A2217;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:26px 18px 56px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif}
h1{font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0 0 8px;letter-spacing:-0.015em}
.lede{color:var(--muted);margin:0 0 24px;max-width:60ch}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:2px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--v);outline-offset:3px}
a{color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Accueil */
.years{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;margin-bottom:26px}
.years button{border:0;background:transparent;padding:7px 18px;border-radius:999px;cursor:pointer;font-size:15px}
.years button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.theme{margin-bottom:34px}
.theme-h{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.theme-n{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:44px;line-height:.9;color:var(--v)}
.theme-h h2{font-size:clamp(20px,3.4vw,25px);font-weight:700;margin:0;line-height:1.2}
.dom{margin-top:14px}
.dom-q{font-size:14px;color:var(--muted);margin:0 0 4px}
.dom-q b{color:var(--ink)}
.chap{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.chap .no{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;color:var(--muted);font-size:18px}
.chap .tt{line-height:1.3}
.chap.off .tt{color:var(--muted)}
.chap.on{background:var(--paper);border:1px solid var(--line);margin:4px 0}
.chap.on:hover{border-color:var(--ink)}
.chap.on .no{color:var(--v)}
.tools{display:flex;gap:5px;align-items:center;font-size:12.5px}
.tools span{border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--muted)}
.tools span.done{border-color:var(--t);color:var(--t);font-weight:700}
.soon{font-size:13px;color:var(--muted);font-style:italic}
@media (max-width:560px){.chap{grid-template-columns:34px 1fr}.chap .tools,.chap .soon{grid-column:2}}

/* Chapitre */
.back{display:inline-block;margin-bottom:16px;font-size:15px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink);text-decoration:underline}
.crumb{font-size:14px;color:var(--muted);margin:0 0 4px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{font-size:15px;border:1.5px solid var(--ink);background:transparent;padding:8px 18px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}

/* Carte mentale */
.mapbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--n-soft);font-weight:700}
.mapscroll{overflow-x:auto}
svg text{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;fill:var(--ink)}
.bub{cursor:pointer}
.bub rect,.bub circle{stroke-width:1}
.bub.v rect,.bub.v circle{fill:var(--v-soft);stroke:var(--v)}
.bub.t rect,.bub.t circle{fill:var(--t-soft);stroke:var(--t)}
.bub.a rect,.bub.a circle{fill:var(--a-soft);stroke:var(--a)}
.bub.o rect,.bub.o circle{fill:var(--o-soft);stroke:var(--o)}
.bub.n rect,.bub.n circle{fill:var(--n-soft);stroke:var(--n)}
.bub.sel rect,.bub.sel circle{stroke-width:2.8}
.bub:hover{opacity:.82}
.ln-v{stroke:var(--v)}.ln-t{stroke:var(--t)}.ln-a{stroke:var(--a)}.ln-o{stroke:var(--o)}.ln-n{stroke:var(--n)}
#det{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;min-height:88px}
#det b{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:19px;display:block;margin-bottom:2px}
.outline details{border-left:5px solid var(--c,var(--n));padding:2px 0 2px 14px;margin:10px 0}
.outline summary{cursor:pointer;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;padding:4px 0}
.outline .gtitle{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:21px;margin:18px 0 0}
.outline .intro{color:var(--muted);margin:0 0 6px;font-size:15px}
.outline dl{margin:4px 0 8px}
.outline dt{font-weight:700;margin-top:8px}
.outline dd{margin:0}

/* Flashcards */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;border:1px solid var(--line);background:var(--paper);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.count{font-size:14px;color:var(--muted)}
.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:320px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.card.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--c,var(--n));border-radius:0 14px 14px 0;padding:24px 28px 22px;display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .part{font-size:14px;font-weight:700;color:var(--c,var(--n));margin-bottom:18px}
.fq{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;font-weight:500;font-size:clamp(21px,3.4vw,27px);line-height:1.25;margin:auto 0;max-width:34ch}
.fa{color:var(--ink);font-size:clamp(17px,2.4vw,19px);margin:auto 0;max-width:60ch}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.btn{font-size:15px;border:1.5px solid var(--line);background:var(--paper);padding:9px 16px;border-radius:10px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.know{border-color:var(--t);color:var(--t)}.btn.again{border-color:var(--v);color:var(--v)}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.score{text-align:center;margin-top:12px;font-size:14px;color:var(--muted)}
.done{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
.done h2{margin:0 0 8px}

/* QCM */
.top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-bottom:8px}
.prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:18px}
.prog div{height:100%;background:var(--v);width:0;transition:width .3s}
.qcard{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--c,var(--n));border-radius:0 14px 14px 0;padding:20px 22px}
.qcard .part{font-size:14px;font-weight:700;color:var(--c,var(--n));margin-bottom:6px}
.qcard h2{font-weight:500;font-size:clamp(19px,3vw,23px);line-height:1.3;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ko{background:var(--ko-soft);border-color:var(--ko)}
.fb{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--bg)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)}.fb.ko b{color:var(--ko)}
.res{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px}
.res h2{margin:0}
.big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:56px;line-height:1;margin:6px 0}
.miss{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.miss>div{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.miss>div:last-child{border-bottom:0}
.miss .rq{font-weight:700}.miss .ra{color:var(--ok)}
/* Accueil : choix du BTS */
.welcome{padding-top:6vh}
.ask{font-size:clamp(22px,4vw,28px);margin:10px 0 14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.choice{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-left:8px solid var(--v);border-radius:0 14px 14px 0;padding:14px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.choice.cur{border-color:var(--ink)}
.choice:hover{border-color:var(--ink)}
.choice b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px}
.choice span{color:var(--muted);font-size:15px;line-height:1.45}
.small{font-size:14px;color:var(--muted);margin-top:14px}
.parcours{margin:-10px 0 20px;font-size:15px;color:var(--muted)}
.parcours b{color:var(--ink)}
.link{border:0;background:none;padding:0 0 0 6px;text-decoration:underline;cursor:pointer;color:var(--v);font-size:15px}

.topbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.ex{color:var(--ink);margin-top:10px;padding:8px 12px;border-left:4px solid var(--c,var(--v));background:var(--bg);border-radius:0 8px 8px 0;font-size:15px}
.ex b{display:block;font-size:13px;color:var(--c,var(--v));margin-bottom:2px}
.bub circle.exdot,.bub.v circle.exdot,.bub.t circle.exdot,.bub.a circle.exdot,.bub.o circle.exdot,.bub.n circle.exdot{fill:var(--mark);stroke:var(--ink);stroke-width:1}
#det .ex b{font-family:inherit;font-size:13px;font-weight:700;margin-bottom:2px}
.legend{font-size:13px;color:var(--muted);margin:8px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mark);border:1px solid var(--ink);margin-right:6px;vertical-align:-1px}
.note{background:var(--a-soft);border-left:4px solid var(--a);padding:8px 12px;border-radius:0 8px 8px 0;font-size:15px;margin:-10px 0 18px}
footer{margin-top:34px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* [repère carte "colonne.feuille", n° de flashcard (-1 si aucune), français, anglais] */
const EXS={
"t1-agents":{
SIO:[["1.2",5,"Une ESN qui équipe ses développeurs achète des ordinateurs et des serveurs : ce sont des immobilisations. L'hébergement cloud et les licences sont des services.","An IT services firm equipping its developers buys laptops and servers: these are fixed assets. Cloud hosting and licences are services."],
["0.3",-1,"Un éditeur d'application mobile suit le comportement de ses utilisateurs pour personnaliser l'expérience : sinon, ils passent vite à une appli concurrente.","A mobile app publisher tracks user behaviour to personalise the experience: otherwise users quickly switch to a rival app."],
["2.1",8,"Une start-up qui édite un logiciel SaaS emprunte à sa banque pour financer ses serveurs : c'est un financement indirect.","A SaaS start-up borrows from its bank to pay for servers: this is indirect financing."],
["3.2",14,"Bpifrance soutient les jeunes entreprises du numérique, par exemple avec la Bourse French Tech.","Bpifrance supports young tech companies, for example through the French Tech grant."]],
GPME:[["0.1",1,"Une PME de menuiserie recrute un assistant de gestion : elle intervient sur le marché du travail et lui verse un salaire.","A small joinery business hires a management assistant: it operates on the labour market and pays a wage."],
["2.1",8,"Pour acheter un nouveau camion, une PME du bâtiment négocie un prêt avec sa banque : financement indirect.","To buy a new truck, a small building firm negotiates a bank loan: indirect financing."],
["3.3",15,"L'assistant(e) de gestion prépare les déclarations de TVA et le paiement des cotisations sociales à l'Urssaf.","The management assistant prepares VAT returns and social contribution payments to Urssaf."],
["3.1",14,"Une PME qui embauche un apprenti peut bénéficier d'une aide de l'État à l'embauche en apprentissage.","A small business hiring an apprentice can receive State aid for apprenticeship hiring."]],
MCO:[["0.0",2,"Au supermarché, le client repart avec ses courses (flux réel) et paie en caisse (flux monétaire) : ce paiement forme le chiffre d'affaires du magasin.","At the supermarket, the customer leaves with the shopping (real flow) and pays at the till (monetary flow): this payment makes up the store's turnover."],
["0.2",3,"Quand les prix augmentent, les clients réduisent leurs achats non essentiels : le manager adapte ses promotions et son assortiment.","When prices rise, customers cut non-essential purchases: the store manager adjusts promotions and product range."],
["1.0",5,"Un magasin de sport achète ses chaussures aux marques (fournisseur de biens) et fait appel à une société de nettoyage (fournisseur de services).","A sports shop buys shoes from brands (goods supplier) and uses a cleaning company (service supplier)."],
["2.0",7,"La banque du magasin gère les paiements par carte sur les terminaux de paiement : elle sécurise les transactions.","The store's bank handles card payments on the payment terminals: it secures transactions."]],
Communication:[["1.1",5,"Une agence de communication achète des services à des imprimeurs, des photographes et des régies publicitaires.","A communication agency buys services from printers, photographers and advertising sales houses."],
["0.3",-1,"Les consommateurs passent d'un réseau social à l'autre : une marque doit sans cesse adapter ses messages et ses canaux.","Consumers move from one social network to another: a brand must keep adapting its messages and channels."],
["3.0",13,"Les campagnes de prévention de Santé publique France sont financées par l'argent public : elles relèvent des services non marchands.","Public health prevention campaigns are funded by public money: they are non-market services."],
["1.3",6,"Une marque et un créateur de contenu qui conçoivent une collection commune proposent une offre différenciée.","A brand and a content creator designing a joint collection offer something different."]],
NDRC:[["0.3",-1,"Les prospects comparent les offres en ligne avant de répondre : le commercial personnalise son argumentaire.","Prospects compare offers online before replying: the salesperson personalises the pitch."],
["1",4,"Le commercial d'un grossiste en matériel électrique vend à des installateurs : les échanges entre entreprises (B2B) sont son quotidien.","A salesperson at an electrical wholesaler sells to installers: business-to-business trade is their daily work."],
["0.2",3,"Un vendeur automobile voit les clients reporter leur achat quand la conjoncture se dégrade : il met en avant les solutions de financement.","A car salesperson sees customers postpone purchases when the economy worsens: they highlight financing options."],
["2.0",7,"Le conseiller clientèle d'une banque, un métier accessible après un BTS NDRC, collecte l'épargne et propose des crédits.","A bank customer adviser, a job open to NDRC graduates, collects savings and offers loans."]],
SAM:[["3.3",15,"L'office manager suit le calendrier des échéances fiscales et sociales pour que les déclarations partent à temps.","The office manager tracks tax and social deadlines so that returns are filed on time."],
["3.1",14,"L'assistant(e) de direction monte le dossier de demande de subvention régionale pour un projet d'innovation.","The executive assistant prepares the application for a regional innovation grant."],
["1.3",6,"L'assistant(e) choisit et suit les prestataires (maintenance, traiteur, fournitures) : une bonne relation fait gagner du temps et de l'argent.","The assistant selects and manages suppliers (maintenance, catering, office supplies): a good relationship saves time and money."],
["0.1",1,"L'assistant(e) RH publie les offres d'emploi et organise les entretiens : l'entreprise intervient sur le marché du travail.","The HR assistant posts job ads and organises interviews: the business operates on the labour market."]]},

"t1-marches":{
SIO:[["3.1",11,"Un éditeur de logiciels s'associe à un hébergeur cloud pour proposer une offre clé en main : partenariat entre entreprises non concurrentes.","A software publisher teams up with a cloud host to offer a turnkey solution: a partnership between non-competitors."],
["2.3",10,"Android et iOS équipent presque tous les smartphones : un exemple de concurrence oligopolistique.","Android and iOS run almost all smartphones: an example of oligopolistic competition."],
["2.0",7,"L'acheteur d'un ordinateur reconditionné ignore l'état réel de la batterie : garanties et labels des reconditionneurs réduisent l'asymétrie.","The buyer of a refurbished laptop does not know the battery's real condition: refurbishers' warranties and labels reduce the asymmetry."],
["4.1",13,"Les data centers consomment beaucoup d'électricité : une externalité négative que les hébergeurs cherchent à réduire.","Data centres use a lot of electricity: a negative externality that hosting firms try to reduce."]],
GPME:[["1.1",5,"Une boulangerie fixe le prix de sa baguette selon ses coûts (farine, énergie) et les prix des boulangeries voisines.","A bakery sets the price of its baguette based on its costs (flour, energy) and nearby bakeries' prices."],
["3.1",11,"Un plombier, un électricien et un peintre se regroupent pour répondre ensemble à des chantiers : partenariat.","A plumber, an electrician and a painter join forces to bid for building jobs together: a partnership."],
["0.1",1,"Un restaurant de quartier intervient sur un marché local ; une PME de cosmétiques qui exporte, sur un marché mondial.","A neighbourhood restaurant operates on a local market; a cosmetics SME that exports operates on a global one."],
["4.3",14,"Une PME de transport achète des camions moins polluants : elle réduit ses externalités négatives dans une démarche RSE.","A small haulage firm buys cleaner trucks: it reduces its negative externalities as part of a CSR approach."]],
MCO:[["1.0",3,"L'arrivée d'un magasin discount près d'un supermarché pousse celui-ci à revoir ses prix et ses promotions.","A discount store opening near a supermarket pushes it to review its prices and promotions."],
["1.3",6,"Avis clients, labels (bio, commerce équitable) et « satisfait ou remboursé » renforcent la confiance en magasin.","Customer reviews, labels (organic, fair trade) and money-back guarantees build trust in store."],
["1.1",4,"Quand un produit tendance manque, son prix monte ; quand les stocks sont trop élevés, le magasin fait des soldes.","When a trendy product is scarce its price rises; when stock is too high, the store holds a sale."],
["2.3",10,"La grande distribution alimentaire française est dominée par quelques enseignes : un marché oligopolistique.","French grocery retail is dominated by a handful of chains: an oligopolistic market."]],
Communication:[["1.2",6,"Comparateurs et avis en ligne informent les consommateurs : une agence doit en tenir compte dans ses messages.","Comparison sites and online reviews inform consumers: an agency must take them into account in its messages."],
["3.1",11,"Une agence et un studio de production vidéo répondent ensemble à un appel d'offres : partenariat.","An agency and a video production studio bid for a contract together: a partnership."],
["4.0",13,"Une campagne de sensibilisation au tri des déchets profite à toute la société : externalité positive.","A recycling awareness campaign benefits society as a whole: a positive externality."],
["2.0",7,"L'annonceur ne sait pas exactement combien de personnes ont vu sa publicité : la mesure d'audience réduit l'asymétrie d'information.","The advertiser does not know exactly how many people saw its ad: audience measurement reduces the information gap."]],
NDRC:[["2.0",7,"En négociation, le commercial connaît mieux son produit que le client : fiche technique et démonstration rétablissent l'équilibre.","In negotiation, the salesperson knows the product better than the customer: a spec sheet and a demo restore the balance."],

["m","Sur quels deux marchés l'entreprise rencontre-t-elle les ménages ?","Le <mark>marché des biens et services</mark> (les ménages sont clients) et le <mark>marché du travail</mark> (ils sont salariés)."],
["m","Quels flux s'établissent sur le marché des biens et services ?","Un <mark>flux réel</mark> (biens et services vers les ménages) et un <mark>flux monétaire</mark> en sens inverse (paiements qui forment le chiffre d'affaires)."],
["m","Qu'est-ce qui oriente l'arbitrage des ménages entre consommation et épargne ?","L'utilité des biens, leur budget et leur <mark>moral</mark> : croissance et emploi poussent à consommer, une <mark>conjoncture défavorable</mark> pousse à épargner."],
["e","Pourquoi les entreprises échangent-elles entre elles ?","Pour produire, une entreprise doit <mark>acheter à d'autres entreprises</mark> : ses fournisseurs. Des flux réels et monétaires circulent donc aussi entre entreprises."],
["e","Quels sont les trois types de fournisseurs ?","Fournisseurs de <mark>biens</mark> (matières premières), de <mark>services</mark> (transport, publicité) et d'<mark>immobilisations</mark> (biens de production durables : outils, mobilier)."],
["e","Pourquoi soigner la collaboration avec ses fournisseurs et partenaires ?","C'est un <mark>facteur de performance</mark> : elle crée de la valeur et permet de proposer des <mark>offres différenciées</mark>."],
["b","Quelle est l'activité principale des banques ?","<mark>Collecter l'épargne et accorder des crédits</mark> : elles sont intermédiaires entre les agents. Elles gèrent aussi les moyens de paiement et sécurisent les transactions."],
["b","Quelle différence entre financement indirect et direct ?","Indirect : par le <mark>crédit bancaire</mark>. Direct : sur le <mark>marché financier</mark>, où l'entreprise émet des titres achetés par les épargnants."],
["b","Que sont les ABF et les ACF ?","Les agents à <mark>besoin</mark> de financement (ABF) émettent des actions ou obligations ; les agents à <mark>capacité</mark> de financement (ACF) les achètent avec leur épargne."],
["b","Actions ou obligations : quelle différence ?","L'action est un <mark>titre de propriété</mark> d'une entreprise cotée. L'obligation est un titre d'<mark>emprunt</mark> à moyen ou long terme."],
["b","Marché primaire et marché secondaire ?","Primaire : <mark>émission de titres nouveaux</mark>. Secondaire : <mark>échange des titres existants</mark>, c'est la Bourse ou « marché de l'occasion »."],
["b","Comment les banques ont-elles réagi au développement des marchés financiers ?","Elles sont devenues des <mark>intermédiaires privilégiés</mark> : conseil, montage des dossiers, choix des titres, puis levée des fonds auprès des investisseurs."],
["s","Quelle est la fonction de l'État et comment est-elle financée ?","Produire des <mark>services non marchands</mark> d'intérêt général (éducation, sécurité, infrastructures), financés par les <mark>impôts, taxes et cotisations sociales</mark>."],
["s","Comment l'État soutient-il les entreprises ?","Par des <mark>aides financières et subventions</mark> (création, innovation, aides de crise comme le PGE) et par <mark>Bpifrance</mark>, banque publique d'investissement créée en 2013."],
["s","Quelles obligations l'entreprise a-t-elle envers l'État ?","Payer des <mark>impôts et taxes</mark> selon différents critères : l'impôt sur les sociétés selon le résultat, les cotisations sociales selon le nombre de salariés…"]],
qcm:[
["m","Quelle est la principale fonction économique d'un ménage ?",["La consommation","La production de biens","La collecte de l'épargne","La production de services non marchands"],"Le ménage consomme ; il participe aussi à la production en fournissant son travail."],
["m","Sur le marché du travail, quel est le flux monétaire ?",["Les salaires versés aux ménages","La quantité de travail fournie","Les biens achetés par les ménages","Les impôts payés à l'État"],"Le travail fourni est le flux réel ; les salaires sont le flux monétaire en sens inverse."],
["m","Une conjoncture économique défavorable incite plutôt les ménages à :",["Épargner","Consommer davantage","Emprunter pour consommer","Changer de fournisseur"],"À l'inverse, croissance et emploi poussent à la consommation : l'entreprise doit suivre le moral des ménages."],
["e","Une entreprise qui achète des machines s'adresse à un fournisseur :",["D'immobilisations","De services","De matières premières","De crédits"],"Les immobilisations sont des biens de production durables : machines, outils, mobilier."],
["e","Pourquoi une bonne collaboration avec les partenaires est-elle importante ?",["Elle crée de la valeur et permet des offres différenciées","Elle supprime toute concurrence","Elle dispense de payer les fournisseurs","Elle est imposée par l'État"],"Exemple du cours : la plateforme Daleko et ses partenaires locaux proposent des voyages innovants."],
["b","Quelle est l'activité principale des banques ?",["Collecter l'épargne et accorder des crédits","Produire des services non marchands","Fixer les impôts","Émettre des actions pour leurs clients uniquement"],"Elles sont intermédiaires entre agents et gèrent aussi les moyens de paiement."],
["b","Quand une banque prête à une entreprise pour investir, on parle de financement :",["Indirect","Direct","Non marchand","Public"],"Le financement direct passe par le marché financier, sans intermédiaire de crédit."],
["b","Sur le marché financier, qui émet les titres ?",["Les agents à besoin de financement (ABF)","Les agents à capacité de financement (ACF)","L'État uniquement","Les ménages salariés"],"Les ACF achètent ces titres avec leur épargne."],
["b","Sur quel marché s'échangent les titres déjà émis ?",["Le marché secondaire","Le marché primaire","Le marché du travail","Le marché des biens et services"],"Le marché secondaire, ou Bourse, est le « marché de l'occasion » des titres."],
["b","Une obligation est :",["Un titre d'emprunt à moyen ou long terme","Un titre de propriété de l'entreprise","Une subvention publique","Un crédit bancaire à court terme"],"L'action, elle, est un titre de propriété."],
["s","Qu'est-ce qu'un service non marchand ?",["Un service d'intérêt général fourni par l'État, financé par les prélèvements","Un service vendu avec une marge","Un service rendu entre entreprises","Un produit vendu en ligne"],"Exemples : éducation, sécurité, infrastructures."],
["s","Qu'est-ce que Bpifrance ?",["Une banque publique d'investissement créée en 2013","Une banque centrale européenne","Un impôt sur les sociétés","Une place de marché en ligne"],"Elle finance la création, l'innovation et le développement des entreprises françaises."]]},

en:{intro:"Households, other businesses, banks and the State: who the business trades with, and how.",
cats:{m:["Households","v"],e:["Businesses","t"],b:["Banks and financial markets","a"],s:["The State","o"]},
map:{root:{l:["The business","and its partners"],t:"Economic agents in relation with the business",x:"A business trades with four main economic agents. Every exchange combines a real flow and a monetary flow going the opposite way."},
cols:[
{c:"v",l:["Households"],t:"Households",x:"People living in the same main residence, related or not. Their main function is to consume; they also supply their labour.",leaves:[
{l:["Goods & services"],t:"Goods and services market",x:"Real flow: the business supplies goods and services. Monetary flow: households pay for them, which makes up the business's turnover."},
{l:["Labour market"],t:"Labour market",x:"Households supply labour (real flow) in exchange for wages (monetary flow)."},
{l:["Spend or save"],t:"The spending-saving trade-off",x:"It depends on how useful goods are, the budget and household confidence: good economic conditions encourage spending, bad ones encourage saving."},
{l:["Changing customers"],t:"Changing customers",x:"With new technologies, consumers are more mobile and less loyal: businesses must anticipate and personalise the relationship."}]},
{c:"t",l:["Businesses"],t:"Other businesses",x:"A business's main function is to produce. To do so, it buys from other businesses: its suppliers.",leaves:[
{l:["Goods suppliers"],t:"Suppliers of goods",x:"Raw materials, intermediate products…"},
{l:["Service suppliers"],t:"Suppliers of services",x:"Transport, maintenance, advertising…"},
{l:["Fixed assets"],t:"Suppliers of fixed assets",x:"Long-lasting production goods: furniture, tools, machines."},
{l:["Cooperation"],t:"Value-creating cooperation",x:"Working well with suppliers and partners creates value and allows differentiated offers (e.g. the travel platform Daleko and its local partners)."}]},
{c:"a",l:["Financing"],t:"Banks and financial markets",x:"Two ways to finance a business: indirectly through banks, directly through the financial market.",leaves:[
{l:["Role of banks"],t:"The role of banks",x:"Collecting savings and granting loans: they are intermediaries. They also manage means of payment and secure transactions."},
{l:["Indirect financing"],t:"Indirect financing",x:"Bank loans finance a large share of business investment."},
{l:["Direct financing"],t:"Direct financing",x:"On the financial market, agents needing finance issue shares or bonds, bought by agents with surplus savings."},
{l:["Primary / secondary"],t:"Primary and secondary markets",x:"Primary: new securities are issued. Secondary (the stock exchange): existing securities are traded, the 'second-hand market'."},
{l:["New role"],t:"Banks reinvented",x:"Markets have not sidelined banks: they advise, prepare deals, choose securities and raise funds from investors."}]},
{c:"o",l:["The State"],t:"The State",x:"It provides non-market services in the general interest, funded by taxes and social contributions.",leaves:[
{l:["Non-market"],t:"Non-market services",x:"Education, training, security, transport, infrastructure: they meet collective or individual needs of general interest."},
{l:["Aid & subsidies"],t:"Aid and subsidies",x:"Aid for starting or taking over a business, subsidies for research and innovation, crisis support (State-guaranteed loans, deferred contributions during Covid-19)."},
{l:["Bpifrance"],t:"Bpifrance",x:"French public investment bank created in 2013: it finances start-ups, innovation, international growth and takeovers."},
{l:["Taxes"],t:"The business's obligations",x:"Businesses help fund the State: corporate tax based on profit, social contributions based on employees…"}]}],
footer:{caption:"In every exchange",join:"+",items:[
{l:["Real flow"],t:"Real flow",x:"What circulates: goods, services, labour."},
{l:["Monetary flow"],t:"Monetary flow",x:"Payment going the other way: prices, wages, taxes."}]}},
cards:[
["m","What is a household?","All the people living in the <mark>same main residence</mark>, even if unrelated. Its main function is <mark>consumption</mark>."],
["m","On which two markets does the business meet households?","The <mark>goods and services market</mark> (households are customers) and the <mark>labour market</mark> (they are employees)."],
["m","Which flows exist on the goods and services market?","A <mark>real flow</mark> (goods and services to households) and a <mark>monetary flow</mark> the other way (payments that form turnover)."],
["m","What drives the household choice between spending and saving?","Usefulness of goods, budget and <mark>confidence</mark>: growth and jobs encourage spending, <mark>poor economic conditions</mark> encourage saving."],
["e","Why do businesses trade with each other?","To produce, a business must <mark>buy from other businesses</mark>: its suppliers. Real and monetary flows also run between businesses."],
["e","What are the three types of suppliers?","Suppliers of <mark>goods</mark> (raw materials), of <mark>services</mark> (transport, advertising) and of <mark>fixed assets</mark> (tools, furniture)."],
["e","Why take care of cooperation with suppliers and partners?","It is a <mark>source of performance</mark>: it creates value and allows <mark>differentiated offers</mark>."],
["b","What is the main activity of banks?","<mark>Collecting savings and granting loans</mark>: they are intermediaries. They also manage means of payment and secure transactions."],
["b","Indirect versus direct financing?","Indirect: through <mark>bank loans</mark>. Direct: on the <mark>financial market</mark>, where the business issues securities bought by savers."],
["b","Who issues and who buys securities on the financial market?","Agents <mark>needing finance</mark> issue shares or bonds; agents with <mark>surplus savings</mark> buy them."],
["b","Shares or bonds: what is the difference?","A share is an <mark>ownership stake</mark> in a listed company. A bond is a medium or long-term <mark>loan</mark> security."],
["b","Primary versus secondary market?","Primary: <mark>new securities are issued</mark>. Secondary: <mark>existing securities are traded</mark> — the stock exchange, or 'second-hand market'."],
["b","How did banks respond to the growth of financial markets?","They became <mark>key intermediaries</mark>: advice, preparing deals, choosing securities, then raising funds from investors."],
["s","What is the State's function and how is it funded?","Providing <mark>non-market services</mark> of general interest (education, security, infrastructure), funded by <mark>taxes and social contributions</mark>."],
["s","How does the State support businesses?","Through <mark>financial aid and subsidies</mark> (start-up, innovation, crisis support such as State-guaranteed loans) and through <mark>Bpifrance</mark>, a public investment bank created in 2013."],
["s","What obligations does a business have towards the State?","Paying <mark>taxes and contributions</mark> based on various criteria: corporate tax on profit, social contributions on employees…"]],
qcm:[
["m","What is the main economic function of a household?",["Consumption","Producing goods","Collecting savings","Providing non-market services"],"Households consume; they also contribute to production by supplying labour."],
["m","On the labour market, what is the monetary flow?",["Wages paid to households","The amount of labour supplied","Goods bought by households","Taxes paid to the State"],"Labour supplied is the real flow; wages are the monetary flow going the other way."],
["m","Poor economic conditions tend to make households:",["Save","Spend more","Borrow to spend","Change suppliers"],"Conversely, growth and jobs encourage spending: businesses must watch household confidence."],
["e","A business buying machines turns to a supplier of:",["Fixed assets","Services","Raw materials","Loans"],"Fixed assets are long-lasting production goods: machines, tools, furniture."],
["e","Why is good cooperation with partners important?",["It creates value and allows differentiated offers","It removes all competition","It means suppliers need not be paid","It is required by the State"],"Course example: Daleko and its local partners offer innovative trips."],
["b","What is the main activity of banks?",["Collecting savings and granting loans","Providing non-market services","Setting taxes","Issuing shares for their own customers only"],"They are intermediaries between agents and also manage means of payment."],
["b","When a bank lends to a business so it can invest, this is:",["Indirect financing","Direct financing","Non-market financing","Public financing"],"Direct financing goes through the financial market, without a lender in between."],
["b","On the financial market, who issues securities?",["Agents needing finance","Agents with surplus savings","Only the State","Salaried households"],"Agents with surplus savings buy these securities."],
["b","On which market are existing securities traded?",["The secondary market","The primary market","The labour market","The goods and services market"],"The secondary market, or stock exchange, is the 'second-hand market' for securities."],
["b","A bond is:",["A medium or long-term loan security","An ownership stake in the business","A public subsidy","A short-term bank loan"],"A share, by contrast, is an ownership stake."],
["s","What is a non-market service?",["A general-interest service provided by the State, funded by taxes","A service sold at a profit","A service between businesses","A product sold online"],"Examples: education, security, infrastructure."],
["s","What is Bpifrance?",["A French public investment bank created in 2013","The European Central Bank","A corporate tax","An online marketplace"],"It finances the creation, innovation and growth of French businesses."]]}

fr:{intro:"Ce qu'est un marché, les règles qui le font fonctionner, ses défaillances, la coopération et les externalités.",

map:{root:{l:["Le","marché"],t:"Le fonctionnement des marchés",x:"Le marché est le lieu de rencontre entre l'offre des vendeurs et la demande des acheteurs, en vue d'un échange."},
cols:[
{c:"v",l:["Caractéristiques"],t:"Caractéristiques du marché",x:"Un marché se définit par l'objet de l'échange et par son étendue.",leaves:[

{l:["Objet et étendue"],t:"Objet et étendue",x:"Objet : biens, services… Étendue : locale, nationale, mondiale."},

{l:["Silver économie"],t:"Exemple : la Silver économie",x:"Marché des seniors (services à la personne, loisirs, domotique…). Le vieillissement fait fortement croître la demande, ce qui attire de nouvelles offres (ex. : Adenior)."}]},
{c:"t",l:["Règles"],t:"Les règles de fonctionnement",x:"Pour bien fonctionner, un marché a besoin de concurrence, d'information et de confiance.",leaves:[

{l:["Ajustement par prix"],t:"L'ajustement par les prix",x:"Demande > offre : le prix monte, la demande baisse et l'offre augmente. Demande < offre : le prix baisse, jusqu'à l'équilibre."},
{l:["Information"],t:"L'accès à l'information",x:"Il réduit l'incertitude sur les prix et les produits et permet au consommateur de bien choisir."},

{l:["Voitures d'occasion"],t:"L'exemple des voitures d'occasion",x:"Des plateformes comme Carizy évaluent le véhicule et sécurisent le paiement : elles réduisent l'asymétrie et rassurent acheteur et vendeur."},
{l:["Barrières à l'entrée"],t:"Les barrières à l'entrée",x:"Obstacles au libre accès d'un marché (coûts fixes élevés, réglementation, acteurs en place) : elles limitent la concurrence."},
{l:["Concurrence réelle"],t:"Une concurrence imparfaite",x:"En réalité, les marchés sont en concurrence oligopolistique (peu de vendeurs) ou monopolistique (chaque produit spécifique crée un petit monopole)."}]},
{c:"o",l:["Coopération"],t:"La coopération entre entreprises",x:"Croissance conjointe : coopérer avec d'autres entreprises tout en restant juridiquement indépendante.",leaves:[

cards:[
["c","Qu'est-ce qu'un marché ?","Le lieu de rencontre entre la <mark>demande des acheteurs</mark> et l'<mark>offre des vendeurs</mark>, en vue de réaliser un échange."],
["c","Quelles caractéristiques permettent de définir un marché ?","L'<mark>objet de l'échange</mark> (biens, services…) et l'<mark>étendue du marché</mark> (local, national, mondial)."],
["c","Sur quels marchés l'entreprise intervient-elle ?","Le marché des <mark>biens et services</mark>, du <mark>travail</mark> et des <mark>capitaux</mark> : pour vendre, s'approvisionner, recruter et se financer."],
["r","Pourquoi la concurrence rend-elle le marché efficace ?","Elle <mark>adapte l'offre à la demande</mark>, remet en cause les positions acquises et pousse les entreprises à être plus dynamiques et <mark>innovantes</mark>."],
["r","Que se passe-t-il si la demande dépasse l'offre ?","Le <mark>prix augmente</mark> : la demande diminue et l'offre augmente, jusqu'à l'<mark>équilibre</mark>."],
["r","Comment une entreprise fixe-t-elle son prix sur un marché concurrentiel ?","À partir de ses <mark>coûts de production</mark> et de la <mark>confrontation entre l'offre et la demande</mark>."],
["r","Pourquoi l'information et la confiance sont-elles des règles du marché ?","L'information <mark>réduit l'incertitude</mark> et permet de bien choisir ; la confiance <mark>rassure</mark> les acteurs, souvent grâce à des garanties (normes, labels)."],
["d","Qu'est-ce que l'asymétrie d'information ?","Un <mark>accès inégal à l'information</mark> entre acteurs d'un marché (vendeur/acheteur, employeur/candidat…) : un manque de transparence qui nuit à son efficacité."],
["d","Comment réduire l'asymétrie d'information sur le marché de l'occasion ?","Des plateformes comme Carizy <mark>évaluent le véhicule</mark> et <mark>sécurisent le paiement</mark> : l'information est rééquilibrée."],
["d","Qu'est-ce qu'une barrière à l'entrée ?","Un <mark>obstacle au libre accès</mark> d'un marché (coûts fixes importants, réglementation, acteurs en place) qui limite la concurrence."],
["d","Concurrence oligopolistique et monopolistique ?","Oligopolistique : <mark>peu de vendeurs</mark>. Monopolistique : chaque producteur a un <mark>petit monopole</mark> grâce aux spécificités de son produit."],
["x","Alliance ou partenariat ?","Deux formes de coopération entre entreprises juridiquement indépendantes : l'alliance entre <mark>concurrents</mark>, le partenariat entre <mark>non-concurrents</mark>."],
["x","Quel est l'intérêt de coopérer sur un marché concurrentiel ?","Créer des <mark>synergies</mark>, profiter du savoir-faire d'un autre, créer un nouveau marché ; cela stimule l'<mark>innovation</mark> et améliore l'offre."],
["x","Qu'est-ce qu'une externalité ?","L'impact <mark>positif ou négatif</mark> d'une activité sur d'autres agents <mark>sans paiement</mark> ni transaction. Ex. : recherche médicale (+), pollution (−)."],
["x","Pourquoi une externalité est-elle une défaillance du marché ?","Parce que le <mark>prix ne reflète pas</mark> l'ensemble des coûts et bénéfices engendrés. Les démarches <mark>RSE</mark> permettent aux entreprises d'y répondre."]],
qcm:[
["c","Un marché est :",["Le lieu de rencontre entre offre et demande en vue d'un échange","Un magasin physique uniquement","Un contrat entre deux entreprises","Un organisme public de régulation"],"Il peut être local, national ou mondial, physique ou virtuel."],
["c","Pourquoi la Silver économie attire-t-elle les entreprises ?",["La demande augmente fortement avec le vieillissement de la population","Les prix y sont fixés par l'État","Il n'y a aucun concurrent","La demande y diminue"],"Les nouveaux retraités ont un pouvoir d'achat important et recherchent des services de qualité."],
["r","Si l'offre dépasse la demande :",["Les prix baissent jusqu'à l'équilibre","Les prix augmentent","La demande diminue","Le marché disparaît"],"La baisse des prix attire des demandeurs et décourage l'offre."],
["r","Quel est l'effet de la concurrence sur l'offre ?",["Elle la rend plus dynamique et innovante","Elle la rend identique pour tous","Elle la supprime","Elle la rend plus chère"],"Les entreprises veulent maintenir leur part de marché face aux concurrents."],
["r","Une norme comme NF Services aux personnes renforce surtout :",["La confiance entre clients et entreprise","Les barrières à l'entrée","L'asymétrie d'information","Les externalités négatives"],"Les garanties qui accompagnent la vente rassurent les acteurs."],
["d","Un assureur connaît mal les risques réels de son assuré. C'est :",["Une asymétrie d'information","Une barrière à l'entrée","Une externalité positive","Un partenariat"],"L'information est inégalement répartie entre les deux parties."],
["d","Des coûts fixes très élevés pour entrer sur un marché constituent :",["Une barrière à l'entrée","Une externalité","Une alliance","Un flux monétaire"],"Ils découragent les entrants potentiels et limitent la concurrence."],
["d","Un marché dominé par un petit nombre de vendeurs est en concurrence :",["Oligopolistique","Monopolistique","Parfaite","Coopérative"],"En concurrence monopolistique, chaque produit spécifique donne un petit monopole à son producteur."],
["x","Deux entreprises concurrentes coopèrent sur un projet tout en restant indépendantes : c'est :",["Une alliance","Un partenariat","Une fusion","Une externalité"],"Le partenariat concerne des entreprises non concurrentes."],
["x","Les embouteillages automobiles sont un exemple :",["D'externalité négative","D'externalité positive","De barrière à l'entrée","D'asymétrie d'information"],"L'activité impose un coût à d'autres agents sans aucune compensation."],
["x","Pourquoi une externalité est-elle une défaillance du marché ?",["Le prix ne reflète pas tous les coûts et bénéfices","Elle augmente la concurrence","Elle supprime la demande","Elle est interdite par la loi"],"Les démarches RSE permettent aux entreprises de traiter leurs externalités négatives."],
["x","Quel est l'intérêt principal des relations de coopération ?",["Créer des synergies et stimuler l'innovation","Éliminer tous les concurrents","Fixer les prix ensemble","Éviter les impôts"],"Elles améliorent l'offre proposée aux consommateurs."]]},

en:{intro:"What a market is, the rules that make it work, its failures, cooperation and externalities.",
cats:{c:["The market","v"],r:["Market rules","t"],d:["Market failures","a"],x:["Cooperation and externalities","o"]},
map:{root:{l:["The","market"],t:"How markets work",x:"A market is where sellers' supply meets buyers' demand in order to make an exchange."},
cols:[
{c:"v",l:["Features"],t:"Features of a market",x:"A market is defined by what is exchanged and by its scope.",leaves:[
{l:["Supply & demand"],t:"Supply and demand",x:"A market brings together buyers' demand and sellers' supply to make an exchange."},
{l:["Object & scope"],t:"Object and scope",x:"Object: goods, services… Scope: local, national, global."},
{l:["Three markets"],t:"The three main markets",x:"Goods and services, labour, capital: the business uses them to sell, buy supplies, recruit and raise funds."},
{l:["Silver economy"],t:"Example: the silver economy",x:"Market for older people (home care, leisure, home automation…). Ageing is driving demand up sharply, attracting new offers (e.g. Adenior)."}]},
{c:"t",l:["Rules"],t:"Market rules",x:"To work well, a market needs competition, information and trust.",leaves:[
{l:["Competition"],t:"Competition",x:"It matches supply to demand, challenges established positions and makes offers more innovative."},
{l:["Price adjustment"],t:"Adjustment through prices",x:"Demand > supply: the price rises, demand falls and supply rises. Demand < supply: the price falls, until equilibrium."},
{l:["Information"],t:"Access to information",x:"It reduces uncertainty about prices and products and helps consumers choose well."},
{l:["Trust"],t:"Trust",x:"No exchange without trust. It is strengthened by guarantees (e.g. a quality standard for home care services)."}]},
{c:"a",l:["Failures"],t:"Market failures",x:"The State, regulators and international bodies oversee competition; businesses must also spot failures and adapt.",leaves:[
{l:["Asymmetric info"],t:"Asymmetric information",x:"Unequal access to information between players (seller/buyer, employer/candidate, insurer/insured): less transparency, a less efficient market."},
{l:["Used cars"],t:"The used-car example",x:"Platforms such as Carizy assess the vehicle and secure payment: they reduce the asymmetry and reassure buyer and seller."},
{l:["Entry barriers"],t:"Barriers to entry",x:"Obstacles to entering a market (high fixed costs, regulation, incumbent firms): they limit competition."},
{l:["Real competition"],t:"Imperfect competition",x:"In reality, markets are oligopolistic (few sellers) or monopolistic (each specific product gives its maker a small monopoly)."}]},
{c:"o",l:["Cooperation"],t:"Cooperation between businesses",x:"Joint growth: cooperating with other businesses while remaining legally independent.",leaves:[
{l:["Alliance"],t:"Alliance",x:"Cooperation between competing businesses."},
{l:["Partnership"],t:"Partnership",x:"Cooperation between non-competing businesses."},
{l:["Synergies"],t:"Why cooperate",x:"Synergies, access to another firm's know-how, creating a new market. Such agreements boost innovation and improve the offer."}]},
{c:"n",l:["Externalities"],t:"Externalities",x:"The effect of an activity on other agents without any payment or transaction.",leaves:[
{l:["Positive"],t:"Positive externalities",x:"Innovation, medical research, a better education system…"},
{l:["Negative"],t:"Negative externalities",x:"Pollution from an industrial site, traffic jams…"},
{l:["Market failure"],t:"A market failure",x:"The price does not reflect all the costs and benefits generated by the activity."},
{l:["CSR"],t:"CSR and sustainable development",x:"Businesses increasingly deal with their negative externalities through CSR, an alternative to government intervention."}]}]},
cards:[
["c","What is a market?","Where <mark>buyers' demand</mark> meets <mark>sellers' supply</mark> in order to make an exchange."],
["c","Which features define a market?","The <mark>object of exchange</mark> (goods, services…) and the <mark>scope</mark> of the market (local, national, global)."],
["c","On which markets does a business operate?","The <mark>goods and services</mark>, <mark>labour</mark> and <mark>capital</mark> markets: to sell, buy supplies, recruit and raise funds."],
["r","Why does competition make a market efficient?","It <mark>matches supply to demand</mark>, challenges established positions and pushes businesses to be more dynamic and <mark>innovative</mark>."],
["r","What happens if demand exceeds supply?","The <mark>price rises</mark>: demand falls and supply rises, until <mark>equilibrium</mark>."],
["r","How does a business set its price on a competitive market?","Based on its <mark>production costs</mark> and on how <mark>supply and demand</mark> meet."],
["r","Why are information and trust market rules?","Information <mark>reduces uncertainty</mark> and helps people choose; trust <mark>reassures</mark> players, often through guarantees (standards, labels)."],
["d","What is asymmetric information?","<mark>Unequal access to information</mark> between players on a market (seller/buyer, employer/candidate…): a lack of transparency that harms efficiency."],
["d","How can asymmetric information be reduced on the used-car market?","Platforms such as Carizy <mark>assess the vehicle</mark> and <mark>secure payment</mark>: information is rebalanced."],
["d","What is a barrier to entry?","An <mark>obstacle to entering</mark> a market (high fixed costs, regulation, incumbents) that limits competition."],
["d","Oligopolistic versus monopolistic competition?","Oligopolistic: <mark>few sellers</mark>. Monopolistic: each producer has a <mark>small monopoly</mark> thanks to its product's specific features."],
["x","Alliance or partnership?","Two forms of cooperation between legally independent businesses: an alliance between <mark>competitors</mark>, a partnership between <mark>non-competitors</mark>."],
["x","Why cooperate on a competitive market?","To create <mark>synergies</mark>, use another firm's know-how, create a new market; it boosts <mark>innovation</mark> and improves the offer."],
["x","What is an externality?","The <mark>positive or negative</mark> impact of an activity on other agents <mark>without payment</mark>. E.g. medical research (+), pollution (−)."],
["x","Why is an externality a market failure?","Because the <mark>price does not reflect</mark> all costs and benefits. <mark>CSR</mark> approaches help businesses deal with it."]],
qcm:[
["c","A market is:",["Where supply meets demand in order to make an exchange","Only a physical shop","A contract between two businesses","A public regulator"],"It can be local, national or global, physical or virtual."],
["c","Why does the silver economy attract businesses?",["Demand is rising sharply as the population ages","Prices are set by the State","There are no competitors","Demand is falling"],"New retirees have strong purchasing power and want quality services."],
["r","If supply exceeds demand:",["Prices fall until equilibrium","Prices rise","Demand falls","The market disappears"],"Lower prices attract buyers and discourage supply."],
["r","What is the effect of competition on supply?",["It makes it more dynamic and innovative","It makes it identical for all","It removes it","It makes it more expensive"],"Businesses want to keep their market share against competitors."],
["r","A quality standard for home care services mainly strengthens:",["Trust between customers and the business","Barriers to entry","Asymmetric information","Negative externalities"],"Guarantees that come with a sale reassure players."],
["d","An insurer knows little about the real risks of the person insured. This is:",["Asymmetric information","A barrier to entry","A positive externality","A partnership"],"Information is unequally shared between the two parties."],
["d","Very high fixed costs to enter a market are:",["A barrier to entry","An externality","An alliance","A monetary flow"],"They discourage potential entrants and limit competition."],
["d","A market dominated by a few sellers is in:",["Oligopolistic competition","Monopolistic competition","Perfect competition","Cooperative competition"],"In monopolistic competition, each specific product gives its maker a small monopoly."],
["x","Two competing businesses cooperate on a project while staying independent. This is:",["An alliance","A partnership","A merger","An externality"],"A partnership involves non-competing businesses."],
["x","Traffic jams are an example of:",["A negative externality","A positive externality","A barrier to entry","Asymmetric information"],"The activity imposes a cost on others without compensation."],
["x","Why is an externality a market failure?",["The price does not reflect all costs and benefits","It increases competition","It removes demand","It is forbidden by law"],"CSR approaches help businesses deal with negative externalities."],
["x","What is the main benefit of cooperation?",["Creating synergies and boosting innovation","Eliminating all competitors","Fixing prices together","Avoiding taxes"],"It improves the offer to consumers."]]}

T1["t1-formation-contrat"]={
fr:{intro:"Le contrat sécurise les relations de l'entreprise : de la négociation aux conditions de validité.",
cats:{n:["La négociation","v"],c:["Les conditions de validité","t"]},
map:{root:{l:["La formation","du contrat"],t:"La formation du contrat",x:"Le contrat stabilise les relations de l'entreprise (approvisionnements, fidélité des clients, relations interentreprises) et permet d'anticiper les litiges."},
groups:[{c:"v",cols:[0,1,2],l:["La négociation"],t:"Un processus de négociation",x:"Entre entreprises, le contrat n'est pas instantané : pourparlers et avant-contrats précèdent souvent l'accord définitif."},
{c:"t",cols:[3,4],l:["La validité"],t:"Les conditions de validité",x:"Le contrat n'est valablement formé que si les parties consentent librement, sont capables, et si son contenu est licite et certain. Sinon, il est nul."}],
cols:[
{c:"v",l:["Pourparlers"],t:"Les pourparlers",x:"Phase de négociation précontractuelle, fréquente entre professionnels vu les enjeux.",leaves:[
{l:["Liberté"],t:"Liberté des négociations",x:"L'initiative, le déroulement et la rupture des négociations sont libres (art. 1112 du Code civil). On peut négocier avec plusieurs partenaires."},
{l:["Bonne foi"],t:"Bonne foi",x:"Exigence impérative pendant toute la négociation."},
{l:["Rupture fautive"],t:"Rupture fautive",x:"Une rupture brutale, après de longues discussions ou avec intention de nuire, est sanctionnée."},
{l:["Dommages-intérêts"],t:"La sanction",x:"Sans contrat, la responsabilité est délictuelle : la victime de la rupture fautive obtient des dommages-intérêts."}]},
{c:"v",l:["Avant-contrats"],t:"Les avant-contrats",x:"De vrais contrats, dont l'obligation principale est de conclure le contrat définitif.",leaves:[
{l:["Promesse unilatérale"],t:"Promesse unilatérale de contrat",x:"Le promettant s'engage ; le bénéficiaire dispose d'une option pendant un délai convenu. Seul le promettant est obligé."},
{l:["Synallagmatique"],t:"Promesse synallagmatique",x:"Les deux parties s'engagent fermement sur le prix, la date et les modalités, souvent sous condition (ex. : obtention d'un prêt)."}]},
{c:"v",l:["Info & mandat"],t:"Information et représentation",x:"Deux mécanismes qui encadrent la phase précontractuelle.",leaves:[
{l:["Info précontract."],t:"Obligation d'information précontractuelle",x:"Art. 1112-1 : la partie qui connaît une information déterminante doit la donner à l'autre, si celle-ci l'ignore légitimement."},
{l:["Sanction"],t:"Sanction du défaut d'information",x:"Sans intention de tromper : dommages-intérêts (perte de chance, frais inutiles). En cas de vice du consentement : nullité."},
{l:["Représentation"],t:"La représentation",x:"Le représentant agit au nom du représenté. C'est ainsi que les personnes morales contractent, par leurs dirigeants."},
{l:["Mandat"],t:"Le mandat",x:"Le mandant confie au mandataire le soin de négocier en son nom (ex. : agent commercial). Le contrat conclu engage le mandant."}]},
{c:"t",l:["Consentement"],t:"Le consentement",x:"Rencontre d'une offre précise et d'une acceptation sans ambiguïté. Il doit être libre et non vicié.",leaves:[
{l:["Erreur"],t:"L'erreur",x:"Sur la substance (élément essentiel) ou sur la personne dans un contrat conclu intuitu personae. Il n'y a pas d'erreur sur la valeur."},
{l:["Dol"],t:"Le dol",x:"Erreur provoquée par les manœuvres du cocontractant, qui a été déterminante du consentement."},
{l:["Violence"],t:"La violence",x:"Consentement obtenu par la crainte : physique, psychologique ou économique (abus de l'état de dépendance, art. 1143)."},
{l:["CG contradictoires"],t:"Conditions générales",x:"Elles n'engagent l'autre partie que si elle les connaît et les accepte. En cas de conflit, les clauses incompatibles sont sans effet (art. 1119)."}]},
{c:"t",l:["Capacité, objet"],t:"Capacité et contenu",x:"Les parties doivent pouvoir s'engager, et le contrat doit porter sur une chose possible et permise.",leaves:[
{l:["Capacité"],t:"La capacité juridique",x:"Mineurs et majeurs sous tutelle ou curatelle sont protégés par une incapacité d'exercice."},
{l:["Contenu licite"],t:"Un contenu licite",x:"Le contrat ne doit pas porter atteinte à l'ordre public."},
{l:["Contenu certain"],t:"Un contenu certain",x:"La chose doit être déterminée ou déterminable, et exister ou exister à l'avenir."},
{l:["Nullité"],t:"La nullité",x:"Un contrat qui ne respecte pas les conditions de validité est nul."}]}]},
cards:[
["n","Pourquoi les entreprises ont-elles besoin de contrats ?","Pour <mark>stabiliser et sécuriser</mark> leurs relations (approvisionnements, fidélité des clients, relations interentreprises) et <mark>anticiper les litiges</mark>."],
["n","Que sont les pourparlers ?","La <mark>phase de négociation précontractuelle</mark> qui précède l'accord définitif, fréquente entre professionnels."],
["n","Peut-on rompre librement des pourparlers ?","Oui, le principe est la <mark>liberté</mark> (art. 1112), à condition d'être de <mark>bonne foi</mark>."],
["n","Quand la rupture des pourparlers est-elle fautive, et quelle est la sanction ?","Quand elle est <mark>brutale</mark>, après de longues discussions ou avec intention de nuire. Responsabilité <mark>délictuelle</mark> : dommages-intérêts."],
["n","Qu'est-ce qu'un avant-contrat ?","Un <mark>vrai contrat</mark> dont l'obligation principale est de <mark>conclure le contrat définitif</mark>, contrairement aux pourparlers."],
["n","Qu'est-ce qu'une promesse unilatérale de contrat ?","Le <mark>promettant</mark> s'engage à conclure ; le <mark>bénéficiaire</mark> dispose d'une option pendant un délai. Seul le promettant est obligé."],
["n","Qu'est-ce qu'une promesse synallagmatique ?","Les <mark>deux parties</mark> s'engagent fermement sur le prix, la date et les modalités, souvent sous <mark>condition</mark> (obtention d'un prêt)."],
["n","Que prévoit l'obligation d'information précontractuelle ?","La partie qui connaît une <mark>information déterminante</mark> pour le consentement de l'autre doit la lui donner si celle-ci l'<mark>ignore légitimement</mark> (art. 1112-1)."],
["n","Qu'est-ce que la représentation ? Et le mandat ?","Le <mark>représentant</mark> agit au nom du représenté. Le <mark>mandat</mark> est l'acte par lequel le mandant confie au mandataire le soin de négocier en son nom."],
["c","Quelles sont les conditions de validité d'un contrat ?","Un <mark>consentement</mark> libre et non vicié, la <mark>capacité</mark> des parties, un <mark>contenu licite et certain</mark>."],
["c","Comment se forme le consentement ?","Par la rencontre d'une <mark>offre précise</mark> et d'une <mark>acceptation sans ambiguïté</mark>."],
["c","Quels sont les trois vices du consentement ?","L'<mark>erreur</mark>, le <mark>dol</mark> et la <mark>violence</mark>. Ils peuvent entraîner la nullité du contrat."],
["c","Sur quoi peut porter l'erreur ?","Sur la <mark>substance</mark> (élément essentiel) ou sur la <mark>personne</mark>, seulement dans un contrat conclu intuitu personae. Jamais sur la valeur."],
["c","Qu'est-ce que le dol ?","Une <mark>erreur provoquée</mark> par les manœuvres du cocontractant, qui a été <mark>déterminante</mark> du consentement."],
["c","Qu'est-ce que la violence économique ?","Le fait d'<mark>abuser de l'état de dépendance</mark> d'un cocontractant pour obtenir un engagement qu'il n'aurait pas pris autrement (art. 1143)."],
["c","Qui est frappé d'incapacité d'exercice ?","Les <mark>mineurs</mark> et les <mark>majeurs sous tutelle ou curatelle</mark>, protégés en raison de leur inexpérience ou de l'altération de leurs facultés."],
["c","Que signifie un contenu licite et certain ?","<mark>Licite</mark> : il respecte l'ordre public. <mark>Certain</mark> : la chose est déterminée ou déterminable, existe ou existera."]],
qcm:[
["n","Selon l'article 1112 du Code civil, les négociations précontractuelles sont :",["Libres, mais doivent respecter la bonne foi","Obligatoirement écrites","Interdites entre concurrents","Toujours conclues par un contrat"],"Initiative, déroulement et rupture sont libres, sous l'exigence impérative de la bonne foi."],
["n","La rupture brutale de longs pourparlers engage une responsabilité :",["Délictuelle","Contractuelle","Pénale","Aucune"],"Il n'y a pas encore de contrat : la victime obtient des dommages-intérêts."],
["n","Quelle est la principale obligation créée par un avant-contrat ?",["Conclure le contrat définitif","Payer immédiatement le prix","Livrer le bien","Renoncer à toute négociation"],"Contrairement aux pourparlers, l'avant-contrat est un vrai contrat."],
["n","Dans une promesse unilatérale de contrat, qui est obligé ?",["Seulement le promettant","Seulement le bénéficiaire","Les deux parties","Aucune des parties"],"Le bénéficiaire dispose d'une option : il choisit de conclure ou non."],
["n","Une promesse synallagmatique conclue « sous réserve de l'obtention d'un prêt » :",["Engage les deux parties, sous condition","N'engage que l'acheteur","N'a aucune valeur","Est un simple pourparler"],"Les deux parties s'engagent fermement, mais la conclusion dépend de la réalisation de la condition."],
["n","Un agent commercial négocie au nom d'une entreprise. Il s'agit :",["D'un mandat","D'une promesse unilatérale","D'un dol","D'une violence économique"],"Le mandataire agit au nom du mandant, que le contrat conclu engage."],
["n","Le défaut d'information précontractuelle sans intention de tromper est sanctionné par :",["Des dommages-intérêts","La prison","Une amende fiscale","Rien du tout"],"Exemples de préjudice : perte d'une chance de ne pas contracter, frais engagés inutilement."],
["c","Lequel n'est PAS un vice du consentement ?",["La lésion sur la valeur","L'erreur","Le dol","La violence"],"Il n'y a pas d'erreur sur la valeur : les trois vices sont l'erreur, le dol et la violence."],
["c","Un vendeur maquille le compteur d'un véhicule pour convaincre l'acheteur. C'est :",["Un dol","Une erreur spontanée","Une violence","Une incapacité"],"Le dol est une erreur provoquée par les manœuvres du cocontractant."],
["c","L'erreur sur la personne n'est admise que :",["Dans les contrats conclus intuitu personae","Dans tous les contrats","Dans les contrats de vente","Jamais"],"Intuitu personae : le contrat est conclu en considération de la personne du cocontractant."],
["c","Abuser de la dépendance économique d'un fournisseur pour lui imposer des conditions excessives constitue :",["Une violence","Un dol","Une erreur sur la substance","Une promesse synallagmatique"],"L'abus de l'état de dépendance est un cas de violence depuis la réforme de 2016 (art. 1143)."],
["c","Un contrat qui ne respecte pas les conditions de validité est :",["Nul","Résilié","Suspendu","Renégocié automatiquement"],"Les conditions : consentement non vicié, capacité, contenu licite et certain."]]},

en:{intro:"Contracts secure the business's relationships: from negotiation to the conditions of validity.",
cats:{n:["Negotiation","v"],c:["Conditions of validity","t"]},
map:{root:{l:["Forming","a contract"],t:"Forming a contract",x:"Contracts stabilise the business's relationships (supplies, customer loyalty, business-to-business relations) and help anticipate disputes."},
groups:[{c:"v",cols:[0,1,2],l:["Negotiation"],t:"A negotiation process",x:"Between businesses, a contract is not instant: negotiations and preliminary contracts often come before the final agreement."},
{c:"t",cols:[3,4],l:["Validity"],t:"Conditions of validity",x:"A contract is only validly formed if the parties freely consent, have legal capacity, and its content is lawful and certain. Otherwise it is void."}],
cols:[
{c:"v",l:["Negotiations"],t:"Pre-contractual negotiations",x:"The negotiation phase before the contract, common between professionals given what is at stake.",leaves:[
{l:["Freedom"],t:"Freedom to negotiate",x:"Starting, conducting and ending negotiations is free (French Civil Code, art. 1112). You may negotiate with several partners."},
{l:["Good faith"],t:"Good faith",x:"A mandatory requirement throughout negotiations."},
{l:["Wrongful break-off"],t:"Wrongful break-off",x:"Breaking off abruptly, after long talks or with intent to harm, is sanctioned."},
{l:["Damages"],t:"The sanction",x:"With no contract yet, liability is non-contractual (tort): the victim is awarded damages."}]},
{c:"v",l:["Preliminary"],t:"Preliminary contracts",x:"Real contracts whose main obligation is to conclude the final contract.",leaves:[
{l:["Unilateral promise"],t:"Unilateral promise to contract",x:"The promisor commits; the beneficiary has an option for an agreed period. Only the promisor is bound."},
{l:["Bilateral promise"],t:"Bilateral (synallagmatic) promise",x:"Both parties firmly commit on price, date and terms, often subject to a condition (e.g. getting a loan)."}]},
{c:"v",l:["Info & agency"],t:"Information and representation",x:"Two mechanisms that frame the pre-contractual phase.",leaves:[
{l:["Duty to inform"],t:"Pre-contractual duty to inform",x:"Art. 1112-1: a party who knows information decisive for the other's consent must disclose it if the other is legitimately unaware of it."},
{l:["Sanction"],t:"Failure to inform",x:"Without intent to deceive: damages (lost chance, wasted costs). If consent was vitiated: the contract can be voided."},
{l:["Representation"],t:"Representation",x:"The representative acts in the name of the person represented. This is how legal entities contract, through their managers."},
{l:["Agency"],t:"Agency (mandate)",x:"The principal instructs an agent to negotiate on its behalf (e.g. a sales agent). The contract binds the principal."}]},
{c:"t",l:["Consent"],t:"Consent",x:"A precise offer meeting an unambiguous acceptance. It must be free and not vitiated.",leaves:[
{l:["Mistake"],t:"Mistake",x:"About the substance (an essential element) or about the person in a contract based on the person's identity. A mistake about value does not count."},
{l:["Fraud"],t:"Fraud (dol)",x:"A mistake caused by the other party's deceptive conduct, which was decisive for consent."},
{l:["Duress"],t:"Duress (violence)",x:"Consent obtained through fear: physical, psychological or economic (abuse of dependency, art. 1143)."},
{l:["Conflicting T&Cs"],t:"General terms and conditions",x:"They bind the other party only if it knew and accepted them. If they conflict, incompatible clauses have no effect (art. 1119)."}]},
{c:"t",l:["Capacity, object"],t:"Capacity and content",x:"The parties must be able to commit, and the contract must concern something possible and lawful.",leaves:[
{l:["Capacity"],t:"Legal capacity",x:"Minors and protected adults (under guardianship or curatorship) are protected by legal incapacity."},
{l:["Lawful content"],t:"Lawful content",x:"The contract must not breach public policy."},
{l:["Certain content"],t:"Certain content",x:"The subject must be determined or determinable, and exist now or in the future."},
{l:["Nullity"],t:"Nullity",x:"A contract that fails the conditions of validity is void."}]}]},
cards:[
["n","Why do businesses need contracts?","To <mark>stabilise and secure</mark> their relationships (supplies, customer loyalty, business relations) and <mark>anticipate disputes</mark>."],
["n","What are pre-contractual negotiations?","The <mark>negotiation phase</mark> before the final agreement, common between professionals."],
["n","Can negotiations be broken off freely?","Yes, the principle is <mark>freedom</mark> (art. 1112), provided the parties act in <mark>good faith</mark>."],
["n","When is breaking off negotiations wrongful, and what is the sanction?","When it is <mark>abrupt</mark>, after long talks or with intent to harm. <mark>Non-contractual</mark> liability: damages."],
["n","What is a preliminary contract?","A <mark>real contract</mark> whose main obligation is to <mark>conclude the final contract</mark>, unlike mere negotiations."],
["n","What is a unilateral promise to contract?","The <mark>promisor</mark> commits to contract; the <mark>beneficiary</mark> has an option for a set period. Only the promisor is bound."],
["n","What is a bilateral (synallagmatic) promise?","<mark>Both parties</mark> firmly commit on price, date and terms, often subject to a <mark>condition</mark> (getting a loan)."],
["n","What is the pre-contractual duty to inform?","A party who knows <mark>decisive information</mark> for the other's consent must share it if the other is <mark>legitimately unaware</mark> of it (art. 1112-1)."],
["n","What is representation? And agency?","A <mark>representative</mark> acts in another person's name. <mark>Agency</mark> is the act by which a principal instructs an agent to negotiate on its behalf."],
["c","What are the conditions of validity of a contract?","Free and unvitiated <mark>consent</mark>, the parties' <mark>capacity</mark>, and <mark>lawful and certain content</mark>."],
["c","How is consent formed?","By a <mark>precise offer</mark> meeting an <mark>unambiguous acceptance</mark>."],
["c","What are the three defects of consent?","<mark>Mistake</mark>, <mark>fraud</mark> and <mark>duress</mark>. They can make the contract void."],
["c","What can a mistake relate to?","The <mark>substance</mark> (an essential element) or the <mark>person</mark>, only in a contract based on the person's identity. Never the value."],
["c","What is fraud (dol)?","A <mark>mistake caused</mark> by the other party's deceptive conduct, which was <mark>decisive</mark> for consent."],
["c","What is economic duress?","<mark>Abusing a party's dependency</mark> to obtain a commitment it would not otherwise have made (art. 1143)."],
["c","Who lacks legal capacity to contract?","<mark>Minors</mark> and <mark>protected adults</mark> (guardianship or curatorship), because of inexperience or impaired faculties."],
["c","What does lawful and certain content mean?","<mark>Lawful</mark>: it respects public policy. <mark>Certain</mark>: the subject is determined or determinable and exists or will exist."]],
qcm:[
["n","Under art. 1112 of the French Civil Code, pre-contractual negotiations are:",["Free, but must respect good faith","Always in writing","Forbidden between competitors","Always concluded by a contract"],"Starting, conducting and ending them is free, with good faith as a mandatory requirement."],
["n","Abruptly ending long negotiations creates:",["Non-contractual liability","Contractual liability","Criminal liability","No liability"],"There is no contract yet: the victim is awarded damages."],
["n","What is the main obligation created by a preliminary contract?",["To conclude the final contract","To pay the price immediately","To deliver the goods","To stop negotiating"],"Unlike negotiations, a preliminary contract is a real contract."],
["n","In a unilateral promise to contract, who is bound?",["Only the promisor","Only the beneficiary","Both parties","Neither party"],"The beneficiary has an option: they choose whether to contract."],
["n","A bilateral promise signed 'subject to obtaining a loan':",["Binds both parties, subject to the condition","Binds only the buyer","Has no value","Is mere negotiation"],"Both parties firmly commit, but completion depends on the condition being met."],
["n","A sales agent negotiates in a company's name. This is:",["Agency","A unilateral promise","Fraud","Economic duress"],"The agent acts in the name of the principal, who is bound by the contract."],
["n","Failure to inform without intent to deceive is sanctioned by:",["Damages","Prison","A tax fine","Nothing"],"Examples of harm: lost chance of not contracting, wasted costs."],
["c","Which is NOT a defect of consent?",["A mistake about value","Mistake","Fraud","Duress"],"There is no mistake about value: the three defects are mistake, fraud and duress."],
["c","A seller tampers with a car's mileage to convince the buyer. This is:",["Fraud","A spontaneous mistake","Duress","Incapacity"],"Fraud is a mistake caused by the other party's deceptive conduct."],
["c","A mistake about the person is accepted only:",["In contracts based on the person's identity","In all contracts","In sales contracts","Never"],"Such contracts are concluded in consideration of who the other party is (intuitu personae)."],
["c","Abusing a supplier's economic dependency to impose excessive terms is:",["Duress","Fraud","A mistake about substance","A bilateral promise"],"Abuse of dependency has been a form of duress since the 2016 reform (art. 1143)."],
["c","A contract that fails the conditions of validity is:",["Void","Terminated","Suspended","Automatically renegotiated"],"Conditions: unvitiated consent, capacity, lawful and certain content."]]}
