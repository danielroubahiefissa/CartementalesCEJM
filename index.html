const GEN0=(()=>{const CONTENT={"t3-responsabilite":{"intro":"Responsabilité civile contractuelle et extracontractuelle.","cats":{"c":["Responsabilité contractuelle","v"],"e":["Responsabilité extracontractuelle","t"],"g":["Commun aux deux","n"]},"map":{"root":{"l":["Responsabilité","de l'entreprise"],"t":"La responsabilité civile","x":"Toute entreprise peut causer un dommage : à un cocontractant (contrat mal exécuté) ou à un tiers (accident, produit défectueux, fuite de données). Le droit organise la réparation dans les deux cas."},"groups":[{"l":["Contractuelle"],"t":"Responsabilité contractuelle","x":"Naît d'une faute dans l'exécution du contrat : inexécution totale, exécution partielle ou défectueuse, ou retard.","c":"v","cols":[0,1]},{"l":["Extracontractuelle"],"t":"Responsabilité extracontractuelle","x":"Dite aussi délictuelle : aucun contrat entre l'auteur et la victime (passants, concurrents, clients de ses clients, particuliers).","c":"t","cols":[2,3]}],"cols":[{"l":["A. Obligations"],"t":"Obligation de moyens ou de résultat","x":"Distinction jurisprudentielle essentielle : elle détermine qui doit prouver quoi, et comment le débiteur peut s'exonérer.","c":"v","leaves":[{"l":["Résultat"],"t":"Obligation de résultat","x":"Résultat précis promis (un transporteur livre à la date prévue). Le créancier prouve l'inexécution et le dommage : la faute est présumée. Exonération uniquement par une cause étrangère."},{"l":["Moyens"],"t":"Obligation de moyens","x":"Faire de son mieux sans garantir le résultat (un avocat, un cabinet de conseil). Le créancier prouve dommage, inexécution et faute. Le débiteur se libère en prouvant l'absence de faute."},{"l":["Critère : l'aléa"],"t":"Comment qualifier l'obligation ?","x":"Obligation de moyens si le résultat dépend du hasard ou de la participation active du client ; de résultat s'il n'y a pas d'aléa. La qualification suit la réalité de la prestation."}]},{"l":["B. Sanctions"],"t":"Sanctions de l'inexécution","x":"Cumulables avec des dommages-intérêts. Le juge vérifie si l'inexécution est prouvée, totale ou partielle, et excusable.","c":"v","leaves":[{"l":["Exécution forcée"],"t":"Exécution forcée en nature","x":"Le juge contraint le débiteur à exécuter, sauf disproportion manifeste. Impossible si la prestation ne peut plus être fournie."},{"l":["Réduction du prix"],"t":"Réduction du prix","x":"On accepte l'exécution imparfaite contre un prix diminué."},{"l":["Résolution"],"t":"Résolution","x":"Contrat à exécution instantanée : anéantissement rétroactif et restitutions réciproques."},{"l":["Résiliation"],"t":"Résiliation","x":"Contrat à exécution successive : seuls les effets futurs disparaissent."}]},{"l":["A. Fondements"],"t":"Fondements dans le Code civil","x":"Trois origines : le fait personnel, le fait des choses, le fait d'autrui.","c":"t","leaves":[{"l":["Fait personnel"],"t":"Fait personnel (art. 1240)","x":"Faute volontaire (dénigrer un concurrent) ou d'imprudence (sol mouillé non signalé)."},{"l":["Fait des choses"],"t":"Fait des choses","x":"Une chose dont on a la garde cause un dommage : enseigne mal fixée, machine, véhicule, produit."},{"l":["Fait d'autrui"],"t":"Fait d'autrui (art. 1242)","x":"L'employeur répond des dommages causés par son salarié dans ses fonctions (un livreur renverse un piéton)."},{"l":["Cyberattaque"],"t":"Victime… mais responsable ?","x":"Oui, si les protections étaient insuffisantes face au risque connu. RGPD art. 82 : exonération seulement si le dommage n'est « nullement imputable »."}]},{"l":["B. Réparation"],"t":"Réparation du dommage","x":"Dommage patrimonial ou moral, réparé en nature ou par équivalent. La responsabilité peut remonter jusqu'aux dirigeants.","c":"t","leaves":[{"l":["Dommage matériel"],"t":"Dommage patrimonial","x":"Corporel ou matériel : par exemple une perte de chiffre d'affaires après la fermeture forcée d'un commerce."},{"l":["Dommage moral"],"t":"Dommage moral","x":"Inquiétude, perte de confiance. Selon la CJUE, indemnisable sans seuil de gravité : la simple crainte d'un usage abusif suffit."},{"l":["Nature / équivalent"],"t":"En nature ou par équivalent","x":"En nature : plus rare (remettre en état un bien endommagé). Par équivalent : dommages-intérêts, le plus fréquent."},{"l":["Dirigeants NIS 2"],"t":"Responsabilité des dirigeants","x":"NIS 2 renforce leur supervision des risques cyber ; responsabilité personnelle possible en cas de négligence caractérisée."}]}],"footer":{"caption":"Les trois conditions communes aux deux responsabilités","join":"+","items":[{"l":["Fait générateur"],"t":"Fait générateur","x":"L'événement à l'origine du dommage : inexécution, faute, fait d'une chose ou d'un salarié."},{"l":["Dommage"],"t":"Dommage","x":"Il doit être certain : matériel, corporel ou moral."},{"l":["Lien de causalité"],"t":"Lien de causalité","x":"Le dommage doit découler directement du fait générateur."}]}},"cards":[["c","Quand la responsabilité contractuelle est-elle engagée ?","Lorsqu'un dommage résulte d'une <mark>faute dans l'exécution d'un contrat</mark> : inexécution totale, exécution partielle ou défectueuse, ou retard dans l'exécution."],["c","D'où vient la distinction entre obligation de moyens et obligation de résultat ?","Elle est <mark>purement jurisprudentielle</mark>. Elle est essentielle car les règles de preuve et d'exonération diffèrent selon le cas."],["c","Qu'est-ce qu'une obligation de résultat ?","Le débiteur s'oblige à <mark>atteindre un résultat déterminé</mark>. Exemple : un transporteur s'engage à livrer une marchandise intacte, à l'adresse et à la date prévues."],["c","Obligation de résultat : que doit prouver le créancier ?","Seulement <mark>l'inexécution et son dommage</mark>. La faute du débiteur est présumée."],["c","Comment le débiteur d'une obligation de résultat peut-il s'exonérer ?","Uniquement en prouvant une <mark>cause étrangère</mark> : force majeure, fait d'un tiers ou faute de la victime. Prouver qu'il a « fait de son mieux » ne suffit pas."],["c","Qu'est-ce qu'une obligation de moyens ?","Le débiteur s'engage à <mark>mettre en œuvre tous les moyens raisonnables</mark> pour atteindre le résultat espéré, sans le garantir. Exemple : un avocat défend son client mais ne peut pas garantir de gagner le procès."],["c","Obligation de moyens : que doit prouver le créancier ?","Le <mark>dommage, l'inexécution et la faute du débiteur</mark> à l'origine de cette inexécution."],["c","Comment le débiteur d'une obligation de moyens peut-il s'exonérer ?","En prouvant <mark>l'absence de faute</mark> de sa part."],["c","Comment le juge distingue-t-il obligation de moyens et obligation de résultat ?","Il regarde surtout <mark>l'aléa</mark> et le <mark>rôle du client</mark>. Si le résultat dépend du hasard ou de la participation active du client (un cabinet de conseil chargé d'augmenter les ventes), c'est une obligation de moyens. S'il n'y a pas d'aléa (livrer une commande), c'est une obligation de résultat. La qualification suit la réalité de la prestation, pas la formule du contrat."],["c","Avec quoi les sanctions de l'inexécution sont-elles cumulables ?","Avec des <mark>dommages-intérêts</mark>."],["c","Qu'est-ce que l'exécution forcée en nature, et quand est-elle impossible ?","Le créancier demande au juge de <mark>contraindre le débiteur à exécuter</mark>. Irrecevable en cas de disproportion manifeste entre son coût pour le débiteur et son intérêt pour le créancier ; impossible si la prestation ne peut plus être fournie (un traiteur devait servir un mariage dont la date est passée)."],["c","En quoi consiste la réduction du prix ?","Le créancier <mark>accepte l'exécution imparfaite</mark> en contrepartie d'une diminution du prix à payer."],["c","Qu'est-ce que la résolution d'un contrat ?","Pour un contrat à <mark>exécution instantanée</mark> : le contrat est anéanti <mark>rétroactivement</mark>, les parties sont remises dans leur état antérieur (restitutions réciproques)."],["c","Qu'est-ce que la résiliation d'un contrat ?","Pour un contrat à <mark>exécution successive</mark> (bail commercial, abonnement, contrat d'entretien) : seuls les <mark>effets futurs</mark> sont anéantis, les prestations passées restent acquises."],["c","Qu'apprécie le tribunal face à une inexécution ?","Si l'inexécution est <mark>prouvée</mark>, si elle est <mark>totale ou partielle</mark>, et si elle est <mark>excusable</mark> (cause d'exonération compatible avec la nature de l'obligation)."],["e","Quand parle-t-on de responsabilité extracontractuelle ?","Lorsqu'il n'existe <mark>aucun lien contractuel</mark> entre l'auteur du dommage et la victime (on dit aussi délictuelle). Exemple : le camion de livraison d'une entreprise endommage la voiture d'un passant."],["e","Qu'est-ce que la responsabilité du fait personnel ?","Article 1240 du Code civil : une <mark>faute volontaire</mark> (dénigrer un concurrent pour lui faire perdre des clients) ou <mark>d'imprudence</mark> (ne pas signaler un sol mouillé dans un magasin) cause un dommage à autrui."],["e","Qu'est-ce que la responsabilité du fait des choses ?","On répond du dommage causé par une <mark>chose dont on a la garde</mark>. Exemple : l'enseigne mal fixée d'un magasin tombe et blesse un passant."],["e","Qu'est-ce que la responsabilité du fait d'autrui ?","Article 1242 : <mark>l'employeur répond des dommages causés par son salarié</mark> dans l'exercice de ses fonctions. Exemple : un livreur salarié renverse un piéton pendant sa tournée."],["e","Une entreprise victime d'une cyberattaque peut-elle être responsable envers les tiers ?","Oui, si elle a <mark>manqué à ses obligations de sécurité</mark> (absence de protections proportionnées au risque connu). Sa faute peut être retenue même si l'attaque vient d'un tiers malveillant."],["e","Que prévoit l'article 82 du RGPD ?","Une action en réparation spécifique : le responsable du traitement ne s'exonère qu'en prouvant que le dommage ne lui est <mark>« nullement imputable »</mark>."],["e","Le préjudice moral lié à une fuite de données est-il indemnisable sans usage constaté des données ?","Oui. Selon la jurisprudence européenne (CJUE), il est indemnisable <mark>sans seuil de gravité</mark> : la <mark>simple crainte légitime d'un usage abusif</mark> suffit."],["e","Quelles sont les deux formes de réparation ?","La <mark>réparation en nature</mark>, plus rare (ex. remettre en état la vitrine endommagée), et la <mark>réparation par équivalent</mark>, la plus fréquente : des dommages-intérêts."],["e","Les dirigeants peuvent-ils être personnellement responsables en matière de cybersécurité ?","Oui : la <mark>directive NIS 2</mark> renforce leurs obligations de supervision des risques cyber et peut engager leur responsabilité personnelle en cas de <mark>négligence caractérisée</mark>."],["g","Quelles sont les trois conditions de la responsabilité civile ?","Un <mark>fait dommageable</mark> (fait générateur), un <mark>dommage certain</mark>, et un <mark>lien de causalité</mark> entre les deux. Elles valent pour la responsabilité contractuelle comme extracontractuelle."],["g","Quelle différence entre dommage patrimonial et extrapatrimonial ?","Patrimonial : <mark>corporel ou matériel</mark> (ex. perte de chiffre d'affaires d'un commerce fermé après un dégât des eaux). Extrapatrimonial : <mark>moral</mark> (ex. souffrance d'une victime, atteinte à la réputation)."]],"qcm":[["c","Quand la responsabilité civile contractuelle est-elle engagée ?",["Lorsqu'un dommage résulte d'une faute dans l'exécution d'un contrat","Lorsqu'un dommage est causé à une personne sans aucun lien contractuel","Uniquement lorsqu'une infraction pénale est commise","Lorsqu'une entreprise refuse de signer un contrat"],"La faute peut être une inexécution totale, une exécution partielle ou défectueuse, ou un retard dans l'exécution."],["c","D'où provient la distinction entre obligation de moyens et obligation de résultat ?",["De la jurisprudence","D'un règlement européen","Du Code pénal","D'une convention collective"],"Cette distinction est purement jurisprudentielle. Elle est essentielle car les règles de preuve et d'exonération diffèrent selon le cas."],["c","Un transporteur s'engage à livrer une commande intacte à la date prévue. Il s'agit d'une obligation :",["De résultat","De moyens","De moyens renforcée","Extracontractuelle"],"Le transporteur s'oblige à atteindre un résultat déterminé, sans aléa particulier : c'est une obligation de résultat."],["c","Dans une obligation de résultat, que doit prouver le créancier ?",["Seulement l'inexécution et son dommage, la faute du débiteur étant présumée","Le dommage, l'inexécution et la faute du débiteur","Uniquement la faute du débiteur","Rien, le juge se charge de la preuve"],"Dans l'obligation de résultat, la faute du débiteur est présumée : le créancier n'a pas à la prouver."],["c","Comment le débiteur d'une obligation de résultat peut-il s'exonérer ?",["En prouvant une cause étrangère : force majeure, fait d'un tiers ou faute de la victime","En prouvant qu'il a fait de son mieux","En prouvant qu'il n'a commis aucune faute","Il ne peut jamais s'exonérer"],"Prouver l'absence de faute ne suffit pas : seule une cause étrangère permet au débiteur d'une obligation de résultat de s'exonérer."],["c","Dans une obligation de moyens, que doit prouver le créancier ?",["Le dommage, l'inexécution du contrat et la faute du débiteur","Seulement l'inexécution","Seulement le dommage","Une cause étrangère"],"Le débiteur d'une obligation de moyens peut, lui, se libérer en prouvant l'absence de faute de sa part."],["c","Un avocat s'engage à défendre son client, sans pouvoir garantir de gagner le procès. Il s'agit d'une obligation :",["De moyens","De résultat","Extracontractuelle","Sans valeur juridique"],"L'issue du procès comporte un aléa : l'avocat s'engage seulement à mettre en œuvre tous les moyens raisonnables."],["c","Quand l'exécution forcée en nature devient-elle impossible ?",["Lorsque la prestation ne peut plus être fournie, comme un traiteur qui devait servir un mariage dont la date est passée","Dès que le débiteur refuse d'exécuter","Lorsque le contrat a été signé en ligne","Lorsque le créancier a déjà payé"],"Elle est aussi irrecevable en cas de disproportion manifeste entre son coût pour le débiteur et son intérêt pour le créancier."],["c","Pour un contrat à exécution successive (bail, abonnement, contrat d'entretien), quelle sanction anéantit seulement les effets futurs ?",["La résiliation","La résolution","La réduction du prix","L'exécution forcée"],"Avec la résiliation, les prestations déjà exécutées ne sont pas remises en cause."],["c","Qu'est-ce que la résolution du contrat ?",["L'anéantissement rétroactif d'un contrat à exécution instantanée, avec restitutions réciproques","La suppression des seuls effets futurs du contrat","Une diminution du prix en contrepartie d'une exécution imparfaite","La renégociation amiable du contrat"],"Les parties sont remises dans l'état où elles se trouvaient avant la conclusion du contrat."],["e","Quand parle-t-on de responsabilité extracontractuelle (ou délictuelle) ?",["Lorsqu'il n'existe aucun lien contractuel entre la personne fautive et la victime","Lorsque le contrat a été mal exécuté","Lorsque les parties sont en pourparlers avancés","Lorsque le dommage est uniquement matériel"],"Exemple : le camion de livraison d'une entreprise endommage la voiture d'un passant, avec qui elle n'a aucun contrat."],["e","Une entreprise dénigre publiquement un concurrent, qui perd des clients. Sur quel fondement le concurrent peut-il agir ?",["Le fait personnel (article 1240 du Code civil)","Le fait d'autrui","La responsabilité contractuelle","La force majeure"],"Le fait personnel couvre la faute volontaire, comme ici, mais aussi la faute d'imprudence ou de négligence."],["e","Un livreur salarié renverse un piéton pendant sa tournée. L'employeur répond du dommage sur le fondement :",["Du fait d'autrui","Du fait personnel du piéton","De l'effet relatif du contrat","De la clause pénale"],"L'employeur répond des dommages causés par son salarié dans l'exercice de ses fonctions (article 1242)."],["e","L'enseigne mal fixée d'un magasin tombe et blesse un passant. Il s'agit de la responsabilité :",["Du fait d'une chose dont on a la garde","Du fait d'autrui","Contractuelle","Pénale uniquement"],"Le magasin a la garde de son enseigne : il répond du dommage qu'elle cause."],["e","Une entreprise victime d'une cyberattaque peut-elle être responsable envers les tiers dont les données ont fui ?",["Oui, si elle a manqué à ses obligations de sécurité","Non, jamais, car l'attaque vient d'un tiers malveillant","Oui, dans tous les cas, même avec une sécurité parfaite","Non, sauf si elle a payé la rançon"],"Si aucune mesure de protection proportionnée au risque connu n'a été prise, sa faute peut être retenue."],["e","Selon l'article 82 du RGPD, comment le responsable du traitement peut-il s'exonérer ?",["En prouvant que le fait dommageable ne lui est nullement imputable","En prouvant qu'il a été lui-même victime","En indemnisant symboliquement les victimes","En supprimant les données après la fuite"],"Le RGPD organise une action en réparation spécifique, avec une exonération très difficile à obtenir."],["e","Quelles sont les trois conditions de la responsabilité civile, contractuelle comme extracontractuelle ?",["Un fait dommageable, un dommage certain et un lien de causalité","Une faute pénale, une plainte et un jugement","Un contrat, une signature et un paiement","Une mise en demeure, un délai et une pénalité"],"Ces trois éléments doivent toujours être réunis pour engager la responsabilité civile."],["e","Selon la jurisprudence européenne récente, le préjudice moral lié à une fuite de données :",["Est indemnisable sans seuil de gravité, la simple crainte légitime d'un usage abusif suffisant","N'est jamais indemnisable","N'est indemnisable qu'en cas d'usurpation d'identité constatée","N'est indemnisable que pour les entreprises"],"L'inquiétude ou la perte de confiance constitue un dommage extrapatrimonial (moral) réparable."],["e","Quelle forme de réparation est la plus fréquente ?",["La réparation par équivalent, c'est-à-dire des dommages-intérêts","La réparation en nature","L'excuse publique","La fermeture de l'entreprise responsable"],"La réparation en nature (ex. remettre en état un bien endommagé) est plus rare en pratique."],["e","Que prévoit la directive européenne NIS 2 en matière de cybersécurité ?",["Elle renforce les obligations des dirigeants et peut engager leur responsabilité personnelle en cas de négligence caractérisée","Elle exonère les dirigeants de toute responsabilité","Elle interdit aux entreprises de stocker des données","Elle ne concerne que les particuliers"],"La responsabilité peut remonter jusqu'aux dirigeants, chargés de superviser les risques cyber."]]},"t4-relations-echange":{"intro":"Comment le numérique transforme les relations de l'entreprise avec ses clients, ses concurrents et ses partenaires.","cats":{"i":["Opportunités et partenariats","v"],"m":["Modalités d'échange","t"],"c":["Nouvelle concurrence","a"],"r":["Réseau et information","o"]},"map":{"root":{"l":["Le numérique","et l'entreprise"],"t":"Le numérique transforme l'environnement de l'entreprise","x":"Les entreprises investissent dans les outils numériques pour saisir des opportunités et optimiser leurs relations d'échange, en externe comme en interne."},"cols":[{"l":["Opportunités"],"t":"I. Opportunités et partenariats","x":"Nouveaux secteurs, nouvelles technologies : les entreprises doivent acquérir des compétences et nouer des partenariats.","c":"v","leaves":[{"l":["Nouveaux secteurs"],"t":"Nouveaux secteurs","x":"Hébergement et partage de données, objets connectés, intelligence artificielle…"},{"l":["Données (IoT)"],"t":"Les données","x":"L'Internet des objets fait exploser le volume de données : une source d'opportunités si elles sont bien exploitées."},{"l":["Compétences"],"t":"Nouvelles compétences","x":"Les entreprises doivent maîtriser ces nouvelles technologies pour rester sur le marché."},{"l":["Partenariats"],"t":"Partenariats","x":"Avec des entreprises des nouveaux secteurs, par exemple des spécialistes des applications mobiles."},{"l":["Cloud computing"],"t":"Cloud computing","x":"Se développer sans la contrainte du stockage des données."}]},{"l":["Échanges"],"t":"II. Nouvelles modalités d'échange","x":"Désintermédiation et réintermédiation des relations marchandes, dématérialisation des relations avec les administrations et les banques.","c":"t","leaves":[{"l":["Désintermédiation"],"t":"Désintermédiation","x":"Relation directe avec le client, sans intermédiaire, facilitée par les outils de communication numérique."},{"l":["Digital natives"],"t":"Digital natives","x":"Entreprises spécialisées sur un créneau, sans intermédiaire de la conception à la distribution : relation de proximité et personnalisée."},{"l":["Place de marché"],"t":"Place de marché","x":"Plateforme qui met en relation vendeurs et acheteurs dans un cadre sécurisé, contre une commission sur chaque vente."},{"l":["Réintermédiation"],"t":"Réintermédiation (plateformisation)","x":"Visibilité immédiate, notoriété et services pour le vendeur ; sécurité et choix pour le client. Mais perte de la relation directe et dépendance envers la plateforme."},{"l":["Dématérialisation"],"t":"Dématérialisation","x":"Passage du support matériel au numérique : relations plus rapides avec les administrations, trésorerie en temps réel avec les banques. Limites : déshumanisation et besoin de sécurité."}]},{"l":["Concurrence"],"t":"III. Une nouvelle concurrence","x":"Les pure players bousculent les acteurs traditionnels, qui ripostent ; les marketplaces se multiplient et se concurrencent.","c":"a","leaves":[{"l":["Pure players"],"t":"Pure players","x":"Entreprises présentes uniquement sur Internet dans un secteur précis : Amazon, Cdiscount, Vente privée."},{"l":["Banques en ligne"],"t":"L'exemple des banques en ligne","x":"Services exclusivement en ligne, clients autonomes, coûts de structure plus faibles : des tarifs plus attractifs."},{"l":["Riposte des banques"],"t":"La riposte des banques traditionnelles","x":"Offre en ligne, agences modernisées avec espaces connectés et de conseil : accessibilité et proximité."},{"l":["Rematérialisation"],"t":"Rematérialisation","x":"À contre-courant, des pure players comme Amazon ouvrent des activités physiques pour mieux rencontrer leurs clients."},{"l":["Marketplaces rivales"],"t":"Concurrence entre marketplaces","x":"Pure players et distributeurs traditionnels (Fnac, Darty, Auchan) créent tous leur place de marché."}]},{"l":["Réseau & info"],"t":"IV. Réseau et information","x":"Les externalités de réseau renforcent les grandes plateformes ; l'accès accéléré à l'information met la réputation des entreprises en jeu.","c":"o","leaves":[{"l":["Effet de réseau"],"t":"Externalités de réseau","x":"Positives ou négatives : plus une plateforme a d'utilisateurs, plus elle est performante et attire services tiers et nouveaux utilisateurs."},{"l":["Cercle vertueux"],"t":"Un cercle vertueux","x":"La valeur d'un réseau est proportionnelle au nombre de ses participants : les clients vont vers les plateformes nombreuses et bien notées."},{"l":["Info accélérée"],"t":"Accélération de l'accès à l'information","x":"Les consommateurs comparent, consultent les avis et demandent conseil avant d'acheter."},{"l":["Avis en ligne"],"t":"Les outils de l'avis client","x":"Comparateurs, live chats, applications d'avis et réseaux sociaux : le partage d'expérience est devenu primordial."},{"l":["E-réputation"],"t":"Protéger son e-réputation","x":"Les entreprises doivent surveiller leur réputation en ligne et multiplier les moyens de fidéliser leurs clients."}]}],"footer":{"caption":"Les types de places de marché","items":[{"l":["B2C"],"t":"B2C : Business to Consumer","x":"Vendeurs professionnels et particuliers : Amazon, Spartoo, Uber Eats, Deliveroo…"},{"l":["B2B"],"t":"B2B : Business to Business","x":"Vendeurs et acheteurs professionnels : Alibaba.com, Amazon Business…"},{"l":["C2C"],"t":"C2C : Consumer to Consumer","x":"Entre particuliers : Airbnb, Facebook Marketplace, BlaBlaCar…"},{"l":["Hybride"],"t":"Marketplace hybride","x":"Mélange de B2C et de C2C : eBay, PriceMinister."}]}},"cards":[["i","Quels nouveaux secteurs d'activité le numérique a-t-il fait naître ?","Des secteurs liés aux <mark>prestations informatiques</mark> : partage et hébergement des données, objets connectés, intelligence artificielle…"],["i","Pourquoi les données collectées sont-elles une opportunité pour les entreprises ?","Avec l'<mark>Internet des objets</mark>, le volume de données collectées explose. Ces données sont <mark>sources d'opportunités</mark> si elles sont bien exploitées."],["i","Comment les entreprises relèvent-elles le défi de la transformation numérique ?","En développant de <mark>nouvelles compétences</mark> et en nouant des <mark>partenariats</mark> avec les entreprises des nouveaux secteurs (spécialistes des applications mobiles, services de cloud computing…)."],["i","Quel est l'intérêt du cloud computing pour une entreprise ?","Il lui permet de <mark>se développer sans la contrainte du stockage de données</mark>, en confiant ce stockage à un prestataire spécialisé."],["m","Qu'est-ce que la désintermédiation ?","Une nouvelle modalité de mise en relation où l'entreprise entretient avec ses clients une <mark>relation directe, sans intermédiaire</mark>."],["m","Qu'est-ce qu'une digital native ?","Une entreprise <mark>spécialisée sur un créneau</mark> qui élimine tous les intermédiaires, de la conception à la distribution sur Internet. Elle crée une relation de proximité et personnalise les contacts."],["m","Qu'est-ce qui facilite la désintermédiation de la relation client ?","Les <mark>outils de communication numérique</mark> qui permettent un contact direct avec le client : Messenger, Twitter, Instagram…"],["m","Qu'est-ce qu'une place de marché (marketplace) ?","Un site Internet qui <mark>met en relation vendeurs et acheteurs</mark> dans un cadre sécurisé, moyennant une <mark>commission prélevée sur chaque vente</mark>."],["m","Qu'est-ce que la réintermédiation ?","Le retour d'un intermédiaire entre vendeurs et acheteurs, sous la forme d'une <mark>plateforme en ligne</mark>. On parle aussi de <mark>« plateformisation »</mark>."],["m","Quels avantages une place de marché offre-t-elle aux vendeurs ?","La <mark>notoriété de la plateforme</mark>, une <mark>visibilité immédiate</mark> et un développement plus rapide, ainsi que ses fonctionnalités : paiement, livraison, gestion des stocks…"],["m","Quels avantages une place de marché offre-t-elle aux clients ?","Un <mark>cadre sécurisé</mark> qui rassure et l'accès à un <mark>choix plus important</mark>."],["m","Quelles sont les limites d'une place de marché pour le vendeur ?","La <mark>relation directe avec le client disparaît</mark> et une réelle <mark>dépendance</mark> apparaît envers la plateforme."],["m","Qu'est-ce qu'une marketplace B2C ? Donne des exemples.","<mark>Business to Consumer</mark> : elle met en relation des vendeurs professionnels et des particuliers. Exemples : Amazon, Spartoo, Uber, Uber Eats, Deliveroo."],["m","Qu'est-ce qu'une marketplace B2B ? Donne des exemples.","<mark>Business to Business</mark> : elle met en relation des vendeurs et des acheteurs professionnels. Exemples : Alibaba.com, Amazon Business."],["m","Qu'est-ce qu'une marketplace C2C ? Donne des exemples.","<mark>Consumer to Consumer</mark> : elle met en relation des particuliers, entre non-professionnels. Exemples : Airbnb, Facebook Marketplace, BlaBlaCar."],["m","Qu'est-ce qu'une marketplace hybride ?","Une place de marché qui <mark>mélange ventes B2C et C2C</mark>. Exemples : eBay ou PriceMinister, d'abord destinées aux particuliers, qui accueillent aussi des vendeurs professionnels."],["m","Qu'est-ce que la dématérialisation ?","Le <mark>transfert des données d'un support matériel vers un support numérique</mark>. Elle s'applique à un processus complet et touche toute la relation client."],["m","Quels sont les avantages des relations dématérialisées avec les administrations et les banques ?","Avec les administrations : <mark>rapidité, efficacité</mark>, relations plus fluides, accès facilité à l'information. Avec les banques : informations sur la <mark>trésorerie en temps réel</mark> et gestion courante des flux financiers facilitée."],["m","Quelles sont les limites de la dématérialisation ?","Un risque de <mark>déshumanisation</mark> de la relation, et la nécessité de <mark>procédures de sécurité importantes</mark>."],["c","Qu'est-ce qu'un pure player ?","Une entreprise qui se développe <mark>uniquement sur Internet</mark> dans un secteur d'activité précis. Exemples : Amazon, Cdiscount, Vente privée."],["c","Pourquoi un pure player peut-il proposer des prix plus attractifs ?","Ses <mark>charges de fonctionnement et coûts de structure sont plus faibles</mark> que ceux des concurrents traditionnels (exemple des banques en ligne, où le client gère ses comptes en autonomie)."],["c","Comment les banques traditionnelles ont-elles réagi à la concurrence des banques en ligne ?","Certaines ont lancé leur propre <mark>offre en ligne</mark> ; d'autres ont modernisé leurs agences avec des <mark>espaces connectés et de conseil</mark>. Leur communication mise sur l'accessibilité en ligne et le conseil de proximité."],["c","Qu'est-ce que la rematérialisation ?","Le mouvement inverse de la dématérialisation : des pure players comme Amazon <mark>ouvrent des activités physiques</mark> pour aller plus loin que leur site web et mieux rencontrer leur clientèle."],["c","Pourquoi parle-t-on de concurrence entre les marketplaces ?","Face à leur essor, <mark>pure players et distributeurs traditionnels</mark> (Fnac, Darty, Auchan…) créent tous leur propre place de marché, en B2C comme en B2B."],["r","Qu'est-ce qu'une externalité de réseau ?","Un mécanisme, <mark>positif ou négatif</mark>, par lequel <mark>la valeur d'un réseau dépend du nombre de ses participants</mark>. Plus il y a d'utilisateurs, plus la plateforme est performante et attire des services tiers, qui attirent à leur tour de nouveaux utilisateurs."],["r","Pourquoi l'effet de réseau crée-t-il un cercle vertueux pour une place de marché ?","Un client est davantage attiré par une plateforme qui <mark>rassemble beaucoup de clients</mark> et dont les <mark>retours sont positifs</mark> : chaque nouvel utilisateur renforce son attractivité."],["r","Comment le numérique a-t-il transformé le processus d'achat ?","Les consommateurs <mark>consultent les avis en ligne</mark>, comparent et demandent conseil à d'autres acheteurs. Le <mark>partage de l'expérience client</mark> est devenu primordial dans l'acte d'achat."],["r","Quelles technologies sont à l'origine de cette accélération de l'accès à l'information ?","Les <mark>sites de comparaison</mark>, les <mark>live chats</mark> et toutes les applications qui permettent de laisser un avis et de partager son expérience sur les réseaux sociaux."],["r","Que doivent faire les entreprises face à la multiplication des avis en ligne ?","Être attentives et multiplier les moyens pour <mark>protéger leur e-réputation</mark> et <mark>fidéliser leurs clients</mark>."]],"qcm":[["i","Quel est l'intérêt du cloud computing pour une entreprise ?",["Se développer sans la contrainte du stockage des données","Ne plus avoir besoin de sécuriser ses données","Éviter toute relation avec des prestataires","Réduire le nombre de ses clients"],"Le stockage est confié à un prestataire spécialisé, ce qui libère l'entreprise de cette contrainte."],["i","Pourquoi les données collectées grâce à l'Internet des objets sont-elles une opportunité ?",["Leur volume explose et elles sont sources d'opportunités si elles sont bien exploitées","Elles sont gratuites à stocker et à traiter","Elles remplacent la stratégie de l'entreprise","Elles sont automatiquement protégées par la loi"],"Ce n'est pas la donnée en elle-même qui crée de la valeur, mais la façon dont l'entreprise l'exploite."],["i","Comment les entreprises relèvent-elles le défi de la transformation numérique ?",["En développant de nouvelles compétences et en nouant des partenariats","En conservant leurs outils actuels pour limiter les risques","En supprimant leur présence sur Internet","En refusant les nouvelles technologies"],"Par exemple, un partenariat avec un spécialiste des applications mobiles ou un fournisseur de cloud computing."],["m","Qu'est-ce que la désintermédiation ?",["Une relation directe entre l'entreprise et ses clients, sans intermédiaire","Le retour d'un intermédiaire sous la forme d'une plateforme","Le passage d'un support papier à un support numérique","L'ouverture de magasins physiques par un pure player"],"Elle est facilitée par les outils de communication numérique : Messenger, Instagram, Twitter…"],["m","Qu'est-ce qu'une digital native ?",["Une entreprise spécialisée sur un créneau qui élimine tous les intermédiaires, de la conception à la distribution sur Internet","Un salarié né avec Internet","Une entreprise qui vend uniquement en magasin","Une place de marché entre particuliers"],"Elle crée une relation de proximité avec ses clients et personnalise les contacts."],["m","Comment une place de marché est-elle rémunérée ?",["Par une commission prélevée sur chaque vente","Par un abonnement payé par les acheteurs","Uniquement par la publicité","Par des subventions publiques"],"Elle met en relation vendeurs et acheteurs dans un cadre sécurisé, en échange de cette commission."],["m","Quel autre nom donne-t-on à la réintermédiation ?",["La plateformisation","La dématérialisation","La rematérialisation","La désintermédiation"],"Un intermédiaire réapparaît entre vendeurs et acheteurs, sous la forme d'une plateforme en ligne."],["m","Quelle est la principale limite d'une place de marché pour le vendeur ?",["La perte de la relation directe avec le client et la dépendance envers la plateforme","Une visibilité plus faible qu'avec son propre site","L'impossibilité d'être payé en ligne","L'obligation de fermer ses magasins physiques"],"En contrepartie, le vendeur profite de la notoriété de la plateforme et de ses services (paiement, livraison, stocks)."],["m","Airbnb et BlaBlaCar sont des places de marché de type :",["C2C","B2B","B2C","Hybride"],"Consumer to Consumer : elles mettent en relation des particuliers, entre non-professionnels."],["m","Alibaba.com est une place de marché de type :",["B2B","C2C","B2C","Hybride"],"Business to Business : vendeurs et acheteurs y sont des professionnels, comme sur Amazon Business."],["m","Pourquoi eBay est-elle qualifiée de place de marché hybride ?",["Elle mélange des ventes B2C et C2C","Elle ne vend qu'aux entreprises","Elle possède aussi des magasins physiques","Elle est à la fois banque et vendeur"],"D'abord destinée aux particuliers, elle accueille aussi des vendeurs professionnels."],["m","Qu'est-ce que la dématérialisation ?",["Le transfert des données d'un support matériel vers un support numérique","La suppression des intermédiaires commerciaux","L'ouverture de boutiques par des sites Internet","La valeur d'un réseau liée au nombre d'utilisateurs"],"Elle s'applique à un processus complet et touche toute la relation client."],["m","Quelles sont les limites de la dématérialisation ?",["Un risque de déshumanisation et la nécessité de procédures de sécurité importantes","Des délais plus longs avec les administrations","L'impossibilité de suivre sa trésorerie","La disparition des banques"],"À l'inverse, elle rend les relations avec les administrations plus rapides et donne une trésorerie en temps réel."],["c","Qu'est-ce qu'un pure player ?",["Une entreprise qui se développe uniquement sur Internet dans un secteur précis","Une entreprise qui vend uniquement en magasin","Une plateforme gérée par l'État","Une entreprise sans aucun concurrent"],"Exemples : Amazon, Cdiscount, Vente privée."],["c","Pourquoi un pure player peut-il proposer des prix plus attractifs ?",["Ses charges de fonctionnement et ses coûts de structure sont plus faibles","Il reçoit des aides de l'État","Il ne paie pas de TVA","Il n'emploie aucun salarié"],"Exemple des banques en ligne : le client gère ses comptes en autonomie, sans agence physique."],["c","Qu'est-ce que la rematérialisation ?",["Des pure players qui ouvrent des activités physiques, comme Amazon","Le passage d'un support papier au numérique","La fermeture des agences bancaires","Le retour au paiement en espèces"],"C'est le mouvement inverse de la dématérialisation, pour mieux rencontrer la clientèle."],["c","Comment les banques traditionnelles ont-elles réagi à la concurrence des banques en ligne ?",["Avec une offre en ligne et des agences modernisées, dotées d'espaces connectés et de conseil","En fermant toutes leurs agences","En augmentant fortement leurs tarifs","En refusant tout service sur Internet"],"Leur communication mise sur l'accessibilité en ligne et le conseil de proximité."],["r","Qu'est-ce qu'une externalité de réseau ?",["Un mécanisme par lequel la valeur d'un réseau dépend du nombre de ses participants","Le coût d'une connexion Internet pour l'entreprise","La pollution liée aux serveurs informatiques","Un contrat entre deux plateformes"],"Elle peut être positive ou négative. Plus une plateforme a d'utilisateurs, plus elle attire de services tiers et de nouveaux utilisateurs."],["r","Comment le numérique a-t-il transformé le processus d'achat ?",["Les consommateurs consultent les avis, comparent et partagent leur expérience avant d'acheter","Les consommateurs achètent sans s'informer","Seul le vendeur informe désormais le client","La publicité télévisée est devenue la seule source d'information"],"Le partage de l'expérience client est devenu primordial, grâce aux comparateurs, live chats et réseaux sociaux."],["r","Que doivent faire les entreprises face à la multiplication des avis en ligne ?",["Protéger leur e-réputation et fidéliser leurs clients","Supprimer tous les avis négatifs","Ignorer les avis, qui n'ont pas d'influence","Interdire les sites de comparaison"],"Elles doivent être attentives et multiplier les moyens de préserver leur réputation en ligne."]]}};;return CONTENT;})(),SIO0=(()=>{const CONTENT={"t3-responsabilite":{"intro":"Responsabilité civile contractuelle et extracontractuelle.","cats":{"c":["Responsabilité contractuelle","v"],"e":["Responsabilité extracontractuelle","t"],"g":["Commun aux deux","n"]},"map":{"root":{"l":["Responsabilité","de l'entreprise"],"t":"La responsabilité civile","x":"Toute entreprise peut causer un dommage : à un cocontractant (contrat mal exécuté) ou à un tiers (cyberattaque, incident technique). Le droit organise la réparation dans les deux cas."},"groups":[{"l":["Contractuelle"],"t":"Responsabilité contractuelle","x":"Naît d'une faute dans l'exécution du contrat : inexécution totale, exécution partielle ou défectueuse, ou retard.","c":"v","cols":[0,1]},{"l":["Extracontractuelle"],"t":"Responsabilité extracontractuelle","x":"Dite aussi délictuelle : aucun contrat entre l'auteur et la victime (candidats, clients des clients, particuliers).","c":"t","cols":[2,3]}],"cols":[{"l":["A. Obligations"],"t":"Obligation de moyens ou de résultat","x":"Distinction jurisprudentielle essentielle : elle détermine qui doit prouver quoi, et comment le débiteur peut s'exonérer.","c":"v","leaves":[{"l":["Résultat"],"t":"Obligation de résultat","x":"Résultat précis promis (REF+ : 1re page en 3 mois). Le créancier prouve l'inexécution et le dommage : la faute est présumée. Exonération uniquement par une cause étrangère."},{"l":["Moyens"],"t":"Obligation de moyens","x":"Faire de son mieux sans garantir le résultat. Le créancier prouve dommage, inexécution et faute. Le débiteur se libère en prouvant l'absence de faute."},{"l":["Tendance IT"],"t":"Tendance en informatique","x":"Plutôt obligation de moyens (voire renforcée) : complexité technique et collaboration du client. La qualification suit la réalité technique."}]},{"l":["B. Sanctions"],"t":"Sanctions de l'inexécution","x":"Cumulables avec des dommages-intérêts. Le juge vérifie si l'inexécution est prouvée, totale ou partielle, et excusable.","c":"v","leaves":[{"l":["Exécution forcée"],"t":"Exécution forcée en nature","x":"Le juge contraint le débiteur à exécuter, sauf disproportion manifeste. Impossible si la prestation ne peut plus être fournie."},{"l":["Réduction du prix"],"t":"Réduction du prix","x":"On accepte l'exécution imparfaite contre un prix diminué."},{"l":["Résolution"],"t":"Résolution","x":"Contrat à exécution instantanée : anéantissement rétroactif et restitutions réciproques."},{"l":["Résiliation"],"t":"Résiliation","x":"Contrat à exécution successive : seuls les effets futurs disparaissent."}]},{"l":["A. Fondements"],"t":"Fondements dans le Code civil","x":"Trois origines : le fait personnel, le fait des choses, le fait d'autrui.","c":"t","leaves":[{"l":["Fait personnel"],"t":"Fait personnel (art. 1240)","x":"Faute volontaire (malveillance) ou d'imprudence (négligence dans la sécurisation du SI)."},{"l":["Fait des choses"],"t":"Fait des choses","x":"Une chose dont on a la garde cause un dommage : logiciel ou objet connecté défectueux."},{"l":["Fait d'autrui"],"t":"Fait d'autrui (art. 1242)","x":"L'employeur répond des dommages causés par son salarié dans ses fonctions."},{"l":["Cyberattaque"],"t":"Victime… mais responsable ?","x":"Oui, si les protections étaient insuffisantes face au risque connu. RGPD art. 82 : exonération seulement si le dommage n'est « nullement imputable »."}]},{"l":["B. Réparation"],"t":"Réparation du dommage","x":"Dommage patrimonial ou moral, réparé en nature ou par équivalent. La responsabilité peut remonter jusqu'aux dirigeants.","c":"t","leaves":[{"l":["Dommage matériel"],"t":"Dommage patrimonial","x":"Corporel ou matériel : par exemple une perte financière liée à l'indisponibilité d'un service."},{"l":["Dommage moral"],"t":"Dommage moral","x":"Inquiétude, perte de confiance. Selon la CJUE, indemnisable sans seuil de gravité : la simple crainte d'un usage abusif suffit."},{"l":["Nature / équivalent"],"t":"En nature ou par équivalent","x":"En nature : rare (restaurer le SI). Par équivalent : dommages-intérêts, le plus fréquent."},{"l":["Dirigeants NIS 2"],"t":"Responsabilité des dirigeants","x":"NIS 2 renforce leur supervision des risques cyber ; responsabilité personnelle possible en cas de négligence caractérisée."}]}],"footer":{"caption":"Les trois conditions communes aux deux responsabilités","join":"+","items":[{"l":["Fait générateur"],"t":"Fait générateur","x":"L'événement à l'origine du dommage : inexécution, faute, fait d'une chose ou d'un salarié."},{"l":["Dommage"],"t":"Dommage","x":"Il doit être certain : matériel, corporel ou moral."},{"l":["Lien de causalité"],"t":"Lien de causalité","x":"Le dommage doit découler directement du fait générateur."}]}},"cards":[["c","Quand la responsabilité contractuelle est-elle engagée ?","Lorsqu'un dommage résulte d'une <mark>faute dans l'exécution d'un contrat</mark> : inexécution totale, exécution partielle ou défectueuse, ou retard dans l'exécution."],["c","D'où vient la distinction entre obligation de moyens et obligation de résultat ?","Elle est <mark>purement jurisprudentielle</mark>. Elle est essentielle car les règles de preuve et d'exonération diffèrent selon le cas."],["c","Qu'est-ce qu'une obligation de résultat ?","Le débiteur s'oblige à <mark>atteindre un résultat déterminé</mark>. Exemple : REF+ s'engage à placer le site de son client en première page des moteurs de recherche dans les trois mois."],["c","Obligation de résultat : que doit prouver le créancier ?","Seulement <mark>l'inexécution et son dommage</mark>. La faute du débiteur est présumée."],["c","Comment le débiteur d'une obligation de résultat peut-il s'exonérer ?","Uniquement en prouvant une <mark>cause étrangère</mark> : force majeure, fait d'un tiers ou faute de la victime. Prouver qu'il a « fait de son mieux » ne suffit pas."],["c","Qu'est-ce qu'une obligation de moyens ?","Le débiteur s'engage à <mark>mettre en œuvre tous les moyens raisonnables</mark> pour atteindre le résultat espéré, sans le garantir. Exemple : une intégration logicielle complexe."],["c","Obligation de moyens : que doit prouver le créancier ?","Le <mark>dommage, l'inexécution et la faute du débiteur</mark> à l'origine de cette inexécution."],["c","Comment le débiteur d'une obligation de moyens peut-il s'exonérer ?","En prouvant <mark>l'absence de faute</mark> de sa part."],["c","Pourquoi les juges qualifient-ils de plus en plus les prestations informatiques d'obligations de moyens ?","En raison de la <mark>complexité technique</mark> des projets et de la <mark>nécessaire collaboration du client</mark> (cahier des charges, tests, validation). La qualification doit correspondre à la réalité technique, pas à une formule commerciale."],["c","Avec quoi les sanctions de l'inexécution sont-elles cumulables ?","Avec des <mark>dommages-intérêts</mark>."],["c","Qu'est-ce que l'exécution forcée en nature, et quand est-elle impossible ?","Le créancier demande au juge de <mark>contraindre le débiteur à exécuter</mark>. Irrecevable en cas de disproportion manifeste entre son coût pour le débiteur et son intérêt pour le créancier ; impossible si la prestation ne peut plus être fournie (données définitivement détruites)."],["c","En quoi consiste la réduction du prix ?","Le créancier <mark>accepte l'exécution imparfaite</mark> en contrepartie d'une diminution du prix à payer."],["c","Qu'est-ce que la résolution d'un contrat ?","Pour un contrat à <mark>exécution instantanée</mark> : le contrat est anéanti <mark>rétroactivement</mark>, les parties sont remises dans leur état antérieur (restitutions réciproques)."],["c","Qu'est-ce que la résiliation d'un contrat ?","Pour un contrat à <mark>exécution successive</mark> (hébergement, sauvegarde cloud, référencement) : seuls les <mark>effets futurs</mark> sont anéantis, les prestations passées restent acquises."],["c","Qu'apprécie le tribunal face à une inexécution ?","Si l'inexécution est <mark>prouvée</mark>, si elle est <mark>totale ou partielle</mark>, et si elle est <mark>excusable</mark> (cause d'exonération compatible avec la nature de l'obligation)."],["e","Quand parle-t-on de responsabilité extracontractuelle ?","Lorsqu'il n'existe <mark>aucun lien contractuel</mark> entre l'auteur du dommage et la victime (on dit aussi délictuelle). Exemple : candidats dont les données fuient après une cyberattaque."],["e","Qu'est-ce que la responsabilité du fait personnel ?","Article 1240 du Code civil : une <mark>faute volontaire</mark> (malveillance) ou <mark>d'imprudence</mark> (négligence dans la sécurisation d'un SI) cause un dommage à autrui."],["e","Qu'est-ce que la responsabilité du fait des choses ?","On répond du dommage causé par une <mark>chose dont on a la garde</mark>. Exemple : un logiciel ou un objet connecté défectueux blesse ou lèse un utilisateur non cocontractant."],["e","Qu'est-ce que la responsabilité du fait d'autrui ?","Article 1242 : <mark>l'employeur répond des dommages causés par son salarié</mark> dans l'exercice de ses fonctions. Exemple : une erreur de configuration entraînant une fuite de données."],["e","Une entreprise victime d'une cyberattaque peut-elle être responsable envers les tiers ?","Oui, si elle a <mark>manqué à ses obligations de sécurité</mark> (absence de protections proportionnées au risque connu). Sa faute peut être retenue même si l'attaque vient d'un tiers malveillant."],["e","Que prévoit l'article 82 du RGPD ?","Une action en réparation spécifique : le responsable du traitement ne s'exonère qu'en prouvant que le dommage ne lui est <mark>« nullement imputable »</mark>."],["e","Le préjudice moral lié à une fuite de données est-il indemnisable sans usage constaté des données ?","Oui. Selon la jurisprudence européenne (CJUE), il est indemnisable <mark>sans seuil de gravité</mark> : la <mark>simple crainte légitime d'un usage abusif</mark> suffit."],["e","Quelles sont les deux formes de réparation ?","La <mark>réparation en nature</mark>, rare (ex. restaurer un SI dans son état antérieur), et la <mark>réparation par équivalent</mark>, la plus fréquente : des dommages-intérêts."],["e","Les dirigeants peuvent-ils être personnellement responsables en matière de cybersécurité ?","Oui : la <mark>directive NIS 2</mark> renforce leurs obligations de supervision des risques cyber et peut engager leur responsabilité personnelle en cas de <mark>négligence caractérisée</mark>."],["g","Quelles sont les trois conditions de la responsabilité civile ?","Un <mark>fait dommageable</mark> (fait générateur), un <mark>dommage certain</mark>, et un <mark>lien de causalité</mark> entre les deux. Elles valent pour la responsabilité contractuelle comme extracontractuelle."],["g","Quelle différence entre dommage patrimonial et extrapatrimonial ?","Patrimonial : <mark>corporel ou matériel</mark> (ex. perte financière due à l'indisponibilité d'un service). Extrapatrimonial : <mark>moral</mark> (ex. inquiétude, perte de confiance après une fuite de données)."]],"qcm":[["c","Quand la responsabilité civile contractuelle est-elle engagée ?",["Lorsqu'un dommage résulte d'une faute dans l'exécution d'un contrat","Lorsqu'un dommage est causé à une personne sans aucun lien contractuel","Uniquement lorsqu'une infraction pénale est commise","Lorsqu'une entreprise refuse de signer un contrat"],"La faute peut être une inexécution totale, une exécution partielle ou défectueuse, ou un retard dans l'exécution."],["c","D'où provient la distinction entre obligation de moyens et obligation de résultat ?",["De la jurisprudence","D'un règlement européen","Du Code pénal","D'une convention collective"],"Cette distinction est purement jurisprudentielle. Elle est essentielle car les règles de preuve et d'exonération diffèrent selon le cas."],["c","REF+ s'engage à placer le site de son client en première page des moteurs de recherche dans les trois mois. Il s'agit d'une obligation :",["De résultat","De moyens","De moyens renforcée","Extracontractuelle"],"Le débiteur s'oblige à atteindre un résultat déterminé : c'est l'exemple d'obligation de résultat donné par le cours."],["c","Dans une obligation de résultat, que doit prouver le créancier ?",["Seulement l'inexécution et son dommage, la faute du débiteur étant présumée","Le dommage, l'inexécution et la faute du débiteur","Uniquement la faute du débiteur","Rien, le juge se charge de la preuve"],"Dans l'obligation de résultat, la faute du débiteur est présumée : le créancier n'a pas à la prouver."],["c","Comment le débiteur d'une obligation de résultat peut-il s'exonérer ?",["En prouvant une cause étrangère : force majeure, fait d'un tiers ou faute de la victime","En prouvant qu'il a fait de son mieux","En prouvant qu'il n'a commis aucune faute","Il ne peut jamais s'exonérer"],"Prouver l'absence de faute ne suffit pas : seule une cause étrangère permet au débiteur d'une obligation de résultat de s'exonérer."],["c","Dans une obligation de moyens, que doit prouver le créancier ?",["Le dommage, l'inexécution du contrat et la faute du débiteur","Seulement l'inexécution","Seulement le dommage","Une cause étrangère"],"Le débiteur d'une obligation de moyens peut, lui, se libérer en prouvant l'absence de faute de sa part."],["c","Comment les tribunaux qualifient-ils de plus en plus les obligations des prestataires informatiques ?",["D'obligations de moyens, voire de moyens renforcée","D'obligations de résultat systématiques","D'obligations extracontractuelles","D'obligations sans aucune valeur juridique"],"En raison de la complexité technique des projets et de la nécessaire collaboration du client (cahier des charges, tests, validation)."],["c","Quand l'exécution forcée en nature devient-elle impossible ?",["Lorsque la prestation ne peut plus matériellement être fournie, comme des données définitivement détruites","Dès que le débiteur refuse d'exécuter","Lorsque le contrat a été signé en ligne","Lorsque le créancier a déjà payé"],"Elle est aussi irrecevable en cas de disproportion manifeste entre son coût pour le débiteur et son intérêt pour le créancier."],["c","Pour un contrat à exécution successive (hébergement, sauvegarde cloud), quelle sanction anéantit seulement les effets futurs ?",["La résiliation","La résolution","La réduction du prix","L'exécution forcée"],"Avec la résiliation, les prestations déjà exécutées ne sont pas remises en cause."],["c","Qu'est-ce que la résolution du contrat ?",["L'anéantissement rétroactif d'un contrat à exécution instantanée, avec restitutions réciproques","La suppression des seuls effets futurs du contrat","Une diminution du prix en contrepartie d'une exécution imparfaite","La renégociation amiable du contrat"],"Les parties sont remises dans l'état où elles se trouvaient avant la conclusion du contrat."],["e","Quand parle-t-on de responsabilité extracontractuelle (ou délictuelle) ?",["Lorsqu'il n'existe aucun lien contractuel entre la personne fautive et la victime","Lorsque le contrat a été mal exécuté","Lorsque les parties sont en pourparlers avancés","Lorsque le dommage est uniquement matériel"],"Exemple : une cyberattaque expose les données de personnes qui n'ont pas contracté avec l'entreprise (candidats, clients de ses clients, particuliers)."],["e","Une entreprise néglige la sécurisation de son système d'information et cause un dommage à autrui. Sur quel fondement ?",["Le fait personnel (article 1240 du Code civil)","Le fait d'autrui","La responsabilité contractuelle","La force majeure"],"Le fait personnel couvre la faute volontaire comme la faute d'imprudence ou de négligence."],["e","Un salarié commet une erreur de configuration qui entraîne la fuite de données de tiers. L'employeur répond du dommage sur le fondement :",["Du fait d'autrui","Du fait personnel du tiers","De l'effet relatif du contrat","De la clause pénale"],"L'employeur répond des dommages causés par son salarié dans l'exercice de ses fonctions (article 1242)."],["e","Un objet connecté défectueux cause un dommage à un utilisateur qui n'est pas cocontractant. Il s'agit de la responsabilité :",["Du fait d'une chose dont on a la garde","Du fait d'autrui","Contractuelle","Pénale uniquement"],"On répond du dommage causé par une chose dont on a la garde, par exemple un logiciel ou un objet connecté défectueux."],["e","Une entreprise victime d'une cyberattaque peut-elle être responsable envers les tiers dont les données ont fui ?",["Oui, si elle a manqué à ses obligations de sécurité","Non, jamais, car l'attaque vient d'un tiers malveillant","Oui, dans tous les cas, même avec une sécurité parfaite","Non, sauf si elle a payé la rançon"],"Si aucune mesure de protection proportionnée au risque connu n'a été prise, sa faute peut être retenue."],["e","Selon l'article 82 du RGPD, comment le responsable du traitement peut-il s'exonérer ?",["En prouvant que le fait dommageable ne lui est nullement imputable","En prouvant qu'il a été lui-même victime","En indemnisant symboliquement les victimes","En supprimant les données après la fuite"],"Le RGPD organise une action en réparation spécifique, avec une exonération très difficile à obtenir."],["e","Quelles sont les trois conditions de la responsabilité civile, contractuelle comme extracontractuelle ?",["Un fait dommageable, un dommage certain et un lien de causalité","Une faute pénale, une plainte et un jugement","Un contrat, une signature et un paiement","Une mise en demeure, un délai et une pénalité"],"Ces trois éléments doivent toujours être réunis pour engager la responsabilité civile."],["e","Selon la jurisprudence européenne récente, le préjudice moral lié à une fuite de données :",["Est indemnisable sans seuil de gravité, la simple crainte légitime d'un usage abusif suffisant","N'est jamais indemnisable","N'est indemnisable qu'en cas d'usurpation d'identité constatée","N'est indemnisable que pour les entreprises"],"L'inquiétude ou la perte de confiance constitue un dommage extrapatrimonial (moral) réparable."],["e","Quelle forme de réparation est la plus fréquente dans le secteur numérique ?",["La réparation par équivalent, c'est-à-dire des dommages-intérêts","La réparation en nature","L'excuse publique","La fermeture de l'entreprise responsable"],"La réparation en nature (ex. restaurer un système d'information) est rare en pratique."],["e","Que prévoit la directive européenne NIS 2 en matière de cybersécurité ?",["Elle renforce les obligations des dirigeants et peut engager leur responsabilité personnelle en cas de négligence caractérisée","Elle exonère les dirigeants de toute responsabilité","Elle interdit aux entreprises de stocker des données","Elle ne concerne que les particuliers"],"La responsabilité peut remonter jusqu'aux dirigeants, chargés de superviser les risques cyber."]]},"t4-relations-echange":{"intro":"Comment le numérique transforme les relations de l'entreprise avec ses clients, ses concurrents et ses partenaires.","cats":{"i":["Opportunités et partenariats","v"],"m":["Modalités d'échange","t"],"c":["Nouvelle concurrence","a"],"r":["Réseau et information","o"]},"map":{"root":{"l":["Le numérique","et l'entreprise"],"t":"Le numérique transforme l'environnement de l'entreprise","x":"Les entreprises investissent dans les outils numériques pour saisir des opportunités et optimiser leurs relations d'échange, en externe comme en interne."},"cols":[{"l":["Opportunités"],"t":"I. Opportunités et partenariats","x":"Nouveaux secteurs, nouvelles technologies : les entreprises doivent acquérir des compétences et nouer des partenariats.","c":"v","leaves":[{"l":["Nouveaux secteurs"],"t":"Nouveaux secteurs","x":"Hébergement et partage de données, objets connectés, intelligence artificielle…"},{"l":["Données (IoT)"],"t":"Les données","x":"L'Internet des objets fait exploser le volume de données : une source d'opportunités si elles sont bien exploitées."},{"l":["Compétences"],"t":"Nouvelles compétences","x":"Les entreprises doivent maîtriser ces nouvelles technologies pour rester sur le marché."},{"l":["Partenariats"],"t":"Partenariats","x":"Avec des entreprises des nouveaux secteurs, par exemple des spécialistes des applications mobiles."},{"l":["Cloud computing"],"t":"Cloud computing","x":"Se développer sans la contrainte du stockage des données."}]},{"l":["Échanges"],"t":"II. Nouvelles modalités d'échange","x":"Désintermédiation et réintermédiation des relations marchandes, dématérialisation des relations avec les administrations et les banques.","c":"t","leaves":[{"l":["Désintermédiation"],"t":"Désintermédiation","x":"Relation directe avec le client, sans intermédiaire, facilitée par les outils de communication numérique."},{"l":["Digital natives"],"t":"Digital natives","x":"Entreprises spécialisées sur un créneau, sans intermédiaire de la conception à la distribution : relation de proximité et personnalisée."},{"l":["Place de marché"],"t":"Place de marché","x":"Plateforme qui met en relation vendeurs et acheteurs dans un cadre sécurisé, contre une commission sur chaque vente."},{"l":["Réintermédiation"],"t":"Réintermédiation (plateformisation)","x":"Visibilité immédiate, notoriété et services pour le vendeur ; sécurité et choix pour le client. Mais perte de la relation directe et dépendance envers la plateforme."},{"l":["Dématérialisation"],"t":"Dématérialisation","x":"Passage du support matériel au numérique : relations plus rapides avec les administrations, trésorerie en temps réel avec les banques. Limites : déshumanisation et besoin de sécurité."}]},{"l":["Concurrence"],"t":"III. Une nouvelle concurrence","x":"Les pure players bousculent les acteurs traditionnels, qui ripostent ; les marketplaces se multiplient et se concurrencent.","c":"a","leaves":[{"l":["Pure players"],"t":"Pure players","x":"Entreprises présentes uniquement sur Internet dans un secteur précis : Amazon, Cdiscount, Vente privée."},{"l":["Banques en ligne"],"t":"L'exemple des banques en ligne","x":"Services exclusivement en ligne, clients autonomes, coûts de structure plus faibles : des tarifs plus attractifs."},{"l":["Riposte des banques"],"t":"La riposte des banques traditionnelles","x":"Offre en ligne, agences modernisées avec espaces connectés et de conseil : accessibilité et proximité."},{"l":["Rematérialisation"],"t":"Rematérialisation","x":"À contre-courant, des pure players comme Amazon ouvrent des activités physiques pour mieux rencontrer leurs clients."},{"l":["Marketplaces rivales"],"t":"Concurrence entre marketplaces","x":"Pure players et distributeurs traditionnels (Fnac, Darty, Auchan) créent tous leur place de marché."}]},{"l":["Réseau & info"],"t":"IV. Réseau et information","x":"Les externalités de réseau renforcent les grandes plateformes ; l'accès accéléré à l'information met la réputation des entreprises en jeu.","c":"o","leaves":[{"l":["Effet de réseau"],"t":"Externalités de réseau","x":"Positives ou négatives : plus une plateforme a d'utilisateurs, plus elle est performante et attire services tiers et nouveaux utilisateurs."},{"l":["Cercle vertueux"],"t":"Un cercle vertueux","x":"La valeur d'un réseau est proportionnelle au nombre de ses participants : les clients vont vers les plateformes nombreuses et bien notées."},{"l":["Info accélérée"],"t":"Accélération de l'accès à l'information","x":"Les consommateurs comparent, consultent les avis et demandent conseil avant d'acheter."},{"l":["Avis en ligne"],"t":"Les outils de l'avis client","x":"Comparateurs, live chats, applications d'avis et réseaux sociaux : le partage d'expérience est devenu primordial."},{"l":["E-réputation"],"t":"Protéger son e-réputation","x":"Les entreprises doivent surveiller leur réputation en ligne et multiplier les moyens de fidéliser leurs clients."}]}],"footer":{"caption":"Les types de places de marché","items":[{"l":["B2C"],"t":"B2C : Business to Consumer","x":"Vendeurs professionnels et particuliers : Amazon, Spartoo, Uber Eats, Deliveroo…"},{"l":["B2B"],"t":"B2B : Business to Business","x":"Vendeurs et acheteurs professionnels : Alibaba.com, Amazon Business…"},{"l":["C2C"],"t":"C2C : Consumer to Consumer","x":"Entre particuliers : Airbnb, Facebook Marketplace, BlaBlaCar…"},{"l":["Hybride"],"t":"Marketplace hybride","x":"Mélange de B2C et de C2C : eBay, PriceMinister."}]}},"cards":[["i","Quels nouveaux secteurs d'activité le numérique a-t-il fait naître ?","Des secteurs liés aux <mark>prestations informatiques</mark> : partage et hébergement des données, objets connectés, intelligence artificielle…"],["i","Pourquoi les données collectées sont-elles une opportunité pour les entreprises ?","Avec l'<mark>Internet des objets</mark>, le volume de données collectées explose. Ces données sont <mark>sources d'opportunités</mark> si elles sont bien exploitées."],["i","Comment les entreprises relèvent-elles le défi de la transformation numérique ?","En développant de <mark>nouvelles compétences</mark> et en nouant des <mark>partenariats</mark> avec les entreprises des nouveaux secteurs (spécialistes des applications mobiles, services de cloud computing…)."],["i","Quel est l'intérêt du cloud computing pour une entreprise ?","Il lui permet de <mark>se développer sans la contrainte du stockage de données</mark>, en confiant ce stockage à un prestataire spécialisé."],["m","Qu'est-ce que la désintermédiation ?","Une nouvelle modalité de mise en relation où l'entreprise entretient avec ses clients une <mark>relation directe, sans intermédiaire</mark>."],["m","Qu'est-ce qu'une digital native ?","Une entreprise <mark>spécialisée sur un créneau</mark> qui élimine tous les intermédiaires, de la conception à la distribution sur Internet. Elle crée une relation de proximité et personnalise les contacts."],["m","Qu'est-ce qui facilite la désintermédiation de la relation client ?","Les <mark>outils de communication numérique</mark> qui permettent un contact direct avec le client : Messenger, Twitter, Instagram…"],["m","Qu'est-ce qu'une place de marché (marketplace) ?","Un site Internet qui <mark>met en relation vendeurs et acheteurs</mark> dans un cadre sécurisé, moyennant une <mark>commission prélevée sur chaque vente</mark>."],["m","Qu'est-ce que la réintermédiation ?","Le retour d'un intermédiaire entre vendeurs et acheteurs, sous la forme d'une <mark>plateforme en ligne</mark>. On parle aussi de <mark>« plateformisation »</mark>."],["m","Quels avantages une place de marché offre-t-elle aux vendeurs ?","La <mark>notoriété de la plateforme</mark>, une <mark>visibilité immédiate</mark> et un développement plus rapide, ainsi que ses fonctionnalités : paiement, livraison, gestion des stocks…"],["m","Quels avantages une place de marché offre-t-elle aux clients ?","Un <mark>cadre sécurisé</mark> qui rassure et l'accès à un <mark>choix plus important</mark>."],["m","Quelles sont les limites d'une place de marché pour le vendeur ?","La <mark>relation directe avec le client disparaît</mark> et une réelle <mark>dépendance</mark> apparaît envers la plateforme."],["m","Qu'est-ce qu'une marketplace B2C ? Donne des exemples.","<mark>Business to Consumer</mark> : elle met en relation des vendeurs professionnels et des particuliers. Exemples : Amazon, Spartoo, Uber, Uber Eats, Deliveroo."],["m","Qu'est-ce qu'une marketplace B2B ? Donne des exemples.","<mark>Business to Business</mark> : elle met en relation des vendeurs et des acheteurs professionnels. Exemples : Alibaba.com, Amazon Business."],["m","Qu'est-ce qu'une marketplace C2C ? Donne des exemples.","<mark>Consumer to Consumer</mark> : elle met en relation des particuliers, entre non-professionnels. Exemples : Airbnb, Facebook Marketplace, BlaBlaCar."],["m","Qu'est-ce qu'une marketplace hybride ?","Une place de marché qui <mark>mélange ventes B2C et C2C</mark>. Exemples : eBay ou PriceMinister, d'abord destinées aux particuliers, qui accueillent aussi des vendeurs professionnels."],["m","Qu'est-ce que la dématérialisation ?","Le <mark>transfert des données d'un support matériel vers un support numérique</mark>. Elle s'applique à un processus complet et touche toute la relation client."],["m","Quels sont les avantages des relations dématérialisées avec les administrations et les banques ?","Avec les administrations : <mark>rapidité, efficacité</mark>, relations plus fluides, accès facilité à l'information. Avec les banques : informations sur la <mark>trésorerie en temps réel</mark> et gestion courante des flux financiers facilitée."],["m","Quelles sont les limites de la dématérialisation ?","Un risque de <mark>déshumanisation</mark> de la relation, et la nécessité de <mark>procédures de sécurité importantes</mark>."],["c","Qu'est-ce qu'un pure player ?","Une entreprise qui se développe <mark>uniquement sur Internet</mark> dans un secteur d'activité précis. Exemples : Amazon, Cdiscount, Vente privée."],["c","Pourquoi un pure player peut-il proposer des prix plus attractifs ?","Ses <mark>charges de fonctionnement et coûts de structure sont plus faibles</mark> que ceux des concurrents traditionnels (exemple des banques en ligne, où le client gère ses comptes en autonomie)."],["c","Comment les banques traditionnelles ont-elles réagi à la concurrence des banques en ligne ?","Certaines ont lancé leur propre <mark>offre en ligne</mark> ; d'autres ont modernisé leurs agences avec des <mark>espaces connectés et de conseil</mark>. Leur communication mise sur l'accessibilité en ligne et le conseil de proximité."],["c","Qu'est-ce que la rematérialisation ?","Le mouvement inverse de la dématérialisation : des pure players comme Amazon <mark>ouvrent des activités physiques</mark> pour aller plus loin que leur site web et mieux rencontrer leur clientèle."],["c","Pourquoi parle-t-on de concurrence entre les marketplaces ?","Face à leur essor, <mark>pure players et distributeurs traditionnels</mark> (Fnac, Darty, Auchan…) créent tous leur propre place de marché, en B2C comme en B2B."],["r","Qu'est-ce qu'une externalité de réseau ?","Un mécanisme, <mark>positif ou négatif</mark>, par lequel <mark>la valeur d'un réseau dépend du nombre de ses participants</mark>. Plus il y a d'utilisateurs, plus la plateforme est performante et attire des services tiers, qui attirent à leur tour de nouveaux utilisateurs."],["r","Pourquoi l'effet de réseau crée-t-il un cercle vertueux pour une place de marché ?","Un client est davantage attiré par une plateforme qui <mark>rassemble beaucoup de clients</mark> et dont les <mark>retours sont positifs</mark> : chaque nouvel utilisateur renforce son attractivité."],["r","Comment le numérique a-t-il transformé le processus d'achat ?","Les consommateurs <mark>consultent les avis en ligne</mark>, comparent et demandent conseil à d'autres acheteurs. Le <mark>partage de l'expérience client</mark> est devenu primordial dans l'acte d'achat."],["r","Quelles technologies sont à l'origine de cette accélération de l'accès à l'information ?","Les <mark>sites de comparaison</mark>, les <mark>live chats</mark> et toutes les applications qui permettent de laisser un avis et de partager son expérience sur les réseaux sociaux."],["r","Que doivent faire les entreprises face à la multiplication des avis en ligne ?","Être attentives et multiplier les moyens pour <mark>protéger leur e-réputation</mark> et <mark>fidéliser leurs clients</mark>."]],"qcm":[["i","Quel est l'intérêt du cloud computing pour une entreprise ?",["Se développer sans la contrainte du stockage des données","Ne plus avoir besoin de sécuriser ses données","Éviter toute relation avec des prestataires","Réduire le nombre de ses clients"],"Le stockage est confié à un prestataire spécialisé, ce qui libère l'entreprise de cette contrainte."],["i","Pourquoi les données collectées grâce à l'Internet des objets sont-elles une opportunité ?",["Leur volume explose et elles sont sources d'opportunités si elles sont bien exploitées","Elles sont gratuites à stocker et à traiter","Elles remplacent la stratégie de l'entreprise","Elles sont automatiquement protégées par la loi"],"Ce n'est pas la donnée en elle-même qui crée de la valeur, mais la façon dont l'entreprise l'exploite."],["i","Comment les entreprises relèvent-elles le défi de la transformation numérique ?",["En développant de nouvelles compétences et en nouant des partenariats","En conservant leurs outils actuels pour limiter les risques","En supprimant leur présence sur Internet","En refusant les nouvelles technologies"],"Par exemple, un partenariat avec un spécialiste des applications mobiles ou un fournisseur de cloud computing."],["m","Qu'est-ce que la désintermédiation ?",["Une relation directe entre l'entreprise et ses clients, sans intermédiaire","Le retour d'un intermédiaire sous la forme d'une plateforme","Le passage d'un support papier à un support numérique","L'ouverture de magasins physiques par un pure player"],"Elle est facilitée par les outils de communication numérique : Messenger, Instagram, Twitter…"],["m","Qu'est-ce qu'une digital native ?",["Une entreprise spécialisée sur un créneau qui élimine tous les intermédiaires, de la conception à la distribution sur Internet","Un salarié né avec Internet","Une entreprise qui vend uniquement en magasin","Une place de marché entre particuliers"],"Elle crée une relation de proximité avec ses clients et personnalise les contacts."],["m","Comment une place de marché est-elle rémunérée ?",["Par une commission prélevée sur chaque vente","Par un abonnement payé par les acheteurs","Uniquement par la publicité","Par des subventions publiques"],"Elle met en relation vendeurs et acheteurs dans un cadre sécurisé, en échange de cette commission."],["m","Quel autre nom donne-t-on à la réintermédiation ?",["La plateformisation","La dématérialisation","La rematérialisation","La désintermédiation"],"Un intermédiaire réapparaît entre vendeurs et acheteurs, sous la forme d'une plateforme en ligne."],["m","Quelle est la principale limite d'une place de marché pour le vendeur ?",["La perte de la relation directe avec le client et la dépendance envers la plateforme","Une visibilité plus faible qu'avec son propre site","L'impossibilité d'être payé en ligne","L'obligation de fermer ses magasins physiques"],"En contrepartie, le vendeur profite de la notoriété de la plateforme et de ses services (paiement, livraison, stocks)."],["m","Airbnb et BlaBlaCar sont des places de marché de type :",["C2C","B2B","B2C","Hybride"],"Consumer to Consumer : elles mettent en relation des particuliers, entre non-professionnels."],["m","Alibaba.com est une place de marché de type :",["B2B","C2C","B2C","Hybride"],"Business to Business : vendeurs et acheteurs y sont des professionnels, comme sur Amazon Business."],["m","Pourquoi eBay est-elle qualifiée de place de marché hybride ?",["Elle mélange des ventes B2C et C2C","Elle ne vend qu'aux entreprises","Elle possède aussi des magasins physiques","Elle est à la fois banque et vendeur"],"D'abord destinée aux particuliers, elle accueille aussi des vendeurs professionnels."],["m","Qu'est-ce que la dématérialisation ?",["Le transfert des données d'un support matériel vers un support numérique","La suppression des intermédiaires commerciaux","L'ouverture de boutiques par des sites Internet","La valeur d'un réseau liée au nombre d'utilisateurs"],"Elle s'applique à un processus complet et touche toute la relation client."],["m","Quelles sont les limites de la dématérialisation ?",["Un risque de déshumanisation et la nécessité de procédures de sécurité importantes","Des délais plus longs avec les administrations","L'impossibilité de suivre sa trésorerie","La disparition des banques"],"À l'inverse, elle rend les relations avec les administrations plus rapides et donne une trésorerie en temps réel."],["c","Qu'est-ce qu'un pure player ?",["Une entreprise qui se développe uniquement sur Internet dans un secteur précis","Une entreprise qui vend uniquement en magasin","Une plateforme gérée par l'État","Une entreprise sans aucun concurrent"],"Exemples : Amazon, Cdiscount, Vente privée."],["c","Pourquoi un pure player peut-il proposer des prix plus attractifs ?",["Ses charges de fonctionnement et ses coûts de structure sont plus faibles","Il reçoit des aides de l'État","Il ne paie pas de TVA","Il n'emploie aucun salarié"],"Exemple des banques en ligne : le client gère ses comptes en autonomie, sans agence physique."],["c","Qu'est-ce que la rematérialisation ?",["Des pure players qui ouvrent des activités physiques, comme Amazon","Le passage d'un support papier au numérique","La fermeture des agences bancaires","Le retour au paiement en espèces"],"C'est le mouvement inverse de la dématérialisation, pour mieux rencontrer la clientèle."],["c","Comment les banques traditionnelles ont-elles réagi à la concurrence des banques en ligne ?",["Avec une offre en ligne et des agences modernisées, dotées d'espaces connectés et de conseil","En fermant toutes leurs agences","En augmentant fortement leurs tarifs","En refusant tout service sur Internet"],"Leur communication mise sur l'accessibilité en ligne et le conseil de proximité."],["r","Qu'est-ce qu'une externalité de réseau ?",["Un mécanisme par lequel la valeur d'un réseau dépend du nombre de ses participants","Le coût d'une connexion Internet pour l'entreprise","La pollution liée aux serveurs informatiques","Un contrat entre deux plateformes"],"Elle peut être positive ou négative. Plus une plateforme a d'utilisateurs, plus elle attire de services tiers et de nouveaux utilisateurs."],["r","Comment le numérique a-t-il transformé le processus d'achat ?",["Les consommateurs consultent les avis, comparent et partagent leur expérience avant d'acheter","Les consommateurs achètent sans s'informer","Seul le vendeur informe désormais le client","La publicité télévisée est devenue la seule source d'information"],"Le partage de l'expérience client est devenu primordial, grâce aux comparateurs, live chats et réseaux sociaux."],["r","Que doivent faire les entreprises face à la multiplication des avis en ligne ?",["Protéger leur e-réputation et fidéliser leurs clients","Supprimer tous les avis négatifs","Ignorer les avis, qui n'ont pas d'influence","Interdire les sites de comparaison"],"Elles doivent être attentives et multiplier les moyens de préserver leur réputation en ligne."]]}};;return CONTENT;})();

  const ch=CHAPS[id],G=getC(id);
  if(!ch||!G){location.hash='';return;}
  const C=G.c;YEAR=ch.y;EXNOW=(typeof EXS!=='undefined'&&EXS[id]&&EXS[id][BTS])||[];
  const title=chTitle(id,ch.t);
  document.title=title+' – CEJM';
  const tabs=[['carte',tr('tabMap')],['flashcards',tr('tabFc')],['qcm',tr('tabQcm')]];
  if(!tabs.some(t=>t[0]===tab))tab='carte';

    '<p class="crumb">'+btsLabel()+', '+tr('years')[ch.y].toLowerCase()+', '+tr('theme').toLowerCase()+' '+ch.thn+', '+domName(ch.dom).toLowerCase()+', '+tr('chapter')+' '+pad(ch.no)+'</p>'+
    '<h1>'+esc(title)+'</h1><p class="lede">'+esc(C.intro)+'</p>'+
    (G.fallback&&tr('fallback')?'<p class="note">'+tr('fallback')+'</p>':'')+
    '<div class="tabs" role="tablist">'+tabs.map(t=>'<button class="tab" role="tab" aria-selected="'+(t[0]===tab)+'" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+

  const pane=document.getElementById('pane');
  ({carte:mapView,flashcards:cardsView,qcm:qcmView})[tab](pane,C,id);
}
