/* ---------- Carte mentale ---------- */
const NS='http://www.w3.org/2000/svg';
function el(t,a,parent){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(parent)parent.appendChild(e);return e;}
let MAPMODE=null;
function mapView(pane,C){
  const mode=MAPMODE||(window.innerWidth<620?'liste':'carte');
  pane.innerHTML='<div class="mapbar"><div class="seg" role="group" aria-label="'+tr('display')+'">'+
    ['carte','liste'].map(m=>'<button data-m="'+m+'" aria-pressed="'+(m===mode)+'">'+(m==='carte'?tr('viewMap'):tr('viewList'))+'</button>').join('')+'</div></div><div class="box" id="mapbox"></div>';
  pane.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{MAPMODE=b.dataset.m;mapView(pane,C);});
  const box=document.getElementById('mapbox');
  mode==='carte'?drawMap(box,C.map):drawOutline(box,C.map);
  if(mode==='carte'&&EXNOW.length)box.insertAdjacentHTML('beforeend','<p class="legend"><i></i>'+esc(tr('legend',btsLabel()))+'</p>');
}
function drawMap(box,M){
  const n=M.cols.length,CW=166,GAP=14,MX=18;
  const W=MX*2+n*CW+(n-1)*GAP;
  const colX=i=>MX+i*(CW+GAP);
  const RR=Math.max(60,Math.max(...M.root.l.map(s=>s.length))*4.4+12),DY=2*(RR-60);
  const ROOT={x:W/2,y:74+(RR-60),r:RR};
  const hasG=!!M.groups;
  const gY=156+DY,gH=44,cY=hasG?236+DY:156+DY,cH=hasG?40:44,lY=cY+cH+28,LS=38,LH=30;
  const maxL=Math.max(...M.cols.map(c=>c.leaves.length));
  let bottom=lY+(maxL-1)*LS+LH;
  const fCapY=bottom+36,fY=fCapY+16,fH=34;
  const H=(M.footer?fY+fH:bottom)+14;
  box.innerHTML='<div class="mapscroll"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:'+Math.min(W,620)+'px" role="img" aria-label="'+tr('tabMap')+'"></svg></div>'+
    '<div id="det" aria-live="polite"><b>'+tr('clickBubble')+'</b>'+tr('clickHint')+'</div>';
  const svg=box.querySelector('svg');
  const lines=el('g',{fill:'none','stroke-width':2},svg);
  const nodes=el('g',{'text-anchor':'middle','dominant-baseline':'central'},svg);
  const curve=(x1,y1,x2,y2,c,w)=>el('path',{class:'ln-'+c,'stroke-width':w||2,d:'M'+x1+' '+y1+' Q'+x2+' '+(y1+(y2-y1)*.35)+' '+x2+' '+y2},lines);
  const det=box.querySelector('#det');
  function bubble(node,c,shape,x,y,w,h,big,key){
    const exs=key==null?[]:exFor(e=>e[0]===key);
    const g=el('g',{class:'bub '+c,tabindex:0,role:'button','aria-label':node.t},nodes);
    let cx,cy;
    if(shape==='c'){el('circle',{cx:x,cy:y,r:w},g);cx=x;cy=y;}
    else{el('rect',{x,y,width:w,height:h,rx:h/2},g);cx=x+w/2;cy=y+h/2;}
    if(exs.length&&shape!=='c')el('circle',{cx:x+w-3,cy:y+3,r:5,class:'exdot'},g);
    node.l.forEach((l,i)=>{const t=el('text',{x:cx,y:cy+(node.l.length>1?(i?10:-10):0),'font-size':big?15:13,'font-weight':big?700:400},g);t.textContent=l;});
    const act=()=>{nodes.querySelectorAll('.bub').forEach(b=>b.classList.remove('sel'));g.classList.add('sel');det.innerHTML='<b></b><span></span>';det.firstChild.textContent=node.t;det.lastChild.textContent=node.x;det.insertAdjacentHTML('beforeend',exHTML(exs));};
    g.addEventListener('click',act);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
  }
  // liens
  if(hasG){
    M.groups.forEach(gr=>{
      const x0=colX(gr.cols[0]),x1=colX(gr.cols[gr.cols.length-1])+CW;gr._x=x0+20;gr._w=x1-x0-40;
      const gx=gr._x+gr._w/2;curve(ROOT.x,ROOT.y+ROOT.r,gx,gY,gr.c);
      gr.cols.forEach(ci=>curve(gx,gY+gH,colX(ci)+CW/2,cY,gr.c,1.5));
    });
  }else M.cols.forEach((c,i)=>curve(ROOT.x,ROOT.y+ROOT.r,colX(i)+CW/2,cY,c.c));
  M.cols.forEach((c,i)=>{const x=colX(i)+CW/2;el('line',{class:'ln-'+c.c,'stroke-width':1,'stroke-dasharray':'3 3',x1:x,y1:cY+cH,x2:x,y2:lY+(c.leaves.length-1)*LS+LH/2},lines);});
  // bulles
  bubble(M.root,'n','c',ROOT.x,ROOT.y,ROOT.r,0,true);
  if(hasG)M.groups.forEach(gr=>bubble(gr,gr.c,'r',gr._x,gY,gr._w,gH,true));
  M.cols.forEach((c,i)=>{
    bubble(c,c.c,'r',colX(i)+5,cY,CW-10,cH,true,String(i));
    c.leaves.forEach((lf,j)=>bubble(lf,c.c,'s',colX(i)+5,lY+j*LS,CW-10,LH,false,i+'.'+j));
  });
  if(M.footer){
    const t=el('text',{x:W/2,y:fCapY,'font-size':13},nodes);t.style.fill='var(--muted)';t.textContent=M.footer.caption;
    const k=M.footer.items.length,fw=Math.min(150,(W-2*MX-(k-1)*40)/k),span=k*fw+(k-1)*40,fx=(W-span)/2;
    M.footer.items.forEach((it,i)=>{
      bubble(it,'n','s',fx+i*(fw+40),fY,fw,fH);
      if(M.footer.join&&i<k-1){const j=el('text',{x:fx+i*(fw+40)+fw+20,y:fY+fH/2,'font-size':20},nodes);j.textContent=M.footer.join;}
    });
  }
}
function drawOutline(box,M){
  let h='<div class="outline"><p class="intro"><b>'+esc(M.root.t)+'.</b> '+esc(M.root.x)+'</p>';
  const colHTML=(c,ci)=>'<details style="--c:var(--'+c.c+')"><summary>'+esc(c.t)+'</summary><p class="intro">'+esc(c.x)+'</p>'+(ci!=null?exHTML(exFor(e=>e[0]===String(ci))):'')+'<dl>'+
    c.leaves.map((l,j)=>'<dt>'+esc(l.t)+'</dt><dd>'+esc(l.x)+(ci!=null?exHTML(exFor(e=>e[0]===ci+'.'+j)):'')+'</dd>').join('')+'</dl></details>';
  if(M.groups)M.groups.forEach(g=>{h+='<p class="gtitle" style="color:var(--'+g.c+')">'+esc(g.t)+'</p><p class="intro">'+esc(g.x)+'</p>'+g.cols.map(i=>colHTML(M.cols[i],i)).join('');});
  else h+=M.cols.map((c,i)=>colHTML(c,i)).join('');
  if(M.footer)h+=colHTML({c:'n',t:M.footer.caption,x:'',leaves:M.footer.items});
  box.innerHTML=h+'</div>';
}



/* ---------- Flashcards ---------- */
function cardsView(pane,C,id){
  const CARDS=C.cards,CAT=C.cats;
  pane.innerHTML='<div class="bar"><div class="filters" role="group" aria-label="'+tr('filterAria')+'"><button class="chip" aria-pressed="true" data-f="all">'+tr('all')+'</button>'+
    Object.keys(CAT).map(k=>'<button class="chip" aria-pressed="false" data-f="'+k+'">'+esc(CAT[k][0])+'</button>').join('')+
    '</div><span class="count" id="count"></span></div>'+
    '<div id="deck"><div class="stage"><div class="card" id="card" tabindex="0" role="button" aria-label="'+tr('flip')+'">'+
    '<div class="face front"><div class="part" id="p1"></div><div class="fq" id="fq"></div><div class="hint">'+tr('hint')+'</div></div>'+
    '<div class="face back"><div class="part" id="p2"></div><div class="fa" id="fa"></div><div id="fex"></div></div></div></div>'+
    '<div class="ctrl"><button class="btn" id="prev">'+tr('prev')+'</button><button class="btn again" id="again">'+tr('again')+'</button><button class="btn know" id="know">'+tr('know')+'</button><button class="btn" id="shuf">'+tr('shuffle')+'</button></div>'+
    '<div class="score" id="score"></div></div>'+
    '<div class="done" id="done" hidden><h2>'+tr('deckDone')+'</h2><p id="doneTxt"></p><div class="ctrl"><button class="btn again" id="redo">'+tr('redo')+'</button><button class="btn" id="restart">'+tr('restart')+'</button></div></div>';
  const $=i=>document.getElementById(i);
  let filter='all',order=[],pos=0,known=new Set(),again=new Set();
  const base=()=>CARDS.map((c,i)=>i).filter(i=>filter==='all'||CARDS[i][0]===filter);
  function build(l){order=l;pos=0;known.clear();again.clear();$('deck').hidden=false;$('done').hidden=true;show();}
  function show(){
    const c=CARDS[order[pos]],card=$('card');
    card.classList.remove('flipped');card.style.setProperty('--c','var(--'+CAT[c[0]][1]+')');
    $('p1').textContent=$('p2').textContent=CAT[c[0]][0];
    $('fq').textContent=c[1];$('fa').innerHTML=c[2];$('fex').innerHTML=exHTML(exFor(e=>e[1]===order[pos]));
    $('count').textContent=tr('cardOf',pos+1,order.length);
    $('score').textContent=tr('knewScore',known.size,again.size);
    $('prev').disabled=pos===0;
  }
  function next(){if(pos<order.length-1){pos++;show();}else finish();}
  function finish(){$('deck').hidden=true;$('done').hidden=false;
    $('doneTxt').textContent=tr('doneTxt',known.size,order.length,again.size);
    $('redo').hidden=again.size===0;
    if(filter==='all'&&order.length===CARDS.length)saveProg(id,'fc',{known:known.size,total:CARDS.length});}
  const flip=()=>$('card').classList.toggle('flipped');
  $('card').onclick=flip;
  $('card').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}};
  document.onkeydown=e=>{if(!$('deck')||$('deck').hidden)return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft'&&pos>0){pos--;show();}};
  $('prev').onclick=()=>{if(pos>0){pos--;show();}};
  $('know').onclick=()=>{known.add(order[pos]);again.delete(order[pos]);next();};
  $('again').onclick=()=>{again.add(order[pos]);known.delete(order[pos]);next();};
  $('shuf').onclick=()=>build(shuffle(base()));
  $('restart').onclick=()=>build(base());
  $('redo').onclick=()=>build([...again]);
  pane.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;pane.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));build(base());});
  build(base());
}

/* ---------- QCM ---------- */
function qcmView(pane,C,id){
  const Q=C.qcm,CAT=C.cats;
  pane.innerHTML='<section id="quiz"><div class="top"><span id="num"></span><span id="sc"></span></div><div class="prog" aria-hidden="true"><div id="pbar"></div></div>'+
    '<div class="qcard" id="qcard"><div class="part" id="part"></div><h2 id="qq"></h2><div class="opts" id="opts" role="group" aria-labelledby="qq"></div><div class="fb" id="fb" hidden aria-live="polite"></div></div>'+
    '<div class="ctrl"><button class="btn main" id="next" hidden>'+tr('next')+'</button></div></section>'+
    '<section id="result" hidden><div class="res"><h2>'+tr('result')+'</h2><div class="big" id="big"></div><p id="msg"></p>'+
    '<div class="ctrl" style="justify-content:flex-start"><button class="btn main" id="retry">'+tr('retry')+'</button><button class="btn" id="retryMiss">'+tr('retryMiss')+'</button></div><div class="miss" id="miss"></div></div></section>';
  const $=i=>document.getElementById(i);
  let list=[],pos=0,good=0,missed=[],full=true;
  function start(ids){full=ids.length===Q.length;list=shuffle(ids).map(i=>({i,opts:shuffle([0,1,2,3])}));pos=0;good=0;missed=[];$('quiz').hidden=false;$('result').hidden=true;show();}
  function show(){
    const it=list[pos],q=Q[it.i];
    $('qcard').style.setProperty('--c','var(--'+CAT[q[0]][1]+')');$('part').textContent=CAT[q[0]][0];
    $('qq').textContent=q[1];
    $('num').textContent=tr('qOf',pos+1,list.length);$('sc').textContent=tr('score')+good;
    $('pbar').style.width=(pos/list.length*100)+'%';
    $('fb').hidden=true;$('next').hidden=true;
    const box=$('opts');box.innerHTML='';
    it.opts.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';b.dataset.o=o;
      b.innerHTML='<span class="l">'+'ABCD'[k]+'</span><span></span>';b.lastChild.textContent=q[2][o];
      b.onclick=()=>answer(b,o);box.appendChild(b);});
  }
  function answer(btn,o){
    const q=Q[list[pos].i],ok=o===0;
    pane.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.o===0)b.classList.add('ok');});
    if(!ok){btn.classList.add('ko');missed.push(list[pos].i);}else good++;
    const fb=$('fb');fb.hidden=false;fb.className='fb '+(ok?'ok':'ko');fb.innerHTML='<b></b><span></span>';
    fb.firstChild.textContent=ok?tr('good'):tr('bad')+q[2][0];
    fb.lastChild.textContent=q[3];
    $('sc').textContent=tr('score')+good;
    $('next').hidden=false;$('next').textContent=pos===list.length-1?tr('seeRes'):tr('next');$('next').focus();
  }
  $('next').onclick=()=>{if(pos<list.length-1){pos++;show();}else finish();};
  function finish(){
    $('quiz').hidden=true;$('result').hidden=false;
    const n=list.length,note=Math.round(good/n*200)/10;
    $('big').textContent=good+' / '+n;
    $('msg').textContent=tr('over20',LANG==='fr'?String(note).replace('.',','):String(note))+(good===n?tr('m100'):good/n>=.75?tr('m75'):good/n>=.5?tr('m50'):tr('m0'));
    if(full){const p=(PROG[id]||{}).qcm;if(!p||good>p.best)saveProg(id,'qcm',{best:good,total:n});}
    $('retryMiss').hidden=missed.length===0;
    const m=$('miss');m.innerHTML='';
    if(missed.length){const h=document.createElement('p');h.style.fontWeight='700';h.textContent=tr('toReview');m.appendChild(h);}
    missed.forEach(i=>{const d=document.createElement('div');d.innerHTML='<div class="rq"></div><div class="ra"></div><div></div>';
      d.children[0].textContent=Q[i][1];d.children[1].textContent=tr('goodAns')+Q[i][2][0];d.children[2].textContent=Q[i][3];m.appendChild(d);});
    window.scrollTo(0,0);
  }
  $('retry').onclick=()=>start(Q.map((_,i)=>i));
  $('retryMiss').onclick=()=>start([...missed]);
  start(Q.map((_,i)=>i));
}

/* ---------- Routeur ---------- */
function route(keepScroll){
  document.onkeydown=null;
  const y=window.scrollY;
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(!MODE)welcome();else if(p[0]&&CONTENT[p[0]]&&CHAPS[p[0]])chapter(p[0],p[1]);else home();
  window.scrollTo(0,keepScroll===true?y:0);
}
window.addEventListener('hashchange',()=>route());
route();

</script>
